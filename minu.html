    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/logo/icon-s-black.svg">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SUKODA">
    <link rel="preload" href="/assets/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <script>
    (function () {
      var bucket = window.SUKODA_MINU = window.SUKODA_MINU || {};
      var dict = bucket.dict = bucket.dict || {};
      var tabs = {
        tabKodu: { et: 'Kodu', en: 'Home', ru: 'Дом' },
        tabServices: { et: 'Teenused', en: 'Services', ru: 'Услуги' },
        tabFolder: { et: 'Kaust', en: 'Folder', ru: 'Папка' },
        tabMine: { et: 'Minu', en: 'Profile', ru: 'Профиль' }
      };
      Object.keys(tabs).forEach(function (key) { if (!dict[key]) dict[key] = tabs[key]; });
      if (!('serviceWorker' in navigator)) return;
      var once = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (once) return;
        once = true;
        window.location.reload();
      });
      navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).catch(function () {});
    })();
    </script>
    <script src="/push.js"></script>
    <script src="/assets/js/minu/kodu.js?v=13"></script>
    <script type="module" src="/assets/js/minu/mount.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
</head>
<body class="antialiased" x-data="{
    lang: localStorage.getItem('sukoda_lang') || 'et',
    token: localStorage.getItem('sukoda_portal_token') || '',
    authenticated: false,
    loading: true,

    loginEmail: '',
    loginSending: false,
    loginSent: false,
    loginDesk: false,
    loginError: '',

    order: null,

    viewer: null,
    bookings: [],
    activeTab: 'overview',
    locale() {
        if (this.lang === 'en') return 'en-GB';
        if (this.lang === 'ru') return 'ru-RU';
        return 'et-EE';
    },
    t(key, vars) {
        const row = (window.SUKODA_MINU && window.SUKODA_MINU.dict && window.SUKODA_MINU.dict[key]) || {};
        const s = row[this.lang] || row.et || key;
        if (!vars) return s;
        return String(s).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
    },
    get nextThing() {
        const pick = window.SUKODA_MINU && window.SUKODA_MINU.pickNextThing;
        return pick ? pick(this) : { kind: 'loading', eyebrow: '', title: '', body: '', action: '', thenLine: '', refId: '', pending: false };
    },
    runNext(kind) {
        const n = this.nextThing;
        const use = kind || (n && n.kind);
        if (!n || use === 'loading') return;
        if (use === 'welcome') { this.activeTab = 'extras'; this.openTelli('clean'); return; }
        if (use === 'welcome-fix') { this.activeTab = 'extras'; this.openTelli('fix'); return; }
        if (use === 'unpaid') { this.loadProfile(); return; }
        if (n.kind === 'request') {
            const r = (this.extras.requests || []).find((x) => x.id === n.refId);
            if (r) this.openThread(r);
            return;
        }
        if (n.kind === 'visit') {
            if (n.pending) { this.activeTab = 'visits'; return; }
            const b = (this.upcomingBookings || []).find((x) => x.id === n.refId);
            if (b) this.changeTime(b);
            return;
        }
        if (n.kind === 'away') { this.activeTab = 'visits'; return; }
        if (n.kind === 'profile') { this.activeTab = 'mine'; this.profileEditing = true; return; }
        if (n.kind === 'calm') {
            const s = (this.extras.catalogue || []).find((x) => x.id === 'warranty-claim');
            if (s) this.openRequest(s);
            else this.activeTab = 'extras';
        }
    },

    homeProfile: {
        access: '',
        pets: '',
        allergies: '',
        flowerPreference: '',
        linens: '',
        towels: '',
        specialRequests: '',
    },
    profileSaving: false,
    profileSaved: false,
    profileEditing: false,
    // Fields of the home profile, in the order they read best; `long` = textarea
    get profileFields() {
        return [
            { key: 'access', label: this.t('pfAccess'), hint: this.t('pfAccessHint'), long: true },
            { key: 'pets', label: this.t('pfPets'), hint: this.t('pfPetsHint') },
            { key: 'allergies', label: this.t('pfAllergies'), hint: this.t('pfAllergiesHint') },
            { key: 'flowerPreference', label: this.t('flowers'), hint: this.t('pfFlowerHint') },
            { key: 'linens', label: this.t('pfLinens'), hint: this.t('pfLinensHint') },
            { key: 'towels', label: this.t('pfTowels'), hint: this.t('pfTowelsHint') },
            { key: 'specialRequests', label: this.t('pfSpecial'), hint: this.t('pfSpecialHint'), long: true },
        ];
    },
    get profileFilled() { return this.profileFields.filter((f) => (this.homeProfile[f.key] || '').trim()); },
    homeTypeLabel(kind) {
        return kind === 'apartment' ? this.t('homeFlat') : kind === 'house' ? this.t('homeHouse') : kind === 'summer' ? this.t('homeCottage') : '';
    },

    pauseReason: '',
    pauseProcessing: false,
    resumeProcessing: false,

    rescheduleBookingId: null,
    rescheduleSlots: {},
    rescheduleSlotsLoading: false,
    rescheduleDate: '',
    rescheduleTime: '',
    rescheduleAvailableTimes: [],
    rescheduleCalendarDays: [],
    rescheduleCurrentMonth: '',
    rescheduleCurrentMonthLabel: '',
    rescheduleProcessing: false,
    rescheduleError: '',
    rescheduleSuccess: false,

    // Partner-managed visit: propose a new time (provider confirms)
    proposeBooking: null,
    proposeDate: '',
    proposeWindow: 'any',
    proposeNote: '',
    proposeProcessing: false,
    proposeError: '',
    proposeSuccess: false,

    // Household contacts (who receives notifications)
    contacts: [],
    contactsSaving: false,
    contactsSaved: false,
    homes: [],
    handover: { name: '', email: '', busy: false, error: '', sent: false },
    contactsError: '',

    // Away periods (oleme eemal)
    awayFrom: '',
    awayTo: '',
    awayNote: '',
    awayProcessing: false,
    awayError: '',
    awayDone: '',

    // Extras (lisateenused)
    extras: { catalogue: [], timeWindows: [], requests: [], provider: null, florist: null, partners: [], brand: null, maxOpenRequests: 5, away: [] },
    extrasLoaded: false,
    requestService: null,
    addonChooser: false,
    requestDate: '',
    quoteLine: '',
    requestWindow: 'any',
    requestNote: '',
    requestUrgent: false,
    requestAccess: 'profile',
    requestAccessNote: '',
    requestProcessing: false,
    requestError: '',
    requestDone: null,
    telliPanel: 'clean',
    telliWindow: 'morning',
    telliNote: '',
    telliPhotoName: '',
    showPastOrders: false,
    upkeepOpen: false,
    docPreview: null,
    telliAddons: { flowers: false, windows: false },
    telliOpen: '',
    telliPay: false,
    flowerMode: 'season',
    flowerTone: '',
    telliAddonRows: [
        { id: 'flowers', label: 'addonFlowers', serviceId: 'flowers' },
        { id: 'windows', label: 'addonWindows', serviceId: 'windows' },
    ],
    telliDate: '',
    telliCursor: '',
    telliRhythm: 'once',
    telliQuote: null,
    telliBusy: false,
    telliError: '',
    telliDone: '',

    // Open request thread (past or current) — the conversation lives here, e-mail only notifies
    viewRequest: null,
    threadText: '',
    threadSending: false,
    threadError: '',

    // Kodu hooldusrütm (recurring upkeep) + kodu dokumendid
    maintAdding: false,          // custom-item form open
    maintForm: { name: '', intervalMonths: 6, lastDoneAt: '' },
    maintDoneFor: null,          // item id whose tehtud-date picker is open
    maintDoneDate: '',
    maintBusy: '',
    maintError: '',
    maintShowSuggestions: false,
    maintOpen: null,
    docAdding: false,
    askText: '',
    askCard: null,
    askSending: false,
    profileError: '',
    pauseError: '',
    docForm: { title: '', url: '', category: 'other', note: '' },
    docFile: null,
    docBusy: false,
    docError: '',

    async init() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (!urlToken && !this.token) {
            window.location.replace('/app');
            return;
        }
        // Deep link to a tab (e-mails: /minu?tab=home)
        const tabAlias = { overview: 'overview', extras: 'extras', visits: 'visits', home: 'folder', folder: 'folder', mine: 'mine' };
        if (tabAlias[urlParams.get('tab')]) this.activeTab = tabAlias[urlParams.get('tab')];

        // Warm the profile/extras functions in parallel with token validation so the
        // real calls below don't each pay a Cloud Functions cold start in sequence.
        if (urlToken || this.token) {
            for (const p of ['/api/me', '/api/me/extras']) fetch(p, { headers: { 'Authorization': 'Bearer warmup' } }).catch(() => {});
        }

        if (urlToken) {
            try {
                const res = await fetch('/api/auth/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: urlToken }),
                });
                if (res.ok) {
                    const data = await res.json();
                    this.token = data.token;
                    localStorage.setItem('sukoda_portal_token', data.token);
                    const tab = urlParams.get('tab');
                    window.history.replaceState({}, '', tab ? `/minu?tab=${encodeURIComponent(tab)}` : '/minu');
                } else {
                    // A link in the URL is an explicit login attempt — don't keep a previous household's session.
                    localStorage.removeItem('sukoda_portal_token');
                    this.token = '';
                }
            } catch (e) {
                console.error('Token validation failed:', e);
                localStorage.removeItem('sukoda_portal_token');
                this.token = '';
            }
        }

        if (this.token) {
            await this.loadProfile();
            if (!this.authenticated) return;
            const paid = urlParams.get('makstud');
            if (paid === '1' || paid === '0') {
                this.activeTab = 'extras';
                if (paid === '1') this.telliDone = this.t('paidBack');
                else this.telliError = this.t('payCancelled');
                window.history.replaceState({}, '', '/minu');
            }
            // Deep link from an e-mail: /minu?request=<id> opens that request's thread
            const reqId = urlParams.get('request');
            if (reqId && this.authenticated) {
                try {
                    await this.loadExtras();
                    const r = (this.extras.requests || []).find((x) => x.id === reqId);
                    if (r) await this.openThread(r);
                } catch (e) { console.error(e); }
                window.history.replaceState({}, '', '/minu?tab=extras');
            }
        }
        this.loading = false;
    },

    async loadProfile() {
        try {
            const res = await fetch('/api/me', {
                headers: { 'Authorization': 'Bearer ' + this.token },
            });
            if (res.ok) {
                const data = await res.json();
                this.order = data.order;
                this.viewer = data.viewer || null; // who is logged in: primary customer or a household member
                this.bookings = data.bookings || [];
                this.contacts = JSON.parse(JSON.stringify(data.order.contacts || []));
                this.authenticated = true;
                if (data.order.homeProfile) {
                    this.homeProfile = { ...this.homeProfile, ...data.order.homeProfile };
                    this.profileEditing = !this.profileFilled.length;
                }
                this.loadExtras();
            } else {
                localStorage.removeItem('sukoda_portal_token');
                this.token = '';
                window.location.replace('/app');
                return;
            }
        } catch (e) {
            console.error('Failed to load profile:', e);
        }
    },

    async loadExtras() {
        try {
            const res = await fetch('/api/me/extras', { headers: { 'Authorization': 'Bearer ' + this.token } });
            if (res.ok) {
                const data = await res.json();
                this.extras = { ...this.extras, ...data };
                this.extrasLoaded = true;
                if (window.SUKODA_PUSH) window.SUKODA_PUSH.offer({ audience: 'home', token: this.token, lang: this.lang, when: (this.upcomingBookings || []).length > 0 });
                this.refreshTelliQuote();
                this.loadHomes();
                // White label: the tab reads as the developer's portal
                if (this.brand?.name) document.title = `${this.brand.name} | ${this.t('tabKodu')}`;
            }
        } catch (e) {
            console.error('Failed to load extras:', e);
        }
    },

    // ---- Contacts ----
    addContact() {
        if (this.contacts.length >= (this.extras.maxContacts || 6)) return;
        // Temporary id so the row keeps its inputs when a neighbour is removed (the server assigns the real one)
        this.contacts.push({ id: 'new-' + Math.random().toString(36).slice(2, 8), name: '', email: '', phone: '', notify: true });
    },
    removeContact(i) {
        this.contacts.splice(i, 1);
    },
    async loadHomes() {
        try {
            const res = await fetch('/api/me/homes', { headers: { 'Authorization': 'Bearer ' + this.token } });
            if (!res.ok) return;
            const data = await res.json();
            this.homes = Array.isArray(data.homes) ? data.homes : [];
        } catch (e) { console.error(e); }
    },
    async openHome(id) {
        const res = await fetch('/api/me/homes/open', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
            body: JSON.stringify({ orderId: id }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) return;
        localStorage.setItem('sukoda_portal_token', data.token);
        this.token = data.token;
        location.reload();
    },
    async handOverHome() {
        if (this.handover.busy || !this.viewer?.primary) return;
        this.handover.busy = true;
        this.handover.error = '';
        this.handover.sent = false;
        try {
            const res = await fetch('/api/me/handover', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ name: this.handover.name, email: this.handover.email, confirm: true }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'failed');
            if (!data.mailed) {
                this.handover.error = this.t('handoverFail');
                return;
            }
            this.handover.sent = true;
            localStorage.removeItem('sukoda_portal_token');
            this.token = '';
            this.authenticated = false;
        } catch (e) {
            this.handover.error = this.t('handoverFail');
        } finally {
            this.handover.busy = false;
        }
    },
    async saveContacts() {
        if (this.contactsSaving) return;
        this.contactsSaving = true;
        this.contactsSaved = false;
        this.contactsError = '';
        try {
            const res = await fetch('/api/me/contacts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ contacts: this.contacts.filter(c => c.name || c.email) }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'failed');
            this.contacts = data.contacts;
            this.contactsSaved = true;
            setTimeout(() => this.contactsSaved = false, 3000);
        } catch (e) {
            this.contactsError = this.t('contactsSaveFailed');
        } finally {
            this.contactsSaving = false;
        }
    },

    // ---- Extras (lisateenused) ----
    todayStr() {
        const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Tallinn', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        return p; // YYYY-MM-DD
    },
    isAwayNow(p) {
        const t = this.todayStr();
        return p.from <= t && t <= p.to;
    },
    presetAwayMonth(offset) {
        const [y, m] = this.todayStr().split('-').map(Number);
        const first = new Date(Date.UTC(y, m - 1 + offset, 1));
        const last = new Date(Date.UTC(y, m + offset, 0));
        const iso = (d) => d.toISOString().slice(0, 10);
        this.awayFrom = offset === 0 ? this.todayStr() : iso(first);
        this.awayTo = iso(last);
    },
    async addAway() {
        if (this.awayProcessing || !this.awayFrom) return;
        this.awayProcessing = true; this.awayError = ''; this.awayDone = '';
        try {
            const res = await fetch('/api/me/away', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ from: this.awayFrom, to: this.awayTo || this.awayFrom, note: this.awayNote }),
            });
            const data = await res.json();
            if (!res.ok) { this.awayError = data.error || this.t('awaySaveFail'); return; }
            this.extras.away = data.away || [];
            const n = (data.cancelled || []).length;
            const kept = data.kept || [];
            this.awayDone = n === 0 ? this.t('awaySavedNone') : n === 1 ? this.t('awaySavedOne') : this.t('awaySavedMany', { n });
            if (kept.length) {
                const list = kept.map((b) => this.visitLabel(b) + ' ' + this.formatDateShort(b.scheduledAt)).join(', ');
                this.awayDone += ' ' + this.t('awayKept', { list });
            }
            this.awayFrom = ''; this.awayTo = ''; this.awayNote = '';
            await this.loadProfile();
        } catch (e) {
            this.awayError = this.t('netFail');
        } finally {
            this.awayProcessing = false;
        }
    },
    async removeAway(p) {
        if (this.awayProcessing) return;
        if (!confirm(this.t('awayRemoveAsk'))) return;
        this.awayProcessing = true; this.awayError = ''; this.awayDone = '';
        try {
            const res = await fetch('/api/me/away/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ periodId: p.id }),
            });
            const data = await res.json();
            if (!res.ok) { this.awayError = data.error || this.t('awayRemoveFail'); return; }
            this.extras.away = data.awayPeriods || [];
            this.awayDone = this.t('awayRemoved') + ((data.restored || 0) > 0 ? ' ' + this.t('awayRestored') : '');
            await this.loadProfile();
        } catch (e) {
            this.awayError = this.t('netFail');
        } finally {
            this.awayProcessing = false;
        }
    },

    /** Still live: waiting for a reply, needs a new day from the household, or confirmed and ahead */
    get openRequests() {
        return this.extras.requests.filter(r => ['requested', 'declined', 'confirmed'].includes(r.status));
    },
    /** Waiting on someone — the partner (requested) or the household (declined). Confirmed ones live in the calendar. */
    get awaitingRequests() {
        return this.extras.requests.filter(r => r.status === 'requested' || r.status === 'declined');
    },
    /** History: done, answered in writing, or withdrawn */
    get pastRequests() {
        return this.extras.requests.filter(r => ['completed', 'answered', 'cancelled'].includes(r.status));
    },
    get pendingRescheduleIds() {
        return this.extras.requests.filter(r => r.type === 'reschedule' && r.status === 'requested').map(r => r.targetBookingId);
    },
    get minRequestDate() {
        return window.SUKODA_TIME.shiftDateString(window.SUKODA_TIME.getDateString(), 1);
    },
    get requestDateMin() {
        const cleaning = this.requestKind === 'visit' && this.requestService?.category === 'cleaning' && !this.requestUrgent;
        const saved = this.extras?.provider?.leadDays;
        const lead = cleaning ? (Number.isInteger(saved) ? saved : 14) : 1;
        return window.SUKODA_TIME.shiftDateString(window.SUKODA_TIME.getDateString(), lead);
    },
    isOrderable(service) {
        if (!service) return true;
        const cat = (this.extras.categories || []).find((c) => c.id === service.category);
        return !cat || cat.orderable !== false;
    },
    openRequest(service) {
        this.viewRequest = null;
        this.addonChooser = false;
        this.requestService = service;
        this.requestDate = '';
        this.requestWindow = service.category === 'flowers' ? 'with-visit' : 'any';
        this.requestUrgent = false;
        const forCleaner = service.category === 'cleaning' || service.id === 'flowers';
        this.requestAccess = (forCleaner && this.homeProfile.access) ? 'profile' : 'home';
        this.requestAccessNote = '';
        this.requestNote = '';
        this.requestError = '';
        this.requestDone = null;
        this.quoteLine = '';
        this.refreshQuote();
    },
    async refreshQuote() {
        this.quoteLine = '';
        const s = this.requestService;
        if (!s || (s.kind || 'visit') !== 'visit') return;
        try {
            const res = await fetch('/api/me/requests/quote', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token }, body: JSON.stringify({ serviceId: s.id }) });
            const data = await res.json();
            if (!res.ok || !data.priced || !data.priceCents) return;
            if (!data.cardRequired) this.quoteLine = this.t('giftCovers');
            else this.quoteLine = this.t('payBefore', { amount: (data.residentCents / 100).toFixed(2).replace('.', ',') + ' €' });
        } catch (e) { /* the written price line stays */ }
    },
    serviceById(id) {
        return (this.extras.catalogue || []).find((s) => s.id === id) || null;
    },
    get telliDateMin() {
        const saved = this.extras?.provider?.leadDays;
        const lead = Number.isInteger(saved) ? saved : 14;
        return window.SUKODA_TIME.shiftDateString(window.SUKODA_TIME.getDateString(), lead);
    },
    telliAddonIds() {
        return this.telliAddonRows.filter((row) => this.telliAddons[row.id]).map((row) => row.serviceId);
    },
    toggleTelliAddon(id) {
        this.telliAddons = { ...this.telliAddons, [id]: !this.telliAddons[id] };
        this.telliDone = '';
        this.refreshTelliQuote();
    },
    euro(cents) {
        const n = Number(cents) / 100;
        if (!Number.isFinite(n) || n < 0) return '';
        const text = Math.round(n * 100) % 100 === 0 ? String(Math.round(n)) : n.toFixed(2).replace('.', ',');
        return text + ' €';
    },
    get telliPriceLines() {
        const q = this.telliQuote;
        if (!q || !Array.isArray(q.lines) || !q.lines.length) return [this.t('priceOnReply')];
        return q.lines.map((line) => {
            const name = line.id === 'extra-clean' ? this.t('telliTitle') : (this.serviceById(line.id)?.name || '');
            return line.hint ? name + ' · ' + line.hint : name;
        }).filter(Boolean);
    },
    get cleanShelfPrice() {
        const row = this.serviceById('extra-clean');
        return this.plainMoney((row && row.priceHint) || '');
    },
    get cleanRowPrice() {
        if (this.telliOpen === 'clean' && !this.telliPay) return '';
        if (this.showProvider || this.quoteHasFloor) return this.cleanShelfPrice;
        if (this.telliOpen === 'clean' && this.telliSumAmount) return this.telliSumAmount;
        return this.cleanShelfPrice;
    },
    get telliSumAmount() {
        const q = this.telliQuote;

    get telliButtonLabel() {
        if (this.telliOpen === 'warranty' || this.telliPanel === 'warranty') return this.t('sendWarranty');
        if (this.showProvider || this.quoteHasFloor) return this.t('confirmOrder');

    setTelliPanel(id) {

    openTelli(id) {

    openPaidClean() {

    addonName(id) {

    addonText(id) {

    },
    plainMoney(text) {

    },
    addonPrice(id) {
        const row = this.serviceById(id);

        return this.plainMoney(raw);
    },
    flowerChoice() {
        if (this.flowerMode === 'tone') return (this.flowerTone || '').trim();
        return this.t('addonSeason');
    },
    get nextCleanDay() {
        const visit = this.nextCleanVisit;
        return visit && visit.scheduledAt ? String(visit.scheduledAt).slice(0, 10) : '';
    },
    get canUseNextClean() {
        if (!this.nextCleanDay) return false;
        if (this.telliOpen === 'windows' || this.telliOpen === 'clean') return this.nextCleanDay >= this.telliDateMin;
        return true;
    },
    useNextCleanDay() {
        if (this.nextCleanDay) this.telliDate = this.nextCleanDay;
    },
    get telliWeekdays() {
        return this.t('weekDays').split(' ');
    },
    get telliMonthLabel() {
        const [y, m] = this.telliCursorParts();
        const label = new Intl.DateTimeFormat(this.locale(), { month: 'long', year: 'numeric' }).format(new Date(y, m - 1, 1));
        return label.charAt(0).toUpperCase() + label.slice(1);
    },
    telliCursorParts() {
        const raw = this.telliCursor || this.telliDate || this.minRequestDate || '2026-09';
        const bits = String(raw).slice(0, 7).split('-');
        return [Number(bits[0]) || 2026, Number(bits[1]) || 1];
    },
    shiftTelliMonth(delta) {
        const [y, m] = this.telliCursorParts();
        const d = new Date(y, m - 1 + delta, 1);
        this.telliCursor = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    },
    get telliMonthCells() {
        const [y, m] = this.telliCursorParts();
        const pad = (new Date(y, m - 1, 1).getDay() + 6) % 7;
        const days = new Date(y, m, 0).getDate();
        const min = (this.telliOpen === 'clean' || this.telliOpen === 'windows') ? this.telliDateMin : this.minRequestDate;
        const cells = [];
        for (let i = 0; i < pad; i++) cells.push({ key: 'pad-' + i, label: '', iso: '', disabled: true, pad: true });
        for (let day = 1; day <= days; day++) {
            const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            cells.push({ key: iso, label: String(day), iso, disabled: !!(min && iso < min), pad: false });
        }
        return cells;
    },
    pickTelliDay(cell) {
        if (!cell || !cell.iso || cell.disabled) return;
        this.telliDate = cell.iso;
    },
    get serviceRows() {
        const rows = [];
        const visit = this.nextCleanVisit;
        if (visit) {
            const time = this.formatTime(visit.scheduledAt);
            rows.push({
                id: 'visit-' + visit.id,
                name: this.visitLabel(visit) || this.t('orderClean'),
                meta: [this.formatDate(visit.scheduledAt), time, this.t('includedShort')].filter(Boolean).join(' · '),
                status: this.t('statusConfirmed'),
                open: '',
            });
        } else if (this.arcoCleanLine) {
            rows.push({
                id: 'gift-clean',
                name: this.t('giftRow'),
                meta: this.t('giftCleanMeta'),
                status: this.t('giftStatus'),
                open: 'clean',
                pick: 'giftPickClean',
            });
        }
        (this.upcomingBookings || []).forEach((booking) => {
            if (booking.kind !== 'extra') return;
            if (visit && booking.id === visit.id) return;
            rows.push({
                id: 'visit-' + booking.id,
                name: this.visitLabel(booking),
                meta: [this.formatDate(booking.scheduledAt), this.formatTime(booking.scheduledAt)].filter(Boolean).join(' · '),
                status: this.t('statusConfirmed'),
                open: '',
            });
        });
        (this.extras.requests || []).forEach((request) => {
            if (!['requested', 'confirmed', 'declined', 'answered'].includes(request.status)) return;
            const day = request.preferredDate ? this.formatDateShort(String(request.preferredDate).slice(0, 10) + 'T12:00:00') : '';
            rows.push({
                id: 'req-' + request.id,
                name: request.serviceName || '',
                meta: day,
                status: this.requestStatusLabel(request.status, request),
                open: 'thread',
                requestId: request.id,
            });
        });
        return rows;
    },
    openServiceRow(row) {
        const request = (this.extras.requests || []).find((item) => item.id === row.requestId);
        if (request) this.openThread(request);
    },
    get arcoCleanLine() {
        const row = (this.extras.categories || []).find((c) => c.id === 'cleaning');
        const quota = row && row.terms && row.terms.quota;
        return quota ? String(quota) : '';
    },
    onTelliPhoto(e) {
        const file = e.target.files && e.target.files[0];
        this.telliPhotoName = file ? file.name : '';
        e.target.value = '';
    },
    get nextCleanVisit() {
        return (this.upcomingBookings || []).find((b) => b.kind !== 'extra') || null;
    },
    openDoc(d) {
        const href = this.docHref(d);
        if (!href) return;
        this.docPreview = { title: d.title || '', href };
    },
    openHref(title, href) {
        if (!href) return;
        this.docPreview = { title: title || '', href };
    },
    closeDoc() {
        this.docPreview = null;
    },
    async refreshTelliQuote() {
        if (!this.token) return;
        const panel = this.telliOpen || this.telliPanel;
        const serviceId = { warranty: 'warranty-claim', fix: 'small-repairs', flowers: 'flowers', windows: 'windows' }[panel] || 'extra-clean';
        try {
            const res = await fetch('/api/me/requests/quote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token },
                body: JSON.stringify({ serviceId, addonIds: panel === 'clean' ? this.telliAddonIds() : [], pay: panel === 'clean' && this.telliPay }),
            });
            const data = await res.json();
            if (res.ok) this.telliQuote = data;
        } catch (e) { /* the price lines stay as written */ }
    },
    async submitTelli() {
        if (this.telliBusy || !this.telliDate) return;
        const panel = this.telliOpen || this.telliPanel;
        const words = (this.telliNote || '').trim();
        if ((panel === 'fix' || panel === 'warranty') && words.length < 5 && !(panel === 'warranty' && this.telliPhotoName)) return;
        if (panel === 'flowers' && this.flowerMode === 'tone' && this.flowerChoice().length < 2) return;
        this.telliBusy = true;
        this.telliError = '';
        this.telliDone = '';
        let payRedirect = false;
        const ids = panel === 'clean' ? this.telliAddonIds() : [];
        const names = ids.map((id) => this.serviceById(id)?.name).filter(Boolean);
        const flowerBit = (panel === 'flowers' || (panel === 'clean' && this.telliAddons.flowers)) ? this.t('flowerLine', { choice: this.flowerChoice() }) : '';
        const rhythmName = { weekly: 'rhythmWeek', biweekly: 'rhythmTwo', monthly: 'rhythmMonth' }[this.telliRhythm];
        const rhythmBit = panel === 'clean' && rhythmName ? this.t('rhythmNote', { rhythm: this.t(rhythmName).toLowerCase() }) : '';
        const cleanCovered = panel === 'clean' && this.telliQuote && (this.telliQuote.lines || []).some((line) => line.id === 'extra-clean' && line.covered);
        const giftBit = cleanCovered && !rhythmName ? this.t('giftNote') : '';
        const note = panel === 'clean'
            ? [giftBit, rhythmBit, this.t('telliNoteOnce'), names.length ? this.t('telliNoteExtras', { list: names.join(', ') }) : '', flowerBit].filter(Boolean).join(' ')
            : panel === 'flowers'
                ? flowerBit
                : [giftBit, words, panel === 'warranty' && this.telliPhotoName ? this.t('photoAttached') : ''].filter(Boolean).join(' ');
        const serviceId = { warranty: 'warranty-claim', fix: 'small-repairs', flowers: 'flowers', windows: 'windows' }[panel] || 'extra-clean';
        try {
            const res = await fetch('/api/me/requests', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token },
                body: JSON.stringify({
                    serviceId,
                    preferredDate: this.telliDate,
                    timeWindow: this.telliWindow || 'any',
                    note,
                    access: (this.homeProfile.access || '').trim() || this.t('telliHome'),
                    urgent: false,
                    addonIds: ids,
                    ...(panel === 'clean' && !this.telliPay && this.telliRhythm && this.telliRhythm !== 'once' ? { rhythm: this.telliRhythm } : {}),
                    ...(panel === 'clean' && this.telliPay ? { pay: true } : {}),
                }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'failed');
            if (data.checkoutUrl) {
                payRedirect = true;
                window.location.assign(data.checkoutUrl);
                return;
            }
            this.telliDone = data.interest
                ? this.t('noted')
                : (panel === 'warranty'
                    ? this.t('orderWarrantySent')
                    : (this.showProvider && this.providerFace ? this.t('telliSentNamed', { name: this.providerFace }) : this.t('telliSent')));
            this.telliAddons = { flowers: false, windows: false };
            this.telliNote = '';
            this.telliPhotoName = '';
            await this.loadExtras();
        } catch (e) {
            this.telliError = e.message && e.message !== 'failed' ? e.message : this.t('telliFailed');
        } finally {
            if (!payRedirect) this.telliBusy = false;
        }
    },
    closeRequest() {
        this.requestService = null;
        this.requestDone = null;
        this.addonChooser = false;
    },
    async openThread(r) {
        if (!r) return;
        this.requestService = null;
        this.viewRequest = r;
        this.threadText = '';
        this.threadError = '';
        this.activeTab = 'extras';
        // The partner may have written since the page loaded — show the thread as it is now
        await this.loadExtras();
        if (this.viewRequest && this.viewRequest.id === r.id) this.viewRequest = (this.extras.requests || []).find((x) => x.id === r.id) || this.viewRequest;
    },
    closeThread() { this.viewRequest = null; this.threadText = ''; this.threadError = ''; },
    get threadMessages() {
        const r = this.viewRequest;
        if (!r) return [];
        const msgs = Array.isArray(r.messages) ? r.messages.filter((m) => m && m.text) : [];
        if (msgs.length) return msgs;
        const out = [];
        if (r.note) out.push({ id: 'note', by: 'client', name: r.customerName || '', text: r.note, at: r.createdAt });
        if (r.providerMessage) out.push({ id: 'pm', by: 'provider', name: r.providerName || '', text: r.providerMessage, at: r.answeredAt || r.confirmedAt || r.completedAt || r.declinedAt });
        return out;
    },
    canReplyTo(r) {
        return r && !['cancelled'].includes(r.status);
    },
    formatMsgTime(iso) {
        if (!iso) return '';
        return this.formatDateLong(iso) + ' · ' + this.formatTime(iso);
    },
    /** Sõnum · Hinnapäring · Küsimus · Probleem · Soov — what the dialog calls the thing being sent */
    get requestNoun() {
        if (this.requestService?.id === 'cleaning-note') return this.t('nounMessage');
        if (this.requestService?.id === 'extra-works') return this.t('nounQuote');
        if (this.requestKind === 'question') return this.t('nounQuestion');
        if (this.requestKind === 'issue') return this.t('nounIssue');
        return this.t('nounRequest');
    },
    /** Issues, questions, messages and “something else” all start with words; the server wants at least a few */
    get requestNeedsNote() { return this.requestKind !== 'visit' || this.requestService?.id === 'other'; },
    get requestNoteTooShort() { return this.requestNeedsNote && (this.requestNote || '').trim().length < 5; },
    resolveAccess() {
        if (this.requestKind === 'question') return '';
        if (this.requestAccess === 'home') return this.t('telliHome');
        if (this.requestAccess === 'note') return (this.requestAccessNote || '').trim();
        return (this.homeProfile.access || '').trim();
    },
    get requestPriceBlurb() {
        const s = this.requestService;
        if (!s) return '';
        const cat = (this.extras.categories || []).find((c) => c.id === s.category);
        const tm = cat?.terms;
        if (s.pricing === 'quote') return this.t('blurbQuote');
        if (this.requestKind === 'question') return this.t('blurbQuestion');
        if (this.requestKind === 'issue') return this.t('blurbIssue');
        if (s.priceLabel?.included && tm?.quota) return this.t('blurbQuota', { quota: tm.quota });
        return this.t('blurbDefault');
    },
    /** Guide price for this job. A category invoice (the standing clean) is not this job's bill. */
    get requestPriceLine() {
        const s = this.requestService;
        if (!s || s.priceLabel?.included) return s?.priceLabel?.text || '';
        const label = s.priceLabel?.text || '';
        if (/^(arve|billed by)\b/i.test(label)) return (typeof s.priceHint === 'string' ? s.priceHint : '') || '';
        return label.replace(/\s·\s(arve|billed by)\s.+$/i, '');
    },
    askPartner(p) {
        // Write here on a partner card: a written question to the builder team, a message to the housekeeper
        const prefer = { warranty: ['home-manual'], building: ['building-question'], handyman: ['small-repairs'], cleaning: ['cleaning-note'], flowers: ['flowers'] }[p.category] || ['other'];
        const cat = this.extras.catalogue || [];
        const svc = prefer.map((id) => cat.find((s) => s.id === id)).find(Boolean) || cat.find((s) => s.category === p.category);
        if (svc) this.openRequest(svc);
    },
    async sendThread() {
        const r = this.viewRequest;
        const text = (this.threadText || '').trim();
        if (!r || !text || this.threadSending) return;
        this.threadSending = true;
        this.threadError = '';
        try {
            const res = await fetch('/api/me/requests/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ requestId: r.id, text }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'failed');
            this.threadText = '';
            if (data.request) {
                this.extras = { ...this.extras, requests: this.extras.requests.map((x) => x.id === data.request.id ? { ...x, ...data.request } : x) };
                this.viewRequest = { ...r, ...data.request };
            } else {
                await this.loadExtras();
                this.viewRequest = (this.extras.requests || []).find((x) => x.id === r.id) || r;
            }
        } catch (e) {
            this.threadError = e.message && e.message !== 'failed' ? e.message : this.t('telliFailed');
        } finally {
            this.threadSending = false;
        }
    },

    // ---- Hooldusrütm ----
    get maintenance() { return this.extras.maintenance || { items: [], suggestions: [], intervals: [1, 2, 3, 6, 12, 24], homeType: null, remindersEnabled: true }; },
    // Only what the household itself has to do counts as due for the household
    get maintenanceDue() { return this.maintenance.items.filter((i) => i.state !== 'ok' && i.doneBy !== 'provider').length; },
    get maintHomeItems() { return this.maintenance.items.filter((i) => i.doneBy !== 'provider'); },
    get maintProviderItems() { return this.maintenance.items.filter((i) => i.doneBy === 'provider'); },

        const name = this.showProvider ? (this.shortName(this.requestDone?.providerName) || this.providerFace) : '';

    get proposeHintText() {

    nextLabel(item) {

    },
    lastDoneLabel(item) {

    async assignMaintenance(item, doneBy) { await this.maintenanceAction({ action: 'update', itemId: item.id, doneBy }, 'own-' + item.id); },
    intervalLabel(m) {
        if (m === 1) return this.t('intervalMonth');

    dueLabel(item) {
        const d = new Date(item.nextDueAt + 'T12:00:00');
        const s = d.toLocaleDateString(this.locale(), { day: 'numeric', month: 'long' });
        if (item.state === 'overdue') return this.t('overdueOn', { date: s });

    async maintenanceAction(body, busyKey) {
        this.maintBusy = busyKey || 'x';
        this.maintError = '';
        try {
            const res = await fetch('/api/me/maintenance', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) { this.maintError = data.error || this.t('maintFailed'); return false; }
            this.extras = { ...this.extras, maintenance: data.maintenance };
            return true;
        } catch (e) { this.maintError = this.t('netFail'); return false; } finally { this.maintBusy = ''; }
    },
    async addSuggestion(s) { await this.maintenanceAction({ action: 'add', catalogId: s.id }, 'add-' + s.id); },
    async addCustomMaintenance() {
        if (!this.maintForm.name) return;
        if (await this.maintenanceAction({ action: 'add', name: this.maintForm.name, intervalMonths: Number(this.maintForm.intervalMonths), lastDoneAt: this.maintForm.lastDoneAt || null }, 'custom')) {
            this.maintAdding = false; this.maintForm = { name: '', intervalMonths: 6, lastDoneAt: '' };
        }
    },
    async markMaintenanceDone(item, date) {
        if (await this.maintenanceAction({ action: 'done', itemId: item.id, date: date || null }, 'done-' + item.id)) { this.maintDoneFor = null; this.maintDoneDate = ''; }
    },
    async changeInterval(item, months) { await this.maintenanceAction({ action: 'update', itemId: item.id, intervalMonths: Number(months) }, 'upd-' + item.id); },
    async removeMaintenance(item) {
        if (!confirm(this.t('maintRemoveAsk'))) return;

    },
    async setHomeType(homeType) {
        if (this.maintenance.homeType === homeType) return;
        const prev = this.maintenance;
        this.homeProfile.homeType = homeType;
        this.extras = { ...this.extras, maintenance: { ...prev, homeType, suggestions: prev.suggestions.filter((s) => homeType !== 'apartment' || !s.houseOnly) } };
        try {
            const res = await fetch('/api/me/home-type', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify({ homeType }) });
            const data = await res.json();
            if (res.ok) this.extras = { ...this.extras, maintenance: data.maintenance };

    /** Telli tegija: open the request drawer for the catalogue service behind an upkeep item */

    // ---- Needs, not providers: how the owner reads the catalogue ----
    get warrantyPartner() { return this.partners.find((p) => p.category === 'warranty') || null; },
    partnerNameFor(service) {
        if (!service) return '';
        const c = (this.extras.categories || []).find((x) => x.id === service.category);
        return c?.partnerName || '';
    },
    /** Room-sized name for a card footer: “Arco Vara järelteenindus” → “Arco Vara”, “Kodulahe Haldus · tehnik” → “Kodulahe Haldus” */
    shortName(name) {
        const first = String(name || '').split(' · ')[0].trim();
        const words = first.split(/\s+/);
        return words.length > 2 ? words.slice(0, 2).join(' ') : first;
    },
    // Short price form for the service card: 'Hinnas sees' / 'Garantii korras' / 'alates 45 €' — the full sentence lives in the modal
    cardPriceLabel(service) {
        const pl = service?.priceLabel;

    // ---- Dokumendid ----
    get documents() { return this.extras.documents || { items: [], categories: [], facts: [] }; },
    get folderFacts() {
        const label = {
            küte: 'factHeat', kütte: 'factHeat', heating: 'factHeat', 'floor-heating': 'factHeat',
            filter: 'factFilter', 'filter-size': 'factFilter',
            vesi: 'factWater', water: 'factWater', 'water-main': 'factWater',
            elekter: 'factPower', electric: 'factPower', electricity: 'factPower', breaker: 'factPower',
            garantii: 'factWarranty', 'warranty-end': 'factWarranty', 'garantii-lopp': 'factWarranty',
        };
        const order = ['factHeat', 'factFilter', 'factWater', 'factPower', 'factWarranty'];
        const items = this.documents.items || [];
        const rows = [];
        (this.documents.facts || []).forEach((fact) => {
            if (!fact || !String(fact.value || '').trim()) return;
            if (fact.status && fact.status !== 'approved') return;
            const labelKey = label[String(fact.key || '').trim().toLowerCase()];
            if (!labelKey) return;
            const docId = fact.sourceDocId && items.some((item) => item.id === fact.sourceDocId) ? fact.sourceDocId : '';
            rows.push({
                id: String(fact.key || labelKey) + '-' + rows.length,
                labelKey,
                value: String(fact.value).trim(),
                docId,
                page: fact.page || null,
            });
        });
        rows.sort((a, b) => order.indexOf(a.labelKey) - order.indexOf(b.labelKey));
        return rows;
    },
    foldAsk(value) {
        return String(value || '').toLowerCase()
            .replace(/filtr[a-zõäöüšž]*/g, 'filter')
            .replace(/filter[a-zõäöüšž]*/g, 'filter')
            .replace(/mõõ[a-zõäöüšž]*/g, 'mõõt')
            .replace(/moot[a-zõäöüšž]*/g, 'mõõt')
            .replace(/suurus[a-zõäöüšž]*/g, 'mõõt');
    },
    askWords(question) {
        const stop = { mis: 1, on: 1, ja: 1, kui: 1, kus: 1, kust: 1, see: 1, seda: 1, kuidas: 1, palun: 1, the: 1, and: 1, what: 1, where: 1, how: 1, from: 1 };
        return this.foldAsk(question).split(/\s+/).filter((word) => word.length > 3 && !stop[word]);
    },
    askScore(text, words) {
        const blob = this.foldAsk(text);
        return words.reduce((score, word) => score + (blob.includes(word) || (word.length >= 5 && blob.includes(word.slice(0, 5))) ? word.length : 0), 0);
    },
    get passLines() {
        const facts = (this.documents.facts || []).filter((fact) => fact && fact.value);
        if (facts.length) {
            return facts.map((fact) => {
                const doc = (this.documents.items || []).find((item) => item.id === fact.sourceDocId);
                return { id: fact.key || fact.value, text: fact.value, docId: fact.sourceDocId || '', page: fact.page || null, title: (doc && doc.title) || '' };
            });
        }
        return (this.documents.items || []).filter((doc) => doc.note && /filtr|filter|×|kood|garantii|peakraan|avarii/i.test(doc.note)).slice(0, 8).map((doc) => ({
            id: doc.id, text: doc.note, docId: doc.id, page: doc.page || null, title: doc.title || '',
        }));
    },
    askSentence(text, words) {
        const parts = String(text || '').split(/\n+|(?<=[.!?])\s+/).map((part) => part.trim()).filter((part) => part.length > 12);
        let best = '';
        let bestScore = 0;
        parts.forEach((part) => {
            const score = this.askScore(part, words);
            if (score > bestScore) { bestScore = score; best = part; }
        });
        return best.slice(0, 500);
    },
    localAsk(question) {
        const words = this.askWords(question);
        if (!words.length) return null;
        let best = null;
        let bestScore = 0;
        const take = (text, title, doc, score) => {
            if (score > bestScore) { bestScore = score; best = { text, title, doc }; }
        };
        this.passLines.forEach((item) => {
            const doc = (this.documents.items || []).find((row) => row.id === item.docId);
            take(item.text, item.title, doc, this.askScore(`${item.text} ${item.title}`, words));
        });
        (this.documents.items || []).forEach((item) => {
            const score = this.askScore(`${item.title || ''} ${item.note || ''} ${item.text || ''}`, words);
            if (score <= bestScore) return;
            const sentence = this.askSentence(`${item.text || ''}\n${item.note || ''}`, words) || item.note || item.title;
            bestScore = score;
            best = { text: sentence, title: item.title, doc: item };
        });
        if (!best) return null;
        const text = best.text;
        const doc = best.doc;
        if (!text) return null;
        const href = doc ? this.docHref(doc) : '';
        return { fact: text, place: (doc && doc.title) || '', action: href ? 'open' : '', href };
    },
    openPassLine(line) {
        const doc = (this.documents.items || []).find((item) => item.id === line.docId);
        if (!doc) return;
        const href = this.docHref({ ...doc, page: line.page || doc.page });
        this.openHref(line.title || doc.title, href);
    },
    get documentsByCategory() {
        const out = [];
        for (const c of this.documents.categories) {
            const items = this.documents.items.filter((d) => d.category === c.id);
            if (items.length) out.push({ ...c, items });
        }
        return out;
    },
    async documentAction(body) {
        this.docBusy = true; this.docError = '';

            const res = await fetch('/api/me/documents', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) { this.docError = data.error || this.t('docFail'); return false; }
            this.extras = { ...this.extras, documents: data.documents };

    },
    get docsFromDeveloper() { return this.documents.items.filter((d) => d.source === 'developer').length; },
    docKind(d) {
        if (d.file) { const t = d.file.contentType || ''; return t.includes('pdf') ? 'PDF' : t.includes('jpeg') ? 'JPG' : t.includes('png') ? 'PNG' : t.includes('webp') ? 'WEBP' : t.includes('heic') ? 'HEIC' : (this.lang === 'et' ? 'Fail' : 'File'); }
        return d.url ? (this.lang === 'et' ? 'Link' : 'Link') : (this.lang === 'et' ? 'Märge' : 'Note');
    },
    docSourceLabel(d) {
        if (d.source === 'developer') return this.brand?.name || (this.lang === 'et' ? 'Arendaja' : 'Developer');
        if (d.source === 'provider') return d.sourceName || (this.lang === 'et' ? 'Partner' : 'Partner');
        return d.sourceName ? d.sourceName.split(' ')[0] : (this.lang === 'et' ? 'Sina' : 'You');
    },
    /** Files are streamed through the API with the session token — the bucket itself is never public */
    fileHref(d) { return '/api/me/documents/file?id=' + encodeURIComponent(d.id) + '&token=' + encodeURIComponent(this.token); },
    docHref(d) {
        const base = d && d.file ? this.fileHref(d) : (d && d.url ? d.url : '');
        const page = Number(d && d.page);
        if (!base || !Number.isInteger(page) || page < 1) return base;
        return base + '#page=' + page;
    },
    askDocHref(doc) {
        if (!doc) return '';
        const local = (this.documents.items || []).find((d) => d.id === doc.id);
        if (local) return this.docHref(local);
        const page = Number(doc.page);
        const hash = Number.isInteger(page) && page > 0 ? '#page=' + page : '';
        if (doc.hasFile && doc.id) return this.fileHref({ id: doc.id }) + hash;
        return doc.url ? doc.url + hash : '';
    },
    askCardFrom(data) {
        const fact = data && data.fact && data.fact.value ? data.fact : null;
        const docOnly = data && data.document;
        if (!fact && docOnly) {
            const href = this.askDocHref(docOnly);
            return { fact: docOnly.title || '', place: '', action: href ? 'open' : 'person', href };
        }
        if (!fact) return { fact: '', place: '', action: 'person', href: '' };
        const doc = data.document || null;
        const pageNo = fact.page || (doc && doc.page) || null;
        const page = pageNo ? this.t('askPage', { page: pageNo }) : '';
        const title = doc && doc.title ? doc.title : '';
        const place = [title, page].filter(Boolean).join(' · ');
        if (data.suggestTechnician) {
            const href = this.askDocHref(doc);
            if (href) return { fact: fact.value, place, action: 'open', href, also: 'tech' };
            return { fact: fact.value, place, action: 'tech', href: '', also: '' };
        }
        const href = this.askDocHref(doc);
        if (href) return { fact: fact.value, place, action: 'open', href };
        return { fact: fact.value, place, action: 'person', href: '' };
    },
    async askFolder() {
        const question = String(this.askText || '').trim();
        if (!question || this.askSending) return;
        this.askCard = null;
        this.askSending = true;
        try {
            const res = await fetch('/api/me/documents/ask', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token }, body: JSON.stringify({ question }) });
            const data = await res.json();
            if (res.ok) { this.askCard = this.askCardFrom(data); return; }
        } catch (e) { /* the phone keeps the answer it can read offline */ } finally { this.askSending = false; }
        const local = this.localAsk(question);
        this.askCard = local && local.fact ? local : { fact: '', place: '', action: 'person', href: '' };
    },
    orderTechnician() {
        const svc = this.serviceById('systems-tuning');
        if (!svc) return;
        this.openRequest(svc);
        this.requestNote = String(this.askText || '').trim();
    },
    async sendAskToPerson() {
        const question = String(this.askText || '').trim();
        if (this.askSending) return;
        if (question.length < 5) { this.askCard = { fact: '', place: '', action: 'person', href: '', error: this.t('askTooShort') }; return; }
        this.askSending = true;
        try {
            const res = await fetch('/api/me/requests', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token }, body: JSON.stringify({ serviceId: 'home-manual', note: question }) });
            const data = await res.json();
            if (!res.ok) { this.askCard = { fact: '', place: '', action: 'person', href: '', error: (data && data.error) || this.t('askFailed') }; return; }
            this.askCard = { fact: this.t('askSent'), place: '', action: '', href: '' };
            if (data.request) this.extras = { ...this.extras, requests: [data.request].concat(this.extras.requests || []) };
        } catch (e) { this.askCard = { fact: '', place: '', action: 'person', href: '', error: this.t('netFail') }; } finally { this.askSending = false; }
    },
    async downloadHome() {
        try {
            const res = await fetch('/api/me/documents/export', { headers: { Authorization: 'Bearer ' + this.token } });
            if (!res.ok) return;
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'kodu.zip';
            a.click();
            URL.revokeObjectURL(url);

            const data = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result)); r.onerror = reject; r.readAsDataURL(f); });
            this.docBusy = true; this.docError = '';
            try {
                const res = await fetch('/api/me/documents/upload', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify({ ...this.docForm, url: '', fileName: f.name, contentType: f.type || 'application/octet-stream', data }) });

    openReschedule(booking) {
        this.rescheduleBookingId = booking.id;
        this.rescheduleDate = '';
        this.rescheduleTime = '';
        this.rescheduleError = '';
        this.rescheduleSuccess = false;
        this.rescheduleCurrentMonth = window.SUKODA_TIME.getYearMonth(booking.scheduledAt || new Date());
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

    updateRescheduleMonthLabel() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const label = new Intl.DateTimeFormat(this.locale(), { month: 'long', year: 'numeric' }).format(new Date(y, m - 1, 1));
        this.rescheduleCurrentMonthLabel = label.charAt(0).toUpperCase() + label.slice(1);
    },

    async loadRescheduleSlots() {
        if (!this.order?.size || !this.rescheduleCurrentMonth) return;
        this.rescheduleSlotsLoading = true;
        this.rescheduleError = '';
        try {
            const res = await fetch('/api/slots?size=' + this.order.size + '&month=' + this.rescheduleCurrentMonth);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            this.rescheduleSlots = data.slots || {};
            // Demo account fallback: if no slots from Cal.com, use mock slots so reschedule works
            const isEmpty = Object.keys(this.rescheduleSlots).length === 0;
            if (isEmpty && this.order?.id?.startsWith('demo-')) {
                this.rescheduleSlots = this.getDemoRescheduleSlots();
            }
            this.buildRescheduleCalendar();
        } catch (e) {
            if (this.order?.id?.startsWith('demo-')) {
                this.rescheduleSlots = this.getDemoRescheduleSlots();
                this.buildRescheduleCalendar();
            } else {
                this.rescheduleError = this.t('slotsFail');
            }
        } finally {
            this.rescheduleSlotsLoading = false;
        }
    },

    getDemoRescheduleSlots() {
        const [y, m] = (this.rescheduleCurrentMonth || window.SUKODA_TIME.getYearMonth()).split('-').map(Number);
        const slots = {};
        const todayStr = window.SUKODA_TIME.getDateString();
        const times = ['09:00', '10:00', '11:00', '14:00'];
        for (let d = 1; d <= 28; d++) {
            const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            if (dateStr < todayStr) continue;
            const dateObj = new Date(dateStr + 'T12:00:00');
            const dow = dateObj.getDay();
            if (dow >= 1 && dow <= 5) slots[dateStr] = times;
        }
        return slots;
    },

    buildRescheduleCalendar() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const lastDay = new Date(y, m, 0);
        const todayStr = window.SUKODA_TIME.getDateString();
        let startDow = firstDay.getDay() - 1;
        if (startDow < 0) startDow = 6;
        this.rescheduleCalendarDays = [];
        for (let i = 0; i < startDow; i++) {
            this.rescheduleCalendarDays.push({ day: '', date: '', hasSlots: false, isPast: true });
        }
        for (let d = 1; d <= lastDay.getDate(); d++) {
            const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            const hasSlots = this.rescheduleSlots[dateStr] && this.rescheduleSlots[dateStr].length > 0;
            this.rescheduleCalendarDays.push({ day: d, date: dateStr, hasSlots, isPast: dateStr < todayStr });
        }
    },

    rescheduleSelectDay(day) {
        if (!day.hasSlots || day.isPast) return;
        this.rescheduleDate = day.date;
        this.rescheduleTime = '';
        this.rescheduleAvailableTimes = this.rescheduleSlots[day.date] || [];
    },

    reschedulePrevMonth() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const [currentYear, currentMonth] = window.SUKODA_TIME.getYearMonth().split('-').map(Number);
        const currentYM = currentYear * 12 + (currentMonth - 1);
        const targetYM = y * 12 + (m - 2);
        if (targetYM < currentYM) return;
        const newMonth = m - 1;
        const newYear = newMonth < 1 ? y - 1 : y;
        const adjustedMonth = newMonth < 1 ? 12 : newMonth;
        this.rescheduleCurrentMonth = newYear + '-' + String(adjustedMonth).padStart(2, '0');
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

    rescheduleNextMonth() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const newMonth = m + 1;
        const newYear = newMonth > 12 ? y + 1 : y;
        const adjustedMonth = newMonth > 12 ? 1 : newMonth;
        this.rescheduleCurrentMonth = newYear + '-' + String(adjustedMonth).padStart(2, '0');
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

        // Partner-managed homes: describe the agreed rhythm from the schedule, not a package code
        const f = this.order?.schedule?.active !== false ? this.order?.schedule?.frequency : null;
        const rhythm = { weekly: names.weekly, biweekly: names.twice, monthly: names.once }[f];

            cancelling: 'text-amber-600 bg-amber-50',

        return colors[status] || 'text-gray-500 bg-gray-50';

    get upcomingBookings() {
        const now = new Date().toISOString();
        return this.bookings
            .filter(b => (b.status === 'confirmed' || b.status === 'scheduled') && b.scheduledAt > now)
            .sort((a, b) => a.scheduledAt < b.scheduledAt ? -1 : 1);
    },

    get pastBookings() {
        const now = new Date().toISOString();
        return this.bookings
            .filter(b => b.scheduledAt <= now || b.status === 'completed' || b.status === 'cancelled')
            .sort((a, b) => a.scheduledAt < b.scheduledAt ? 1 : -1);

    /** The most recent visit that actually happened — shown under the next-thing card on Kodu */
    get lastVisit() {
        return this.pastBookings.find(b => b.status !== 'cancelled') || null;
    },
    lastVisitLine(b) {
        if (!b) return '';
        const who = this.showProvider ? (b.providerName || this.order?.provider?.name || '') : '';
        return [this.t('doneOn', { date: this.formatDateLong(b.scheduledAt) }), this.visitLabel(b), who].filter(Boolean).join(' · ');
    },
    /** Requests that wait on the resident's own decision (a declined time, a reply to act on) — the only thing worth a badge */
    get needsYou() {
        return (this.extras.requests || []).filter(r => r.status === 'declined').length;
    },

    visitLabel(b) {
        if (b?.kind === 'extra' && b.serviceName) return b.serviceName;

    formatDate(iso) {
        if (!iso) return '';
        const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        return window.SUKODA_TIME.formatDate(iso, this.locale(), opts);
    },

    formatDateShort(v) {
        if (!v) return '';
        const iso = v.length === 10 ? v + 'T12:00:00' : v;
