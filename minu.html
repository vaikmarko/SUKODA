<!DOCTYPE html>
<html lang="et" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <style>[x-cloak] { display: none !important; } html { font-size: 17px; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SUKODA | Minu portaal</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/logo/icon-s-black.svg">
    <link rel="apple-touch-icon" href="assets/logo/icon-square.svg">
    <link rel="preload" href="/assets/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <script type="module" src="/assets/js/main.js"></script>
</head>
<body class="antialiased" x-data="{
    lang: localStorage.getItem('sukoda_lang') || 'et',
    token: localStorage.getItem('sukoda_portal_token') || '',
    authenticated: false,
    loading: true,

    loginEmail: '',
    loginSending: false,
    loginSent: false,
    loginDesk: false,
    loginError: '',

    order: null,

    viewer: null,
    bookings: [],
    activeTab: 'overview',

    homeProfile: {
        access: '',
        pets: '',
        allergies: '',
        flowerPreference: '',
        linens: '',
        towels: '',
        specialRequests: '',
    },
    profileSaving: false,
    profileSaved: false,
    profileEditing: false,
    // Fields of the home profile, in the order they read best; `long` = textarea
    get profileFields() {
        const et = this.lang === 'et';
        return [
            { key: 'access', label: et ? 'Sissepääs' : 'Access', hint: et ? 'Koodlukk, võti, uksekell — kuidas sisse saab' : 'Code lock, key, doorbell — how to get in', long: true },
            { key: 'pets', label: et ? 'Lemmikloomad' : 'Pets', hint: et ? 'nt kass Luna, sõbralik' : 'e.g. cat Luna, friendly' },
            { key: 'allergies', label: et ? 'Allergiad ja vahendid' : 'Allergies & products', hint: et ? 'nt looduslikud vahendid, lateksiallergia' : 'e.g. natural products, latex allergy' },
            { key: 'flowerPreference', label: et ? 'Lilled' : 'Flowers', hint: et ? 'nt valged tulbid, mitte liiliaid' : 'e.g. white tulips, no lilies' },
            { key: 'linens', label: et ? 'Voodipesu' : 'Linens', hint: et ? 'nt vahetada iga 2 nädala tagant' : 'e.g. change every 2 weeks' },
            { key: 'towels', label: et ? 'Rätikud' : 'Towels', hint: et ? 'nt vahetada igal visiidil' : 'e.g. change every visit' },
            { key: 'specialRequests', label: et ? 'Erisoovid' : 'Special requests', hint: et ? 'nt eritähelepanu köögile; kardinad pooleldi lahti; vannitoas ilma tugeva lõhnata' : 'e.g. extra attention to the kitchen; curtains half open; no strong scents in the bathroom', long: true },
        ];
    },
    get profileFilled() { return this.profileFields.filter((f) => (this.homeProfile[f.key] || '').trim()); },
    homeTypeLabel(t) {
        const et = this.lang === 'et';
        return t === 'apartment' ? (et ? 'Korter' : 'Flat') : t === 'house' ? (et ? 'Maja' : 'House') : t === 'summer' ? (et ? 'Suvila' : 'Cottage') : '';
    },

    pauseReason: '',
    pauseProcessing: false,
    resumeProcessing: false,

    rescheduleBookingId: null,
    rescheduleSlots: {},
    rescheduleSlotsLoading: false,
    rescheduleDate: '',
    rescheduleTime: '',
    rescheduleAvailableTimes: [],
    rescheduleCalendarDays: [],
    rescheduleCurrentMonth: '',
    rescheduleCurrentMonthLabel: '',
    rescheduleProcessing: false,
    rescheduleError: '',
    rescheduleSuccess: false,

    // Partner-managed visit: propose a new time (provider confirms)
    proposeBooking: null,
    proposeDate: '',
    proposeWindow: 'any',
    proposeNote: '',
    proposeProcessing: false,
    proposeError: '',
    proposeSuccess: false,

    // Household contacts (who receives notifications)
    contacts: [],
    contactsSaving: false,
    contactsSaved: false,
    contactsError: '',

    // Away periods (oleme eemal)
    awayFrom: '',
    awayTo: '',
    awayNote: '',
    awayProcessing: false,
    awayError: '',
    awayDone: '',

    // Extras (lisateenused)
    extras: { catalogue: [], timeWindows: [], requests: [], provider: null, florist: null, partners: [], brand: null, maxOpenRequests: 5, away: [] },
    extrasLoaded: false,
    requestService: null,
    requestDate: '',
    requestWindow: 'any',
    requestNote: '',
    requestProcessing: false,
    requestError: '',
    requestDone: null,

    // Kodu hooldusrütm (recurring upkeep) + kodu dokumendid
    maintAdding: false,          // custom-item form open
    maintForm: { name: '', intervalMonths: 6, lastDoneAt: '' },
    maintDoneFor: null,          // item id whose tehtud-date picker is open
    maintDoneDate: '',
    maintBusy: '',
    maintError: '',
    maintShowSuggestions: false,
    docAdding: false,
    docForm: { title: '', url: '', category: 'appliances', note: '' },
    docFile: null,
    docBusy: false,
    docError: '',

    async init() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        // Deep link to a tab (e-mails: /minu?tab=home)
        if (['overview', 'extras', 'visits', 'home'].includes(urlParams.get('tab'))) this.activeTab = urlParams.get('tab');

        // Warm the profile/extras functions in parallel with token validation so the
        // real calls below don't each pay a Cloud Functions cold start in sequence.
        if (urlToken || this.token) {
            for (const p of ['/api/me', '/api/me/extras']) fetch(p, { headers: { 'Authorization': 'Bearer warmup' } }).catch(() => {});
        }

        if (urlToken) {
            try {
                const res = await fetch('/api/auth/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: urlToken }),
                });
                if (res.ok) {
                    const data = await res.json();
                    this.token = data.token;
                    localStorage.setItem('sukoda_portal_token', data.token);
                    const tab = urlParams.get('tab');
                    window.history.replaceState({}, '', tab ? `/minu?tab=${encodeURIComponent(tab)}` : '/minu');
                } else {
                    // A link in the URL is an explicit login attempt — don't keep a previous household's session.
                    localStorage.removeItem('sukoda_portal_token');
                    this.token = '';
                }
            } catch (e) {
                console.error('Token validation failed:', e);
                localStorage.removeItem('sukoda_portal_token');
                this.token = '';
            }
        }

        if (this.token) {
            await this.loadProfile();
        }
        this.loading = false;
    },

    async loadProfile() {
        try {
            const res = await fetch('/api/me', {
                headers: { 'Authorization': 'Bearer ' + this.token },
            });
            if (res.ok) {
                const data = await res.json();
                this.order = data.order;
                this.viewer = data.viewer || null; // who is logged in: primary customer or a household member
                this.bookings = data.bookings || [];
                this.contacts = JSON.parse(JSON.stringify(data.order.contacts || []));
                this.authenticated = true;
                if (data.order.homeProfile) {
                    this.homeProfile = { ...this.homeProfile, ...data.order.homeProfile };
                    this.profileEditing = !this.profileFilled.length;
                }
                this.loadExtras();
            } else {
                localStorage.removeItem('sukoda_portal_token');
                this.token = '';
            }
        } catch (e) {
            console.error('Failed to load profile:', e);
        }
    },

    async loadExtras() {
        try {
            const res = await fetch('/api/me/extras', { headers: { 'Authorization': 'Bearer ' + this.token } });
            if (res.ok) {
                const data = await res.json();
                this.extras = { ...this.extras, ...data };
                this.extrasLoaded = true;
            }
        } catch (e) {
            console.error('Failed to load extras:', e);
        }
    },

    // ---- Contacts ----
    addContact() {
        if (this.contacts.length >= (this.extras.maxContacts || 6)) return;
        this.contacts.push({ name: '', email: '', phone: '', notify: true });
    },
    removeContact(i) {
        this.contacts.splice(i, 1);
    },
    async saveContacts() {
        if (this.contactsSaving) return;
        this.contactsSaving = true;
        this.contactsSaved = false;
        this.contactsError = '';
        try {
            const res = await fetch('/api/me/contacts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ contacts: this.contacts.filter(c => c.name || c.email) }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'failed');
            this.contacts = data.contacts;
            this.contactsSaved = true;
            setTimeout(() => this.contactsSaved = false, 3000);
        } catch (e) {
            this.contactsError = this.lang === 'et' ? 'Salvestamine ebaõnnestus. Kontrolli e-posti aadresse.' : 'Saving failed. Check the email addresses.';
        } finally {
            this.contactsSaving = false;
        }
    },

    // ---- Extras (lisateenused) ----
    todayStr() {
        const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Tallinn', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        return p; // YYYY-MM-DD
    },
    isAwayNow(p) {
        const t = this.todayStr();
        return p.from <= t && t <= p.to;
    },
    presetAwayMonth(offset) {
        const [y, m] = this.todayStr().split('-').map(Number);
        const first = new Date(Date.UTC(y, m - 1 + offset, 1));
        const last = new Date(Date.UTC(y, m + offset, 0));
        const iso = (d) => d.toISOString().slice(0, 10);
        this.awayFrom = offset === 0 ? this.todayStr() : iso(first);
        this.awayTo = iso(last);
    },
    async addAway() {
        if (this.awayProcessing || !this.awayFrom) return;
        this.awayProcessing = true; this.awayError = ''; this.awayDone = '';
        try {
            const res = await fetch('/api/me/away', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ from: this.awayFrom, to: this.awayTo || this.awayFrom, note: this.awayNote }),
            });
            const data = await res.json();
            if (!res.ok) { this.awayError = data.error || (this.lang === 'et' ? 'Salvestamine ebaõnnestus' : 'Could not save'); return; }
            this.extras.away = data.away || [];
            const n = (data.cancelled || []).length;
            this.awayDone = this.lang === 'et'
                ? (n ? `Kirjas. ${n} visiit${n === 1 ? '' : 'i'} tühistatud, koduhooldaja sai teate.` : 'Kirjas. Sellesse vahemikku visiite ei jäänud, koduhooldaja sai teate.')
                : (n ? `Saved. ${n} visit${n === 1 ? '' : 's'} cancelled, your housekeeper has been told.` : 'Saved. No visits fell into this period, your housekeeper has been told.');
            this.awayFrom = ''; this.awayTo = ''; this.awayNote = '';
            await this.loadProfile();
        } catch (e) {
            this.awayError = this.lang === 'et' ? 'Ühendus ebaõnnestus' : 'Connection failed';
        } finally {
            this.awayProcessing = false;
        }
    },
    async removeAway(p) {
        if (this.awayProcessing) return;
        if (!confirm(this.lang === 'et' ? 'Eemalda eemalolek? Tühistatud ajad taastatakse ja koduhooldaja saab teate.' : 'Remove this away period? Cancelled visits are restored and your housekeeper is told.')) return;
        this.awayProcessing = true; this.awayError = ''; this.awayDone = '';
        try {
            const res = await fetch('/api/me/away/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ periodId: p.id }),
            });
            const data = await res.json();
            if (!res.ok) { this.awayError = data.error || 'Error'; return; }
            this.extras.away = data.awayPeriods || [];
            this.awayDone = this.lang === 'et' ? `Eemaldatud. ${data.restored || 0} aega taastatud.` : `Removed. ${data.restored || 0} visit(s) restored.`;
            await this.loadProfile();
        } catch (e) {
            this.awayError = this.lang === 'et' ? 'Ühendus ebaõnnestus' : 'Connection failed';
        } finally {
            this.awayProcessing = false;
        }
    },

    get openRequests() {
        return this.extras.requests.filter(r => r.status === 'requested' || r.status === 'confirmed');
    },
    get pastRequests() {
        return this.extras.requests.filter(r => !['requested', 'confirmed'].includes(r.status));
    },
    get pendingRescheduleIds() {
        return this.extras.requests.filter(r => r.type === 'reschedule' && r.status === 'requested').map(r => r.targetBookingId);
    },
    get minRequestDate() {
        return window.SUKODA_TIME.shiftDateString(window.SUKODA_TIME.getDateString(), 1);
    },
    isOrderable(service) {
        if (!service) return true;
        const cat = (this.extras.categories || []).find((c) => c.id === service.category);
        return !cat || cat.orderable !== false;
    },
    openRequest(service) {
        this.requestService = service;
        this.requestDate = '';
        this.requestWindow = service.category === 'flowers' ? 'with-visit' : 'any';
        this.requestNote = '';
        this.requestError = '';
        this.requestDone = null;
    },
    closeRequest() {
        this.requestService = null;
        this.requestDone = null;
    },

    // ---- Hooldusrütm ----
    get maintenance() { return this.extras.maintenance || { items: [], suggestions: [], intervals: [1, 2, 3, 6, 12, 24], homeType: null, remindersEnabled: true }; },
    // Only what the household itself has to do counts as due for the household
    get maintenanceDue() { return this.maintenance.items.filter((i) => i.state !== 'ok' && i.doneBy !== 'provider').length; },
    get maintHomeItems() { return this.maintenance.items.filter((i) => i.doneBy !== 'provider'); },
    get maintProviderItems() { return this.maintenance.items.filter((i) => i.doneBy === 'provider'); },
    get providerFirstName() { return (this.maintenance.provider?.name || this.extras.provider?.name || '').split(' ')[0]; },
    nextLabel(item) {
        const d = new Date(item.nextDueAt + 'T12:00:00');
        return d.toLocaleDateString(this.lang === 'et' ? 'et-EE' : 'en-GB', { month: 'long', year: 'numeric' });
    },
    lastDoneLabel(item) {
        if (!item.lastDoneAt) return '';
        const d = new Date(item.lastDoneAt + 'T12:00:00').toLocaleDateString(this.lang === 'et' ? 'et-EE' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        return (this.lang === 'et' ? 'viimati ' : 'last ') + d;
    },
    async assignMaintenance(item, doneBy) { await this.maintenanceAction({ action: 'update', itemId: item.id, doneBy }, 'own-' + item.id); },
    intervalLabel(m) {
        if (this.lang === 'et') return m === 1 ? 'iga kuu' : m === 12 ? 'kord aastas' : m === 24 ? 'iga 2 aasta tagant' : `iga ${m} kuu tagant`;
        return m === 1 ? 'monthly' : m === 12 ? 'yearly' : m === 24 ? 'every 2 years' : `every ${m} months`;
    },
    dueLabel(item) {
        const d = new Date(item.nextDueAt + 'T12:00:00');
        const s = d.toLocaleDateString(this.lang === 'et' ? 'et-EE' : 'en-GB', { day: 'numeric', month: 'long' });
        if (item.state === 'overdue') return this.lang === 'et' ? `Aeg möödas · ${s}` : `Overdue · ${s}`;
        if (item.state === 'due') return this.lang === 'et' ? `Peagi · ${s}` : `Soon · ${s}`;
        return s;
    },
    async maintenanceAction(body, busyKey) {
        this.maintBusy = busyKey || 'x';
        this.maintError = '';
        try {
            const res = await fetch('/api/me/maintenance', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) { this.maintError = data.error || 'Error'; return false; }
            this.extras = { ...this.extras, maintenance: data.maintenance };
            return true;
        } catch (e) { this.maintError = 'Error'; return false; } finally { this.maintBusy = ''; }
    },
    async addSuggestion(s) { await this.maintenanceAction({ action: 'add', catalogId: s.id }, 'add-' + s.id); },
    async addCustomMaintenance() {
        if (!this.maintForm.name) return;
        if (await this.maintenanceAction({ action: 'add', name: this.maintForm.name, intervalMonths: Number(this.maintForm.intervalMonths), lastDoneAt: this.maintForm.lastDoneAt || null }, 'custom')) {
            this.maintAdding = false; this.maintForm = { name: '', intervalMonths: 6, lastDoneAt: '' };
        }
    },
    async markMaintenanceDone(item, date) {
        if (await this.maintenanceAction({ action: 'done', itemId: item.id, date: date || null }, 'done-' + item.id)) { this.maintDoneFor = null; this.maintDoneDate = ''; }
    },
    async changeInterval(item, months) { await this.maintenanceAction({ action: 'update', itemId: item.id, intervalMonths: Number(months) }, 'upd-' + item.id); },
    async removeMaintenance(item) {
        if (!confirm(this.lang === 'et' ? 'Eemalda see kirje hooldusrütmist?' : 'Remove this item?')) return;
        await this.maintenanceAction({ action: 'remove', itemId: item.id }, 'rm-' + item.id);
    },
    async setHomeType(homeType) {
        if (this.maintenance.homeType === homeType) return;
        const prev = this.maintenance;
        this.homeProfile.homeType = homeType;
        this.extras = { ...this.extras, maintenance: { ...prev, homeType, suggestions: prev.suggestions.filter((s) => homeType !== 'apartment' || !s.houseOnly) } };
        try {
            const res = await fetch('/api/me/home-type', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify({ homeType }) });
            const data = await res.json();
            if (res.ok) this.extras = { ...this.extras, maintenance: data.maintenance };
            else this.extras = { ...this.extras, maintenance: prev };
        } catch (e) { this.extras = { ...this.extras, maintenance: prev }; }
    },
    /** Telli tegija: open the request drawer for the catalogue service behind an upkeep item */
    orderMaintenance(item) {
        const svc = (this.extras.catalogue || []).find((s) => s.id === item.serviceId);
        if (!svc) return;
        this.activeTab = 'extras';
        this.openRequest(svc);
        this.requestNote = item.name;
    },

    // ---- Composition helpers (layout only; no new data) ----
    get brand() { return this.order?.brand || this.extras.brand || null; },
    /** One colour per role, used on avatars, chips and dots: housekeeper black · builder's team gold · others stone */
    partnerDot(category) { return category === 'cleaning' ? 'bg-black' : category === 'warranty' ? 'bg-accent' : category === 'flowers' ? 'bg-pink-300' : 'bg-[#B8B2AA]'; },
    /** Everyone who comes to this home: server list when loaded, else the housekeeper/florist we already know */
    get partners() {
        if (Array.isArray(this.extras.partners) && this.extras.partners.length) return this.extras.partners;
        const out = [];
        if (this.order?.provider) out.push({ category: 'cleaning', label: this.lang === 'et' ? 'Koristus' : 'Cleaning', ...this.order.provider });
        if (this.extras.florist) out.push({ category: 'flowers', label: this.lang === 'et' ? 'Lilled' : 'Flowers', ...this.extras.florist });
        return out;
    },
    /** Ask the housekeeper to change or stop the standing rhythm — a request, not a self-service switch */
    requestRhythmChange() {
        const svc = (this.extras.catalogue || []).find((s) => s.id === 'other');
        if (!svc) return;
        this.openRequest(svc);
        this.requestNote = this.lang === 'et' ? 'Soovin muuta püsiteenuse rütmi: ' : 'I would like to change the recurring rhythm: ';
    },
    catalogueFor(catId) { return (this.extras.catalogue || []).filter((s) => s.category === catId); },
    get visibleCategories() { return (this.extras.categories || []).filter((c) => this.catalogueFor(c.id).length); },
    categoryBlurb(catId) {
        const et = this.lang === 'et';
        return {
            cleaning: et ? 'Kõik, mida kodu vahel lisaks vajab — samalt inimeselt, kes su kodu juba tunneb.' : 'What your home occasionally needs extra — from the person who already knows it.',
            warranty: et ? 'Uue kodu garantii, tehnosüsteemid ja maja asjad — ehitaja meeskond, kes selle maja tunneb.' : 'Your new home\'s warranty, building systems and house matters — the builder\'s team that knows this building.',
            flowers: et ? 'Hooajaline kimp koju või koos koristusvisiidiga.' : 'A seasonal bouquet, to your door or with a cleaning visit.',
            handyman: et ? 'Pilt seina, filtrid, tilkuv kraan — täpselt ja jälgi jätmata.' : 'A picture on the wall, filters, a dripping tap — precise and clean.',
            garden: et ? 'Muru, hekk, terrass ja hooajatööd õues.' : 'Lawn, hedge, terrace and seasonal work outdoors.',
        }[catId] || '';
    },
    // Extras that belong to the next cleaning visit rather than to a separate appointment
    get visitAddons() {
        const ids = ['linens', 'ironing', 'fridge-oven', 'flowers'];
        return (this.extras.catalogue || []).filter((s) => ids.includes(s.id) && this.isOrderable(s) && !(s.id === 'flowers' && this.extras.flowers?.auto));
    },
    openWithVisit(service) {
        this.openRequest(service);
        this.requestWindow = 'with-visit';
        const b = this.upcomingBookings[0];
        if (b) {
            const d = window.SUKODA_TIME.getDateString(new Date(b.scheduledAt));
            if (d >= this.minRequestDate) this.requestDate = d;
        }
    },
    get upcomingByMonth() {
        const groups = [];
        for (const b of this.upcomingBookings) {
            const key = window.SUKODA_TIME.getYearMonth(new Date(b.scheduledAt));
            let g = groups.find((x) => x.key === key);
            if (!g) {
                g = { key, label: window.SUKODA_TIME.formatDate(b.scheduledAt, this.lang === 'et' ? 'et-EE' : 'en-GB', { month: 'long', year: 'numeric' }), items: [] };
                groups.push(g);
            }
            g.items.push(b);
        }
        return groups;
    },
    dayNumber(iso) { return iso ? window.SUKODA_TIME.formatDate(iso, 'en-GB', { day: 'numeric' }) : ''; },
    weekdayShort(iso) { return iso ? window.SUKODA_TIME.formatDate(iso, this.lang === 'et' ? 'et-EE' : 'en-GB', { weekday: 'short' }).replace('.', '') : ''; },
    monthShort(iso) { return iso ? window.SUKODA_TIME.formatDate(iso, this.lang === 'et' ? 'et-EE' : 'en-GB', { month: 'short' }).replace('.', '') : ''; },

    // ---- Dokumendid ----
    get documents() { return this.extras.documents || { items: [], categories: [] }; },
    get documentsByCategory() {
        const out = [];
        for (const c of this.documents.categories) {
            const items = this.documents.items.filter((d) => d.category === c.id);
            if (items.length) out.push({ ...c, items });
        }
        return out;
    },
    async documentAction(body) {
        this.docBusy = true; this.docError = '';
        try {
            const res = await fetch('/api/me/documents', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) { this.docError = data.error || 'Error'; return false; }
            this.extras = { ...this.extras, documents: data.documents };
            return true;
        } catch (e) { this.docError = 'Error'; return false; } finally { this.docBusy = false; }
    },
    get docsFromDeveloper() { return this.documents.items.filter((d) => d.source === 'developer').length; },
    docKind(d) {

    openReschedule(booking) {
        this.rescheduleBookingId = booking.id;
        this.rescheduleDate = '';
        this.rescheduleTime = '';
        this.rescheduleError = '';
        this.rescheduleSuccess = false;
        this.rescheduleCurrentMonth = window.SUKODA_TIME.getYearMonth(booking.scheduledAt || new Date());
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

    updateRescheduleMonthLabel() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const months = { et: ['Jaanuar', 'Veebruar', 'Märts', 'Aprill', 'Mai', 'Juuni', 'Juuli', 'August', 'September', 'Oktoober', 'November', 'Detsember'], en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'] };
        this.rescheduleCurrentMonthLabel = (months[this.lang] || months.et)[m - 1] + ' ' + y;
    },

    async loadRescheduleSlots() {
        if (!this.order?.size || !this.rescheduleCurrentMonth) return;
        this.rescheduleSlotsLoading = true;
        this.rescheduleError = '';
        try {
            const res = await fetch('/api/slots?size=' + this.order.size + '&month=' + this.rescheduleCurrentMonth);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            this.rescheduleSlots = data.slots || {};
            // Demo account fallback: if no slots from Cal.com, use mock slots so reschedule works
            const isEmpty = Object.keys(this.rescheduleSlots).length === 0;
            if (isEmpty && this.order?.id?.startsWith('demo-')) {
                this.rescheduleSlots = this.getDemoRescheduleSlots();
            }
            this.buildRescheduleCalendar();
        } catch (e) {
            if (this.order?.id?.startsWith('demo-')) {
                this.rescheduleSlots = this.getDemoRescheduleSlots();
                this.buildRescheduleCalendar();
            } else {
                this.rescheduleError = this.lang === 'et' ? 'Aegade laadimine ebaõnnestus.' : 'Failed to load times.';
            }
        } finally {
            this.rescheduleSlotsLoading = false;
        }
    },

    getDemoRescheduleSlots() {
        const [y, m] = (this.rescheduleCurrentMonth || window.SUKODA_TIME.getYearMonth()).split('-').map(Number);
        const slots = {};
        const todayStr = window.SUKODA_TIME.getDateString();
        const times = ['09:00', '10:00', '11:00', '14:00'];
        for (let d = 1; d <= 28; d++) {
            const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            if (dateStr < todayStr) continue;
            const dateObj = new Date(dateStr + 'T12:00:00');
            const dow = dateObj.getDay();
            if (dow >= 1 && dow <= 5) slots[dateStr] = times;
        }
        return slots;
    },

    buildRescheduleCalendar() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const lastDay = new Date(y, m, 0);
        const todayStr = window.SUKODA_TIME.getDateString();
        let startDow = firstDay.getDay() - 1;
        if (startDow < 0) startDow = 6;
        this.rescheduleCalendarDays = [];
        for (let i = 0; i < startDow; i++) {
            this.rescheduleCalendarDays.push({ day: '', date: '', hasSlots: false, isPast: true });
        }
        for (let d = 1; d <= lastDay.getDate(); d++) {
            const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            const hasSlots = this.rescheduleSlots[dateStr] && this.rescheduleSlots[dateStr].length > 0;
            this.rescheduleCalendarDays.push({ day: d, date: dateStr, hasSlots, isPast: dateStr < todayStr });
        }
    },

    rescheduleSelectDay(day) {
        if (!day.hasSlots || day.isPast) return;
        this.rescheduleDate = day.date;
        this.rescheduleTime = '';
        this.rescheduleAvailableTimes = this.rescheduleSlots[day.date] || [];
    },

    reschedulePrevMonth() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const [currentYear, currentMonth] = window.SUKODA_TIME.getYearMonth().split('-').map(Number);
        const currentYM = currentYear * 12 + (currentMonth - 1);
        const targetYM = y * 12 + (m - 2);
        if (targetYM < currentYM) return;
        const newMonth = m - 1;
        const newYear = newMonth < 1 ? y - 1 : y;
        const adjustedMonth = newMonth < 1 ? 12 : newMonth;
        this.rescheduleCurrentMonth = newYear + '-' + String(adjustedMonth).padStart(2, '0');
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

    rescheduleNextMonth() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const newMonth = m + 1;
        const newYear = newMonth > 12 ? y + 1 : y;
        const adjustedMonth = newMonth > 12 ? 1 : newMonth;
        this.rescheduleCurrentMonth = newYear + '-' + String(adjustedMonth).padStart(2, '0');
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

        this.rescheduleBookingId = null;

            weekly: this.lang === 'et' ? '4× kuus' : '4× month',

        // Partner-managed homes: describe the agreed rhythm from the schedule, not a package code
        const f = this.order?.schedule?.active !== false ? this.order?.schedule?.frequency : null;
        const rhythm = { weekly: names.weekly, biweekly: names.twice, monthly: names.once }[f];
        return rhythm || (this.lang === 'et' ? 'Kokkuleppel' : 'As agreed');

            .filter(b => (b.status === 'confirmed' || b.status === 'scheduled') && b.scheduledAt > now)
            .sort((a, b) => a.scheduledAt < b.scheduledAt ? -1 : 1);

    formatDate(iso) {
        if (!iso) return '';
        const opts = { weekday: 'long', day: 'numeric', month: 'long' };

    },

    formatDateShort(v) {
        if (!v) return '';
        const iso = v.length === 10 ? v + 'T12:00:00' : v;
        return window.SUKODA_TIME.formatDate(iso, this.lang === 'et' ? 'et-EE' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

    formatTime(iso) {

                                                        <p class="text-sm text-muted font-sans font-light truncate"><span x-text="visitLabel(booking)"></span><span x-show="booking.providerName || order?.provider?.name" x-text="' · ' + (booking.providerName || order?.provider?.name)"></span><span x-show="booking.price" x-text="' · ' + booking.price"></span></p>

                                </div>

                                <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                    <h2 class="p-h" x-text="lang === 'et' ? 'Püsigraafik' : 'Standing schedule'"></h2>

                                </div>
                            </div>

                            <!-- Away periods: "we're not home" — cancels visits in range, schedule skips it, housekeeper is told -->
                            <div x-show="order?.status === 'paid'" class="bg-white border border-[#E8E3DD]">

                                    <p class="text-sm text-muted font-sans font-light leading-relaxed" x-text="lang === 'et' ? 'Reisile või maale? Märgi periood — selle aja visiidid tühistame, uusi sinna ei planeerita ja koduhooldaja saab kohe teada.' : 'Travelling? Mark the period — visits in that window are cancelled, none are planned into it, and your housekeeper is told right away.'"></p>

                                                </div>
                                                <button @click="removeAway(p)" :disabled="awayProcessing" class="text-[11px] uppercase tracking-[0.15em] text-muted hover:text-black font-sans shrink-0 disabled:opacity-40" x-text="lang === 'et' ? 'Eemalda' : 'Remove'"></button>
                                            </div>
                                        </template>
                                    </div>

                                        </div>
                                        <div>
                                            <label class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Kuni' : 'Until'"></label>

                                        </span>
                                    </button>
                                </div>
                            </div>
                        </aside>
                    </div>

                <!-- ─────────────────────────────────── -->

                <div x-show="activeTab === 'extras'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">

                        <p class="lg:col-span-5 text-base text-muted font-sans font-light leading-relaxed" x-text="extras.showPrices === false

                            <span x-show="requestDate" x-text="' · ' + formatDateShort(requestDate)"></span>
                        </p>
                        <p class="text-sm text-muted font-sans font-light leading-relaxed max-w-sm mx-auto" x-text="requestDone?.interest ? (lang === 'et' ? 'Selles valdkonnas pole sinu kodul veel partnerit. Kui leiame sobiva, anname sulle isiklikult teada — midagi pole veel tellitud.' : 'Your home has no partner for this yet. When we find the right one, we will tell you personally — nothing has been ordered.') : requestDone?.providerName ? (lang === 'et' ? requestDone.providerName + ' kinnitab aja tavaliselt sama päeva jooksul. Saatsime sulle ka kinnituskirja.' : requestDone.providerName + ' usually confirms a time the same day. We also emailed you a confirmation.') : (lang === 'et' ? 'Kinnitame aja tavaliselt sama päeva jooksul. Saatsime sulle ka kinnituskirja.' : 'We usually confirm a time the same day. We also emailed you a confirmation.')"></p>
                        <button type="button" @click="closeRequest()" class="mt-8 bg-black text-paper px-8 py-4 text-xs uppercase tracking-[0.16em] font-sans hover:bg-accent transition-all duration-500" x-text="lang === 'et' ? 'Selge' : 'Done'"></button>
                    </div>

                    <!-- Form -->

                                <p x-show="requestService?.priceHint" class="text-[11px] uppercase tracking-[0.18em] text-accent font-sans mb-1" x-text="requestService?.priceHint"></p>

                            <div x-show="isOrderable(requestService)">

                            </div>
                            <div x-show="isOrderable(requestService)">

                                    <span x-show="requestProcessing" x-cloak>

                                    </span>

            <!-- Propose new time modal (partner-managed visits) -->
            <div x-show="proposeBooking" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-4 bg-black/40" @click.self="closePropose()" @keydown.escape.window="closePropose()">
                <div class="bg-paper w-full sm:max-w-lg max-h-[92vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">
                    <div x-show="proposeSuccess" x-cloak class="text-center py-6">
                        <div class="w-16 h-16 bg-accent rounded-full flex items-center justify-center mx-auto mb-6 animate-checkmark">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="font-serif text-2xl font-light mb-3" x-text="lang === 'et' ? 'Soov saadetud' : 'Request sent'"></h3>
                        <p class="text-sm text-muted font-sans font-light max-w-sm mx-auto" x-text="lang === 'et' ? 'Koduhooldaja kinnitab uue aja ja kõik pere kontaktid saavad uue kalendrikutse.' : 'Your housekeeper confirms the new time and every household contact gets an updated invite.'"></p>
                    </div>
                    <div x-show="!proposeSuccess">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-serif text-xl font-light" x-text="lang === 'et' ? 'Soovi uut aega' : 'Propose a new time'"></h3>
                            <button type="button" @click="closePropose()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <p class="text-sm text-muted font-sans font-light mb-6">
                            <span x-text="lang === 'et' ? 'Praegune aeg: ' : 'Current time: '"></span>
                            <span class="capitalize text-black" x-text="formatDate(proposeBooking?.scheduledAt) + ', ' + formatTime(proposeBooking?.scheduledAt)"></span>.
                            <span x-text="lang === 'et' ? ' Paku sobiv päev — koduhooldaja kinnitab täpse kellaaja.' : ' Suggest a day — your housekeeper confirms the exact time.'"></span>
                        </p>
                        <form @submit.prevent="submitPropose()" class="space-y-6">
                            <div>
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-2" x-text="lang === 'et' ? 'Uus päev' : 'New day'"></label>
                                <input type="date" x-model="proposeDate" :min="minRequestDate" required class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-3 font-sans font-light text-sm">
                            </div>
                            <div>
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-3" x-text="lang === 'et' ? 'Kellaaeg' : 'Time of day'"></label>
                                <div class="grid grid-cols-3 gap-2">
                                    <template x-for="w in extras.timeWindows.filter(x => x.id !== 'with-visit')" :key="w.id">
                                        <button type="button" @click="proposeWindow = w.id" :class="proposeWindow === w.id ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent'" class="py-3 px-2 border text-center text-xs font-sans font-light transition-colors" x-text="w.label"></button>
                                    </template>
                                </div>
                            </div>
                            <div>
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-2" x-text="lang === 'et' ? 'Märkus' : 'Note'"></label>
                                <input type="text" x-model="proposeNote" maxlength="300" :placeholder="lang === 'et' ? 'Valikuline' : 'Optional'" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-3 font-sans font-light text-sm placeholder:text-[#D4CFC8]">
                            </div>
                            <p x-show="proposeError" x-cloak class="text-sm text-red-500 font-sans font-light" x-text="proposeError"></p>
                            <div class="flex gap-4 pt-2">
                                <button type="button" @click="closePropose()" class="px-6 py-3 text-xs uppercase tracking-[0.16em] font-sans border border-black hover:bg-black hover:text-paper transition-all" x-text="lang === 'et' ? 'Loobu' : 'Cancel'"></button>
                                <button type="submit" :disabled="!proposeDate || proposeProcessing" class="flex-1 bg-black text-paper px-6 py-3 text-xs uppercase tracking-[0.16em] font-sans hover:bg-accent transition-all disabled:opacity-50">
                                    <span x-show="!proposeProcessing" x-text="lang === 'et' ? 'Saada soov' : 'Send'"></span>
                                    <span x-show="proposeProcessing" x-cloak>
                                        <svg class="w-4 h-4 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                    </span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Reschedule modal -->
            <div x-show="rescheduleBookingId" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40" @click.self="closeReschedule()">
                <div class="bg-paper max-w-lg w-full max-h-[90vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" @click.stop>
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-serif text-xl font-light" x-text="lang === 'et' ? 'Muuda visiidi aega' : 'Reschedule visit'"></h3>
                        <button @click="closeReschedule()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <div x-show="rescheduleSuccess" x-cloak class="mb-6 p-4 bg-green-50 border border-green-200 text-green-800 text-sm font-sans" x-text="lang === 'et' ? 'Aeg uuendatud. Saadame meeldetuletuse.' : 'Time updated. We\'ll send a reminder.'"></div>
                    <p x-show="rescheduleError" x-cloak class="mb-4 text-accent text-sm font-sans" x-text="rescheduleError"></p>

                    <div x-show="rescheduleSlotsLoading" class="py-8 text-center">
                        <div class="w-10 h-10 border border-accent border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p class="text-sm text-muted font-sans" x-text="lang === 'et' ? 'Laadin vabu aegu...' : 'Loading available times...'"></p>
                    </div>

                    <div x-show="!rescheduleSlotsLoading && !rescheduleSuccess" x-cloak>
                        <div class="mb-6">
                            <div class="flex items-center justify-between mb-4">
                                <button @click="reschedulePrevMonth()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                <h4 class="font-serif text-lg font-light" x-text="rescheduleCurrentMonthLabel"></h4>
                                <button @click="rescheduleNextMonth()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                            <div class="grid grid-cols-7 gap-1 mb-2">
                                <template x-for="(day, di) in (lang === 'et' ? ['E', 'T', 'K', 'N', 'R', 'L', 'P'] : ['M', 'T', 'W', 'T', 'F', 'S', 'S'])" :key="di">
                                    <div class="text-center text-[11px] uppercase tracking-[0.16em] text-muted font-sans py-2" x-text="day"></div>
                                </template>
                            </div>
                            <div class="grid grid-cols-7 gap-1">
                                <template x-for="(d, i) in rescheduleCalendarDays" :key="i">
                                    <button type="button" @click="rescheduleSelectDay(d)" :disabled="!d.day || d.isPast || !d.hasSlots"
                                            :class="{ 'bg-accent/20': d.date === rescheduleDate, 'text-accent': d.hasSlots && !d.isPast && d.date !== rescheduleDate }"
                                            class="aspect-square flex items-center justify-center text-sm font-sans rounded-lg disabled:opacity-40 disabled:cursor-not-allowed hover:bg-cream/50 transition-colors" x-text="d.day"></button>
                                </template>
                            </div>
                        </div>

                        <div x-show="rescheduleDate" x-transition class="mb-6">
                            <p class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans mb-3" x-text="lang === 'et' ? 'Saadaolevad ajad' : 'Available times'"></p>
                            <div class="grid grid-cols-3 gap-2">
                                <template x-for="time in rescheduleAvailableTimes" :key="time">
                                    <button type="button" @click="rescheduleTime = time"
                                            :class="rescheduleTime === time ? 'bg-black text-paper' : 'border border-[#E8E3DD] hover:border-accent'"
                                            class="py-3 px-4 text-center text-sm font-sans font-light rounded transition-colors" x-text="time"></button>
                                </template>
                            </div>
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button @click="closeReschedule()" class="px-6 py-3 text-xs uppercase tracking-[0.16em] font-sans border border-black hover:bg-black hover:text-paper transition-all" x-text="lang === 'et' ? 'Tühista' : 'Cancel'"></button>
                            <button @click="confirmReschedule()" :disabled="!rescheduleDate || !rescheduleTime || rescheduleProcessing"
                                    class="flex-1 bg-black text-paper px-6 py-3 text-xs uppercase tracking-[0.16em] font-sans hover:bg-accent transition-all disabled:opacity-50">
                                <span x-show="!rescheduleProcessing" x-text="lang === 'et' ? 'Kinnita' : 'Confirm'"></span>
                                <span x-show="rescheduleProcessing" x-cloak>
                                    <svg class="w-4 h-4 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer (compact: this is a working portal, not the marketing site) -->
            <footer class="border-t border-[#E8E3DD] px-6 md:px-12 py-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 text-sm font-sans font-light text-muted">
                    <div class="flex items-center gap-4">
                        <a href="index.html" class="font-serif text-lg tracking-[0.08em] font-light text-black">SUKODA</a>
                        <span class="hidden md:inline text-[#D4CFC8]">·</span>
                        <a href="mailto:tere@sukoda.ee" class="hover:text-black transition-colors">tere@sukoda.ee</a>
                    </div>
                    <div class="flex flex-wrap items-center gap-x-5 gap-y-2">
                        <a href="tingimused.html" class="hover:text-black transition-colors" x-text="lang === 'et' ? 'Tingimused' : 'Terms'"></a>
                        <a href="privaatsus.html" class="hover:text-black transition-colors" x-text="lang === 'et' ? 'Privaatsus' : 'Privacy'"></a>
                        <span class="text-xs">© 2026 Epic Ship OÜ · 14713548</span>
                    </div>
                </div>
            </footer>
        </div>

    </div>

</body>
</html>
