                                                    <button type="button" @click="markMaintenanceDone(item)" :disabled="!!maintBusy" class="text-black hover:text-accent transition-colors disabled:opacity-40" x-text="lang === 'et' ? 'Tehtud' : 'Done'"></button>
                                                    <button type="button" @click="maintDoneFor = maintDoneFor === item.id ? null : item.id; maintDoneDate = maintenance.today" class="text-muted hover:text-black transition-colors" x-text="lang === 'et' ? 'Muu kuupäev' : 'Other date'"></button>
                                                    <button type="button" x-show="item.serviceId" @click="orderMaintenance(item)" class="text-accent hover:text-black transition-colors" x-text="!item.orderable ? (lang === 'et' ? 'Soovin tegijat' : 'Want someone') : item.doerCategory === 'warranty' ? (lang === 'et' ? 'Lepi aeg' : 'Agree a time') : (lang === 'et' ? 'Telli' : 'Order')"></button>
                                                    <button type="button" x-show="maintenance.provider && item.doer !== 'partner'" @click="assignMaintenance(item, 'provider')" :disabled="!!maintBusy" class="text-muted hover:text-black transition-colors" x-text="(lang === 'et' ? 'Teeb ' : 'Done by ') + providerFirstName"></button>
                                                    <button type="button" @click="removeMaintenance(item)" class="text-muted/60 hover:text-black transition-colors" x-text="lang === 'et' ? 'Eemalda' : 'Remove'"></button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <div x-show="maintProviderItems.length" x-cloak>
                                <h3 class="font-serif text-2xl font-light mb-2" x-text="providerFirstName || (lang === 'et' ? 'Koduhooldaja' : 'Housekeeper')"></h3>
                                <div>
                                    <template x-for="item in maintProviderItems" :key="item.id">
                                        <div class="border-b border-[#E8E3DD]">
                                            <button type="button" @click="maintOpen = maintOpen === item.id ? null : item.id; if (maintOpen === item.id) $nextTick(() => $el.nextElementSibling && $el.nextElementSibling.scrollIntoView({ behavior: 'smooth', block: 'nearest' }))" class="w-full text-left py-3 flex items-baseline justify-between gap-4">
                                                <span class="font-sans text-sm font-light" x-text="item.name"></span>
                                                <span class="shrink-0 text-xs text-muted font-sans font-light" x-text="intervalLabel(item.intervalMonths)"></span>
                                            </button>
                                            <div x-show="maintOpen === item.id" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="pb-4">
                                                <p class="text-sm text-muted font-sans font-light" x-text="(item.lastDoneAt ? lastDoneLabel(item) + ' · ' : '') + (lang === 'et' ? 'järgmine ' : 'next ') + nextLabel(item)"></p>
                                                <button type="button" @click="assignMaintenance(item, 'home')" :disabled="!!maintBusy" class="mt-3 text-[11px] uppercase tracking-[0.14em] font-sans text-muted hover:text-black transition-colors" x-text="lang === 'et' ? 'Teen ise' : 'I do it'"></button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <p x-show="!maintenance.items.length && extrasLoaded" class="text-sm text-muted font-sans font-light" x-text="lang === 'et' ? 'Midagi pole veel kirjas.' : 'Nothing here yet.'"></p>

                            <div x-show="maintenance.suggestions.length">
                                <button type="button" @click="maintShowSuggestions = !maintShowSuggestions" x-show="maintenance.items.length" class="text-[11px] uppercase tracking-[0.14em] font-sans text-muted hover:text-black" x-text="maintShowSuggestions ? (lang === 'et' ? 'Peida' : 'Hide') : (lang === 'et' ? 'Lisa' : 'Add')"></button>
                                <div x-show="maintShowSuggestions || !maintenance.items.length" x-cloak>
                                    <template x-for="s in maintenance.suggestions" :key="s.id">
                                        <button type="button" @click="addSuggestion(s)" :disabled="!!maintBusy" class="w-full text-left py-3 border-b border-[#E8E3DD] flex items-baseline justify-between gap-4 disabled:opacity-50 hover:border-black transition-colors">
                                            <span class="font-sans text-sm font-light" x-text="s.name"></span>
                                            <span class="text-xs text-muted font-sans font-light shrink-0" x-text="intervalLabel(s.intervalMonths)"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>

                            <!-- Custom item -->
                            <div class="mt-6">
                                <button type="button" x-show="!maintAdding" @click="maintAdding = true" class="text-[11px] uppercase tracking-[0.16em] font-sans font-medium text-accent hover:text-black transition-colors" x-text="lang === 'et' ? '+ Lisa oma kirje' : '+ Add your own'"></button>
                                <div x-show="maintAdding" x-cloak class="border border-[#E8E3DD] p-4 grid sm:grid-cols-3 gap-4">
                                    <label class="block sm:col-span-3"><span class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Mis' : 'What'"></span><input type="text" x-model="maintForm.name" maxlength="80" :placeholder="lang === 'et' ? 'nt Rõduukse tihendi kontroll' : 'e.g. Balcony door seal check'" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base placeholder:text-[#D4CFC8]"></label>
                                    <label class="block"><span class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Kui tihti' : 'How often'"></span>
                                        <select x-model.number="maintForm.intervalMonths" class="w-full bg-transparent border-b border-[#E8E3DD] py-2 font-sans font-light text-base outline-none"><template x-for="m in maintenance.intervals" :key="m"><option :value="m" x-text="intervalLabel(m)"></option></template></select></label>
                                    <label class="block"><span class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Viimati tehtud' : 'Last done'"></span><input type="date" x-model="maintForm.lastDoneAt" :max="maintenance.today" class="w-full bg-transparent border-b border-[#E8E3DD] py-2 font-sans font-light text-base outline-none"></label>
                                    <div class="flex items-end gap-3">
                                        <button type="button" @click="addCustomMaintenance()" :disabled="!maintForm.name || !!maintBusy" class="p-btn p-btn-sm disabled:opacity-50" x-text="lang === 'et' ? 'Lisa' : 'Add'"></button>
                                        <button type="button" @click="maintAdding = false" class="text-[11px] uppercase tracking-[0.15em] text-muted hover:text-black font-sans pb-2.5" x-text="lang === 'et' ? 'Loobu' : 'Cancel'"></button>
                                    </div>
                                </div>
                            </div>
                            <p x-show="maintError" x-cloak class="text-sm text-red-500 font-sans font-light mt-3" x-text="maintError"></p>
                            <label x-show="maintHomeItems.length" class="flex items-start gap-3 mt-6 pt-5 border-t border-[#E8E3DD] text-sm font-sans font-light text-muted cursor-pointer">
                                <input type="checkbox" :checked="maintenance.remindersEnabled !== false" @change="maintenanceAction({ action: 'reminders', enabled: $event.target.checked }, 'reminders')" class="mt-0.5 accent-black">
                                <span x-text="lang === 'et' ? 'Meeldetuletus e-postiga, kaks nädalat enne.' : 'An e-mail reminder, two weeks before.'"></span>
                            </label>
                            </div>
                        </div>

                        </div>

                        <aside class="lg:col-span-5 space-y-6 lg:space-y-8 min-w-0">

                        <!-- ── Household contacts ── -->
                        <div class="bg-white border border-[#E8E3DD]">
                            <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h" x-text="lang === 'et' ? 'Kes saab teavitusi' : 'Who receives notifications'"></h2>
                                <p class="text-xs text-muted font-sans font-light" x-text="(1 + contacts.length) + ' / ' + (1 + (extras.maxContacts || 6))"></p>
                            </div>
                            <div class="p-6">
                            <p class="text-sm text-muted font-sans font-light leading-relaxed" x-text="lang === 'et' ? 'Kes veel peaks aegadest teada saama. Teade ja kalendrikutse jõuavad ka temani.' : 'Who else should know the times. The notice and the calendar invite reach them too.'"></p>
                            <div class="mt-6 space-y-3">
                                <div class="flex items-center gap-4 text-base font-sans bg-cream/50 px-4 py-3">
                                    <div class="w-10 h-10 rounded-full bg-black text-paper flex items-center justify-center text-sm shrink-0" x-text="(order?.customerName || '?').charAt(0)"></div>
                                    <div class="min-w-0 flex-1">
                                        <p class="truncate" x-text="order?.customerName"></p>
                                        <p class="text-sm text-muted font-light truncate"><span x-text="order?.customerEmail"></span><span x-show="order?.customerPhone" x-text="' · ' + order?.customerPhone"></span></p>
                                    </div>
                                    <span class="text-[11px] uppercase tracking-[0.15em] text-muted shrink-0" x-text="lang === 'et' ? 'Sina' : 'You'"></span>
                                </div>
                                <template x-for="(c, i) in contacts" :key="c.id || ('new-' + i)">
                                    <div class="border border-[#E8E3DD] bg-white p-4">
                                        <div class="flex items-center gap-4 mb-4">
                                            <div class="w-10 h-10 rounded-full bg-cream text-black flex items-center justify-center text-sm shrink-0" x-text="(c.name || '?').charAt(0)"></div>
                                            <div class="min-w-0 flex-1">
                                                <p class="truncate font-sans" x-text="c.name || (lang === 'et' ? 'Uus inimene' : 'New person')"></p>
                                                <p class="text-sm text-muted font-light truncate" x-text="lang === 'et' ? 'Saab samad ajad ja kalendrikutsed' : 'Gets the same times and calendar invites'"></p>
                                            </div>
                                            <span class="text-[11px] uppercase tracking-[0.15em] text-muted shrink-0" x-text="lang === 'et' ? 'Pere' : 'Household'"></span>
                                        </div>
                                        <div class="grid sm:grid-cols-2 gap-4">
                                            <label class="block">
                                                <span class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Nimi' : 'Name'"></span>
                                                <input type="text" x-model="c.name" :placeholder="lang === 'et' ? 'nt Kristi' : 'e.g. Mark'" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base placeholder:text-[#D4CFC8]">
                                            </label>
                                            <label class="block">
                                                <span class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Telefon' : 'Phone'"></span>
                                                <input type="tel" x-model="c.phone" placeholder="+372 …" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base placeholder:text-[#D4CFC8]">
                                            </label>
                                            <label class="block sm:col-span-2">
                                                <span class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'E-post' : 'Email'"></span>
                                                <input type="email" x-model="c.email" placeholder="nimi@näide.ee" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base placeholder:text-[#D4CFC8]">
                                            </label>
                                        </div>
                                        <div class="flex items-center justify-end gap-4 mt-3">
                                            <button type="button" @click="removeContact(i)" class="text-[11px] uppercase tracking-[0.15em] text-muted hover:text-black font-sans shrink-0" x-text="lang === 'et' ? 'Eemalda' : 'Remove'"></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="flex flex-wrap items-center gap-4 mt-6">
                                <button type="button" @click="addContact()" :disabled="contacts.length >= (extras.maxContacts || 6)" class="text-[11px] uppercase tracking-[0.16em] font-sans font-medium text-accent hover:text-black transition-colors disabled:opacity-40" x-text="lang === 'et' ? '+ Lisa inimene' : '+ Add person'"></button>
                                <button type="button" x-show="contacts.length" @click="saveContacts()" :disabled="contactsSaving" class="ml-auto p-btn disabled:opacity-50">
                                    <span x-show="!contactsSaving" x-text="lang === 'et' ? 'Salvesta' : 'Save'"></span>
                                    <span x-show="contactsSaving" x-cloak x-text="lang === 'et' ? 'Salvestan…' : 'Saving…'"></span>
                                </button>
                                <span x-show="contactsSaved" x-cloak x-transition class="text-green-600 text-sm font-sans font-light" x-text="lang === 'et' ? 'Salvestatud' : 'Saved'"></span>
                            </div>
                            <p x-show="contactsError" x-cloak class="text-sm text-red-500 font-sans font-light mt-3" x-text="contactsError"></p>
                            </div>
                        </div>

                        </aside>

                        <!-- ── Kodu kaust: everything that belongs to the home, as real files — handed over with the keys, handed on with the home ── -->
                        <div id="dokumendid" class="lg:col-span-12 bg-white border border-[#E8E3DD] p-have">
                            <div class="flex flex-wrap items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h"><span class="p-num">03</span><span x-text="lang === 'et' ? 'Kodu kaust' : 'Home folder'"></span></h2>
                                <button type="button" @click="docAdding = !docAdding; docFile = null" class="p-btn-2 p-btn-sm" x-text="lang === 'et' ? '+ Lisa fail' : '+ Add a file'"></button>
                            </div>

                            <!-- Add: a file (PDF or photo) or a link — one form -->
                            <div x-show="docAdding" x-cloak class="px-6 py-6 border-b border-[#E8E3DD] bg-white">
                                <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
                                    <label class="block lg:col-span-2 border border-dashed border-[#D4CFC8] hover:border-black transition-colors p-4 cursor-pointer flex items-center gap-4" :class="docFile ? 'border-black bg-cream/40' : ''">
                                        <svg class="w-6 h-6 text-accent shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"></path></svg>
                                        <span class="min-w-0">
                                            <span class="font-sans text-sm block truncate" x-text="docFile ? docFile.name : (lang === 'et' ? 'Vali fail — PDF või foto' : 'Choose a file — PDF or photo')"></span>
                                            <span class="text-xs text-muted font-sans font-light" x-text="docFile ? Math.round(docFile.size / 1024) + ' KB' : (lang === 'et' ? 'kuni 8 MB · või jäta tühjaks ja lisa link' : 'up to 8 MB · or leave empty and add a link')"></span>
                                        </span>
                                        <input type="file" class="hidden" accept="application/pdf,image/jpeg,image/png,image/webp,image/heic" @change="onDocFile($event)">
                                    </label>
                                    <label class="block"><span class="text-[10px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Pealkiri' : 'Title'"></span><input type="text" x-model="docForm.title" maxlength="120" :placeholder="lang === 'et' ? 'nt Kodukindlustus 2026' : 'e.g. Home insurance 2026'" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base placeholder:text-[#D4CFC8]"></label>
                                    <label class="block"><span class="text-[10px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Kategooria' : 'Category'"></span>
                                        <select x-model="docForm.category" class="w-full bg-transparent border-b border-[#E8E3DD] py-2 font-sans font-light text-base outline-none"><template x-for="c in documents.categories" :key="c.id"><option :value="c.id" x-text="c.label"></option></template></select></label>
                                    <label class="block lg:col-span-2" x-show="!docFile"><span class="text-[10px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Link (kui faili pole)' : 'Link (if there is no file)'"></span><input type="url" x-model="docForm.url" placeholder="https://" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base placeholder:text-[#D4CFC8]"></label>
                                    <label class="block lg:col-span-2"><span class="text-[10px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Märge' : 'Note'"></span><input type="text" x-model="docForm.note" maxlength="300" :placeholder="lang === 'et' ? 'nt kehtib kuni 03.2028' : 'e.g. valid until 03.2028'" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base placeholder:text-[#D4CFC8]"></label>
                                </div>
                                <div class="flex items-center gap-4 mt-5">
                                    <button type="button" @click="addDocument()" :disabled="!docForm.title || docBusy" class="p-btn" x-text="docBusy ? (lang === 'et' ? 'Salvestan…' : 'Saving…') : (docFile ? (lang === 'et' ? 'Laadi kausta' : 'Upload to folder') : (lang === 'et' ? 'Lisa kausta' : 'Add to folder'))"></button>
                                    <button type="button" @click="docAdding = false; docFile = null" class="text-[11px] uppercase tracking-[0.15em] text-muted hover:text-black font-sans" x-text="lang === 'et' ? 'Loobu' : 'Cancel'"></button>
                                    <p x-show="docError" x-cloak class="text-sm text-red-500 font-sans font-light" x-text="docError"></p>
                                </div>
                            </div>

                            <div x-show="documents.items.length">
                                <template x-for="group in documentsByCategory" :key="group.id">
                                    <div class="border-b border-[#E8E3DD] last:border-b-0">
                                        <p class="px-6 pt-5 pb-1 text-[10px] uppercase tracking-[0.16em] text-muted font-sans" x-text="group.label"></p>
                                        <div class="divide-y divide-[#E8E3DD]">
                                            <template x-for="d in group.items" :key="d.id">
                                                <div class="px-6 py-3 flex items-center justify-between gap-4">
                                                    <span class="min-w-0">
                                                        <span class="block font-sans text-sm truncate" x-text="d.title"></span>
                                                        <span x-show="d.note" class="block text-xs text-muted font-sans font-light truncate" x-text="d.note"></span>
                                                    </span>
                                                    <span class="flex items-center gap-4 shrink-0">
                                                        <button type="button" x-show="d.source !== 'developer'" @click="removeDocument(d)" class="text-[10px] uppercase tracking-[0.14em] text-muted hover:text-black font-sans" x-text="lang === 'et' ? 'Eemalda' : 'Remove'"></button>
                                                        <a x-show="d.file || d.url" :href="d.file ? fileHref(d) : d.url" target="_blank" rel="noopener" class="text-[11px] uppercase tracking-[0.14em] font-sans text-muted hover:text-black" x-text="lang === 'et' ? 'Ava' : 'Open'"></a>
                                                    </span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <p x-show="!documents.items.length" class="px-6 py-10 text-center text-sm text-muted font-sans font-light" x-text="lang === 'et' ? 'Kaust on veel tühi. Lisa esimene fail — leping, garantii või seadme juhend.' : 'The folder is still empty. Add the first file — a contract, a warranty or an appliance manual.'"></p>
                        </div>
                    </div>
                </div>

                <!-- ─────────────────────────────────── -->
                <!-- TAB 3: VISITS                        -->
                <!-- ─────────────────────────────────── -->
                <div x-show="activeTab === 'visits'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
                    <div class="grid lg:grid-cols-12 gap-6 lg:gap-8 items-start">

                        <div class="lg:col-span-8 space-y-6 lg:space-y-8 min-w-0">

                            <!-- Upcoming: a timeline grouped by month -->
                            <div class="bg-white border border-[#E8E3DD]">
                                <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                    <h2 class="p-h"><span class="p-num">01</span><span x-text="lang === 'et' ? 'Eelseisvad' : 'Upcoming'"></span></h2>
                                    <p class="text-xs text-muted font-sans font-light" x-show="upcomingBookings.length" x-text="upcomingBookings.length + (lang === 'et' ? (upcomingBookings.length === 1 ? ' visiit' : ' visiiti') : (upcomingBookings.length === 1 ? ' visit' : ' visits'))"></p>
                                </div>

                                <div x-show="upcomingBookings.length === 0" class="p-10 text-center">
                                    <svg class="w-8 h-8 text-muted mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    <p class="text-sm text-muted font-sans font-light" x-text="lang === 'et' ? 'Visiite pole veel planeeritud' : 'No visits scheduled yet'"></p>
                                </div>

                                <div class="divide-y divide-[#E8E3DD]">
                                    <template x-for="g in upcomingByMonth" :key="g.key">
                                        <div class="divide-y divide-[#E8E3DD]">
                                            <p class="px-6 py-2.5 bg-cream/50 text-[11px] uppercase tracking-[0.18em] text-muted font-sans" x-text="g.label"></p>
                                            <template x-for="booking in g.items" :key="booking.id">
                                                <div class="grid grid-cols-[56px_minmax(0,1fr)] sm:grid-cols-[64px_minmax(0,1fr)_auto] items-center gap-x-5 gap-y-3 px-6 py-4">
                                                    <div class="w-14 h-14 rounded-full flex flex-col items-center justify-center leading-none shrink-0" :class="booking.kind === 'extra' ? 'bg-white border border-[#E8E3DD]' : 'bg-accent/10'">
                                                        <span class="font-serif text-2xl" :class="booking.kind === 'extra' ? 'text-black' : 'text-accent'" x-text="dayNumber(booking.scheduledAt)"></span>
                                                        <span class="text-[10px] uppercase tracking-[0.14em] text-muted font-sans mt-0.5" x-text="weekdayShort(booking.scheduledAt)"></span>
                                                    </div>
                                                    <div class="min-w-0">
                                                        <p class="font-sans text-base"><span class="capitalize" x-text="window.SUKODA_TIME.formatDate(booking.scheduledAt, lang === 'et' ? 'et-EE' : 'en-GB', { weekday: 'long' })"></span> · <span x-text="formatTime(booking.scheduledAt)"></span></p>
                                                        <p class="text-sm text-muted font-sans font-light truncate"><span x-text="visitLabel(booking)"></span><span x-show="booking.providerName || order?.provider?.name" x-text="' · ' + (booking.providerName || order?.provider?.name)"></span><span x-show="booking.price" x-text="' · ' + booking.price"></span></p>
                                                        <p x-show="booking.customerNote" class="text-xs text-muted font-sans font-light mt-1" x-text="booking.customerNote"></p>
                                                    </div>
                                                    <div class="col-span-2 sm:col-span-1 flex sm:justify-end">
                                                        <span x-show="pendingRescheduleIds.includes(booking.id)" class="inline-flex px-2.5 py-1 text-[10px] uppercase tracking-[0.15em] font-sans text-amber-600 bg-amber-50 rounded-full" x-text="lang === 'et' ? 'Uus aeg ootel' : 'New time pending'"></span>
                                                        <button type="button" x-show="!pendingRescheduleIds.includes(booking.id)" @click="changeTime(booking)" class="h-9 px-4 border border-[#E8E3DD] text-[11px] uppercase tracking-[0.16em] font-sans hover:border-black transition-colors" x-text="lang === 'et' ? 'Muuda aega' : 'Reschedule'"></button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- Past -->
                            <div x-show="pastBookings.length > 0" class="border border-[#E8E3DD]">
                                <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                    <h2 class="p-h"><span class="p-num">02</span><span x-text="lang === 'et' ? 'Möödunud' : 'Past'"></span></h2>
                                    <p class="text-xs text-muted font-sans font-light" x-text="pastBookings.length"></p>
                                </div>
                                <div class="divide-y divide-[#E8E3DD]">
                                    <template x-for="booking in pastBookings" :key="booking.id">
                                        <div class="px-6 py-3 grid grid-cols-[minmax(0,1fr)_auto] sm:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] items-center gap-x-6 text-sm font-sans font-light text-muted">
                                            <p class="text-black/70" x-text="formatDateLong(booking.scheduledAt)"></p>
                                            <p class="hidden sm:block truncate"><span x-text="formatTime(booking.scheduledAt)"></span> · <span x-text="visitLabel(booking)"></span><span x-show="booking.providerName" x-text="' · ' + shortName(booking.providerName)"></span></p>
                                            <span class="text-[11px] uppercase tracking-[0.15em] flex items-center gap-2">
                                                <svg x-show="booking.status === 'completed'" class="w-3 h-3 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>
                                                <span x-text="booking.status === 'completed' ? (lang === 'et' ? 'Tehtud' : 'Completed') : booking.status === 'cancelled' ? (lang === 'et' ? 'Tühistatud' : 'Cancelled') : (lang === 'et' ? 'Möödunud' : 'Past')"></span>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <aside class="lg:col-span-4 space-y-6 lg:space-y-8 min-w-0">

                            <!-- The standing rhythm behind the list -->
                            <div class="border border-[#E8E3DD]">
                                <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                    <h2 class="p-h" x-text="lang === 'et' ? 'Püsigraafik' : 'Standing schedule'"></h2>
                                    <span class="inline-flex items-center px-3 py-1 text-[11px] uppercase tracking-[0.12em] font-sans font-medium rounded-full" :class="getStatusColor(order?.status)" x-text="getStatusLabel(order?.status)"></span>
                                </div>
                                <div class="p-6">
                                    <p class="font-serif text-3xl font-light" x-text="getPackageName(order?.package)"></p>
                                    <p class="text-sm text-muted font-sans font-light mt-1"><span x-text="lang === 'et' ? 'Regulaarne koristus' : 'Regular cleaning'"></span><span x-show="order?.provider?.name" x-text="' · ' + order?.provider?.name"></span></p>
                                </div>
                            </div>

                            <!-- Away periods: "we're not home" — cancels visits in range, schedule skips it, housekeeper is told -->
                            <div x-show="order?.status === 'paid'" class="bg-white border border-[#E8E3DD]">
                                <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                    <h2 class="p-h" x-text="lang === 'et' ? 'Oleme eemal' : 'We are away'"></h2>
                                    <span x-show="awayNow" x-cloak class="inline-flex px-2.5 py-1 text-[10px] uppercase tracking-[0.15em] font-sans text-amber-700 bg-amber-50 rounded-full" x-text="lang === 'et' ? 'Praegu eemal' : 'Away now'"></span>
                                </div>
                                <div class="p-6">
                                    <p class="text-sm text-muted font-sans font-light leading-relaxed" x-text="lang === 'et' ? 'Märgi periood. Regulaarne koristus jääb vahele ja koduhooldaja saab teada.' : 'Mark the period. Regular cleaning is skipped and the housekeeper is told.'"></p>

                                    <!-- Saved periods -->
                                    <div x-show="extras.away?.length" x-cloak class="mt-5 border border-[#E8E3DD] divide-y divide-[#E8E3DD]">
                                        <template x-for="p in extras.away" :key="p.id">
                                            <div class="flex items-center justify-between gap-4 px-4 py-3" :class="isAwayNow(p) ? 'bg-amber-50/60' : 'bg-cream/40'">
                                                <div class="min-w-0">
                                                    <p class="text-sm font-sans" :class="isAwayNow(p) ? 'text-amber-800' : ''">
                                                        <span x-text="formatDateShort(p.from)"></span><span x-show="p.to !== p.from"> – <span x-text="formatDateShort(p.to)"></span></span>
                                                    </p>
                                                    <p x-show="p.note" class="text-xs text-muted font-sans font-light truncate" x-text="p.note"></p>
                                                </div>
                                                <button @click="removeAway(p)" :disabled="awayProcessing" class="text-[11px] uppercase tracking-[0.15em] text-muted hover:text-black font-sans shrink-0 disabled:opacity-40" x-text="lang === 'et' ? 'Eemalda' : 'Remove'"></button>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3 mt-6">
                                        <div>
                                            <label class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Alates' : 'From'"></label>
                                            <input type="date" x-model="awayFrom" :min="todayStr()" class="w-full border border-[#E8E3DD] bg-white px-3 py-2 text-sm font-sans font-light outline-none focus:border-accent">
                                        </div>
                                        <div>
                                            <label class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1" x-text="lang === 'et' ? 'Kuni' : 'Until'"></label>
                                            <input type="date" x-model="awayTo" :min="awayFrom || todayStr()" class="w-full border border-[#E8E3DD] bg-white px-3 py-2 text-sm font-sans font-light outline-none focus:border-accent">
                                        </div>
                                    </div>
                                    <input type="text" x-model="awayNote" maxlength="300" :placeholder="lang === 'et' ? 'Märkus koduhooldajale (valikuline)' : 'Note for your housekeeper (optional)'" class="w-full mt-3 border border-[#E8E3DD] bg-white px-3 py-2 text-sm font-sans font-light outline-none focus:border-accent placeholder:text-[#D4CFC8]">
                                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs font-sans">
                                        <button type="button" @click="presetAwayMonth(1)" class="text-muted hover:text-black" x-text="lang === 'et' ? 'Terve järgmine kuu' : 'All of next month'"></button>
                                        <button type="button" @click="presetAwayMonth(0)" class="text-muted hover:text-black" x-text="lang === 'et' ? 'Selle kuu lõpuni' : 'Rest of this month'"></button>
                                    </div>
                                    <button type="button" @click="addAway()" :disabled="awayProcessing || !awayFrom" class="p-btn-2 w-full mt-5 disabled:opacity-40">
                                        <span x-show="!awayProcessing" x-text="lang === 'et' ? 'Märgi eemalolek' : 'Save away period'"></span>
                                        <span x-show="awayProcessing" x-cloak x-text="lang === 'et' ? 'Salvestan…' : 'Saving…'"></span>
                                    </button>
                                    <p x-show="awayError" x-cloak class="text-xs text-red-500 font-sans mt-3" x-text="awayError"></p>
                                    <p x-show="awayDone" x-cloak class="text-xs text-green-700 font-sans mt-3" x-text="awayDone"></p>
                                </div>
                            </div>

                            <!-- Pause / Resume section (SUKODA Stripe subscriptions only; partner-managed and developer homes agree pauses with their housekeeper) -->
                            <div x-show="order?.status === 'paid' && order?.source !== 'manual' && !brand">

                                <!-- Active state: show pause option -->
                                <div x-show="!order?.pausedAt" class="border border-[#E8E3DD]">
                                    <div class="flex items-center gap-3 px-6 py-4 border-b border-[#E8E3DD]">
                                        <h2 class="p-h" x-text="lang === 'et' ? 'Peata tellimus' : 'Pause subscription'"></h2>
                                    </div>
                                    <div class="p-6">
                                        <p class="text-sm text-muted font-sans font-light mb-4" x-text="lang === 'et' ? 'Saad tellimuse igal ajal peatada ja hiljem jätkata.' : 'You can pause your subscription at any time and resume later.'"></p>
                                        <input type="text"
                                               x-model="pauseReason"
                                               :placeholder="lang === 'et' ? 'Põhjus (valikuline)' : 'Reason (optional)'"
                                               class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-sm transition-colors placeholder:text-[#D4CFC8] mb-5">
                                        <button type="button" @click="pauseSubscription()"
                                                :disabled="pauseProcessing"
                                                class="p-btn-2 disabled:opacity-50">
                                            <span x-show="!pauseProcessing" x-text="lang === 'et' ? 'Peata' : 'Pause'"></span>
                                            <span x-show="pauseProcessing" x-cloak>
                                                <svg class="w-4 h-4 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                            </span>
                                        </button>
                                    </div>
                                </div>

                                <!-- Paused state: show resume option -->
                                <div x-show="order?.pausedAt" x-cloak class="bg-amber-50/50 border border-amber-200 p-6">
                                    <div class="flex items-center gap-3 mb-4">
                                        <svg class="w-5 h-5 text-amber-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
                                        <p class="text-sm font-sans font-medium text-amber-700" x-text="lang === 'et' ? 'Tellimus on pausil' : 'Subscription is paused'"></p>
                                    </div>
                                    <p class="text-sm text-amber-700/80 font-sans font-light mb-2">
                                        <span x-text="lang === 'et' ? 'Pausil alates ' : 'Paused since '"></span>
                                        <span x-text="formatDate(order?.pausedAt)"></span>
                                    </p>
                                    <p class="text-sm text-amber-700/80 font-sans font-light mb-6" x-text="lang === 'et' ? 'Pausil olev tellimus jätkab tasumisega. Visiidid taastuvad pärast jätkamist.' : 'Your paused subscription continues billing. Visits will resume when you resume.'"></p>
                                    <button type="button" @click="resumeSubscription()"
                                            :disabled="resumeProcessing"
                                            class="p-btn disabled:opacity-50">
                                        <span x-show="!resumeProcessing" x-text="lang === 'et' ? 'Jätka tellimust' : 'Resume subscription'"></span>
                                        <span x-show="resumeProcessing" x-cloak>
                                            <svg class="w-4 h-4 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </aside>
                    </div>
                </div>

                <!-- ─────────────────────────────────── -->
                <!-- TAB 4: SERVICES — by need, not by provider -->
                <!-- ─────────────────────────────────── -->
                <div x-show="activeTab === 'extras'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">

                    <!-- Open requests -->
                    <div x-show="openRequests.length" x-cloak class="mb-10 md:mb-12">
                        <div class="flex items-center justify-between gap-4 mb-3">
                            <h2 class="p-h"><span x-text="lang === 'et' ? 'Sinu pöördumised' : 'Your requests'"></span><span class="p-num" x-text="openRequests.length"></span></h2>
                            <button type="button" x-show="pastRequests.length" @click="$nextTick(() => document.getElementById('ajalugu')?.scrollIntoView({ behavior: 'smooth', block: 'start' }))" class="text-[11px] uppercase tracking-[0.16em] font-sans text-muted hover:text-black transition-colors" x-text="lang === 'et' ? 'Varasemad →' : 'Earlier →'"></button>
                        </div>
                        <div class="bg-white border border-[#E8E3DD] divide-y divide-[#E8E3DD]">
                            <template x-for="r in openRequests" :key="r.id">
                                <button type="button" @click="openThread(r)" class="group w-full text-left px-5 py-3.5 flex items-baseline justify-between gap-4 hover:bg-cream/40 transition-colors">
                                    <span class="min-w-0">
                                        <span class="block font-sans text-sm font-light truncate" x-text="r.serviceName"></span>
                                        <span class="block text-xs text-muted font-sans font-light truncate" x-text="r.note || ''"></span>
                                    </span>
                                    <span class="shrink-0 text-[11px] uppercase tracking-[0.14em] font-sans text-muted" x-text="requestStatusLabel(r.status, r)"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Standing services, above the catalogue, in one place -->
                    <div class="mb-12 md:mb-16">
                        <h2 class="p-h mb-4"><span x-text="lang === 'et' ? 'Kokkulepitud' : 'Already agreed'"></span></h2>
                        <div class="bg-white border border-[#E8E3DD] divide-y divide-[#E8E3DD]">
                            <div class="px-5 py-3 flex items-center justify-between gap-4">
                                <span class="min-w-0">
                                    <span class="block font-sans text-sm" x-text="lang === 'et' ? 'Regulaarne koristus' : 'Regular cleaning'"></span>
                                    <span class="block text-xs text-muted font-sans font-light" x-text="getPackageName(order?.package) + (nextCleaning ? ' · ' + formatDateShort(nextCleaning.scheduledAt) : '')"></span>
                                </span>
                                <button type="button" @click="activeTab = 'visits'" class="text-[11px] uppercase tracking-[0.14em] font-sans text-muted hover:text-black shrink-0" x-text="lang === 'et' ? 'Ajad' : 'Times'"></button>
                            </div>
                            <div x-show="extras.flowers?.auto" x-cloak class="px-5 py-3">
                                <span class="block font-sans text-sm" x-text="lang === 'et' ? 'Värsked lilled igal visiidil' : 'Fresh flowers on every visit'"></span>
                                <span class="block text-xs text-muted font-sans font-light" x-text="extras.flowers?.floristBusiness || extras.flowers?.floristName || ''"></span>
                            </div>
                            <div x-show="handymanStanding" x-cloak class="px-5 py-3">
                                <span class="block font-sans text-sm" x-text="lang === 'et' ? 'Remondimees' : 'Handyman'"></span>
                                <span class="block text-xs text-muted font-sans font-light" x-text="handymanQuota"></span>
                            </div>
                            <button type="button" x-show="warrantyUntilLabel()" x-cloak @click="openWarrantyClaim()" class="w-full px-5 py-3 flex items-center justify-between gap-4 text-left hover:bg-cream/40">
                                <span class="min-w-0">
                                    <span class="block font-sans text-sm" x-text="(lang === 'et' ? 'Garantii kuni ' : 'Warranty until ') + warrantyUntilLabel()"></span>
                                </span>
                                <span class="text-[11px] uppercase tracking-[0.14em] font-sans text-muted shrink-0" x-text="lang === 'et' ? 'Teata' : 'Report'"></span>
                            </button>
                        </div>
                    </div>

                    <!-- 01 · By need. Each row: what you need on the left, the concrete options on the right, who answers on every card. -->
                    <div class="flex flex-wrap items-end justify-between gap-4 mb-4">
                        <h2 class="p-h"><span class="p-num">01</span><span x-text="lang === 'et' ? 'Telli või küsi' : 'Order or ask'"></span></h2>
                    </div>
                    <div class="space-y-10 md:space-y-12">
                        <template x-for="g in needGroups" :key="g.id">
                            <section>
                                <h3 class="font-serif text-2xl font-light mb-2" x-text="g.title"></h3>
                                <div class="grid sm:grid-cols-2 sm:gap-x-16">
                                    <template x-for="s in g.items" :key="s.id">
                                        <button type="button" @click="openRequest(s)" class="group w-full text-left py-3 border-b border-[#E8E3DD] flex items-baseline justify-between gap-4 hover:border-black transition-colors">
                                            <span class="font-sans text-sm font-light min-w-0" :class="isOrderable(s) ? 'text-black' : 'text-muted'" x-text="s.name"></span>
                                            <span x-show="isOrderable(s)" class="shrink-0 text-muted/40 group-hover:text-black transition-colors" aria-hidden="true">→</span>
                                            <span x-show="!isOrderable(s)" class="shrink-0 text-[11px] uppercase tracking-[0.14em] font-sans text-muted" x-text="(extras.interests || []).includes(s.id) ? (lang === 'et' ? 'Soov kirjas' : 'Noted') : (lang === 'et' ? 'Anna teada' : 'Register interest')"></span>
                                        </button>
                                    </template>
                                </div>
                            </section>
                        </template>
                    </div>


                    <!-- 03 · History: what has been done stays with the home -->
                    <div id="ajalugu" x-show="pastRequests.length" x-cloak class="mt-12 md:mt-16">
                        <h2 class="p-h mb-4"><span class="p-num">03</span><span x-text="lang === 'et' ? 'Tehtud ja vastatud' : 'Done and answered'"></span></h2>
                        <div class="border border-[#E8E3DD] bg-white divide-y divide-[#E8E3DD]">
                            <template x-for="r in pastRequests" :key="r.id">
                                <button type="button" @click="openThread(r)" class="w-full text-left px-5 py-4 grid sm:grid-cols-[auto_1fr_auto_auto] items-start gap-x-5 gap-y-1 text-sm font-sans hover:bg-cream/40 transition-colors group">
                                    <span class="mt-1.5 w-2 h-2 rounded-full shrink-0" :class="partnerDot(r.category)"></span>
                                    <span class="block min-w-0">
                                        <span class="block text-black" x-text="r.serviceName"></span>
                                        <span x-show="r.note || r.providerMessage" class="block text-muted font-light text-xs mt-0.5 leading-relaxed line-clamp-2" x-text="r.providerMessage || r.note"></span>
                                    </span>
                                    <span class="block text-muted font-light" x-text="formatDateLong(r.scheduledAt || r.answeredAt || r.completedAt || r.createdAt)"></span>
                                    <span class="text-[11px] uppercase tracking-[0.15em] sm:text-right flex items-center sm:justify-end gap-2" :class="r.status === 'cancelled' ? 'text-muted/70' : 'text-muted group-hover:text-black'"><svg x-show="r.status === 'completed' || r.status === 'answered'" class="w-3 h-3 text-accent shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg><span x-text="requestStatusLabel(r.status, r)"></span></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

            </main>

            <!-- Request form: three shapes — a visit (needs a time), an issue (describe first, time optional), a question (answered in writing) -->
            <div x-show="requestService || addonChooser" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-4 bg-black/40" role="dialog" aria-modal="true" aria-labelledby="request-modal-title" @click.self="closeRequest()" @keydown.escape.window="if (!viewRequest && !proposeBooking && !rescheduleBookingId) closeRequest()">
                <div class="bg-paper w-full sm:max-w-lg max-h-[92vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">

                    <!-- Success -->
                    <div x-show="requestDone" x-cloak class="text-center py-6">
                        <div class="w-16 h-16 bg-accent rounded-full flex items-center justify-center mx-auto mb-6 animate-checkmark">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="font-serif text-2xl font-light mb-3" x-text="requestDone?.interest ? (lang === 'et' ? 'Aitäh, panime kirja' : 'Thank you, noted') : requestKind === 'question' ? (lang === 'et' ? 'Küsimus saadetud' : 'Question sent') : requestKind === 'issue' ? (lang === 'et' ? 'Pöördumine saadetud' : 'Report sent') : (lang === 'et' ? 'Soov saadetud' : 'Request sent')"></h3>
                        <p class="text-sm text-muted font-sans font-light leading-relaxed max-w-sm mx-auto mb-2">
                            <span x-text="requestService?.name"></span>
                            <span x-show="requestDate && requestKind !== 'question'" x-text="' · ' + formatDateShort(requestDate)"></span>
                        </p>
                        <p class="text-sm text-muted font-sans font-light leading-relaxed max-w-sm mx-auto" x-text="requestDone?.interest
                            ? (lang === 'et' ? 'Selles valdkonnas pole sinu kodul veel partnerit. Kui leiame sobiva, anname sulle isiklikult teada — midagi pole veel tellitud.' : 'Your home has no partner for this yet. When we find the right one, we will tell you personally — nothing has been ordered.')
                            : requestKind === 'question'
                                ? ((requestDone?.providerName || '') + (lang === 'et' ? ' vastab kirjalikult, tavaliselt sama tööpäeva jooksul. Vastus tuleb e-postiga ja jääb siia kirja.' : ' will answer in writing, usually the same working day. The answer arrives by e-mail and stays on record here.'))
                                : requestKind === 'issue'
                                    ? ((requestDone?.providerName || '') + (lang === 'et' ? ' vaatab pöördumise üle ja kinnitab ülevaatuse aja — tavaliselt 2 tööpäeva jooksul. Saatsime sulle ka kinnituskirja.' : ' will review the report and confirm an inspection time — usually within 2 working days. We also emailed you a confirmation.'))
                                    : ((requestDone?.providerName || (lang === 'et' ? 'Tegija' : 'The provider')) + (lang === 'et' ? ' kinnitab aja tavaliselt sama päeva jooksul. Saatsime sulle ka kinnituskirja.' : ' usually confirms a time the same day. We also emailed you a confirmation.'))"></p>
                        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
                            <button type="button" x-show="requestDone?.request?.id" @click="const id = requestDone.request.id; closeRequest(); openThread((extras.requests || []).find((x) => x.id === id))" class="p-btn" x-text="lang === 'et' ? 'Ava pöördumine' : 'Open the request'"></button>
                            <button type="button" @click="closeRequest()" :class="requestDone?.request?.id ? 'p-btn-2' : 'p-btn'" x-text="lang === 'et' ? 'Selge' : 'Done'"></button>
                        </div>
                    </div>

                    <!-- Form -->
                    <div x-show="addonChooser && !requestService && !requestDone">
                        <div class="flex justify-between items-start mb-6">
                            <div class="min-w-0">
                                <p class="text-[10px] uppercase tracking-[0.16em] text-muted font-sans mb-2" x-text="lang === 'et' ? 'Järgmise koristusega' : 'With the next clean'"></p>
                                <h3 class="font-serif text-2xl font-light leading-tight" x-text="lang === 'et' ? 'Lisa koristusvisiidile' : 'Add to the cleaning visit'"></h3>
                            </div>
                            <button type="button" @click="closeRequest()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors shrink-0 -mr-2 -mt-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <p class="text-sm text-muted font-sans font-light mb-6 leading-relaxed" x-text="(nextCleaning ? formatDateShort(nextCleaning.scheduledAt) + ' · ' + formatTime(nextCleaning.scheduledAt) + '. ' : '') + (lang === 'et' ? 'Vali üks. Midagi ei ole veel valitud ja arvet ei tule enne, kui töö on kinnitatud.' : 'Choose one. Nothing is selected yet, and nothing is invoiced before the work is confirmed.')"></p>
                        <div class="border border-[#E8E3DD] divide-y divide-[#E8E3DD]">
                            <template x-for="s in visitAddons" :key="'pick-' + s.id">
                                <button type="button" @click="openWithVisit(s)" class="w-full text-left px-4 py-3.5 hover:bg-cream/40 transition-colors">
                                    <span class="block font-sans text-sm" x-text="s.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div x-show="requestService && !requestDone">
                        <div class="flex justify-between items-start mb-6">
                            <div class="min-w-0">
                                <p class="flex items-center gap-2 text-[10px] uppercase tracking-[0.16em] text-muted font-sans mb-2">
                                    <span class="w-2 h-2 rounded-full shrink-0" :class="partnerDot(requestService?.category)"></span>
                                    <span x-text="requestKind === 'question' ? (lang === 'et' ? 'Küsimus' : 'Question') : requestKind === 'issue' ? (lang === 'et' ? 'Pöördumine' : 'Report') : (lang === 'et' ? 'Soov' : 'Request')"></span>
                                    <span x-show="partnerNameFor(requestService)" class="text-muted/70" x-text="'· ' + shortName(partnerNameFor(requestService))"></span>
                                </p>
                                <h3 id="request-modal-title" class="font-serif text-2xl font-light leading-tight" x-text="requestService?.name"></h3>
                            </div>
                            <button type="button" @click="closeRequest()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors shrink-0 -mr-2 -mt-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <p class="text-sm text-muted font-sans font-light mb-7 leading-relaxed" x-text="requestService?.description"></p>
                        <div x-show="requestService?.id !== 'other' && requestService?.id !== 'cleaning-note' && (requestPriceLine || requestPriceBlurb)" class="mb-7 bg-cream/40 border border-[#E8E3DD] p-4">
                            <p class="text-[10px] uppercase tracking-[0.16em] text-muted font-sans" x-text="lang === 'et' ? 'Hind' : 'Price'"></p>
                            <p x-show="requestPriceLine" class="font-sans text-sm mt-1.5" x-text="requestPriceLine"></p>
                            <p class="text-xs text-muted font-sans font-light mt-2 leading-relaxed" x-text="requestPriceBlurb"></p>
                        </div>

                        <form @submit.prevent="submitRequest()" class="space-y-6">
                            <p x-show="!isOrderable(requestService)" x-cloak class="bg-cream/60 border border-[#E8E3DD] p-4 text-sm text-muted font-sans font-light leading-relaxed" x-text="lang === 'et' ? 'Seda ei saa veel siit tellida — sinu kodul pole selles valdkonnas tegijat. Anna teada, et soovid seda, ja me otsime. Midagi ei tellita ega maksta.' : 'This cannot be ordered here yet — your home has no provider for it. Tell us you would like it and we will look. Nothing is ordered or charged.'"></p>

                            <!-- The words come first for an issue, a question — and for 'something else', where the note is the request -->
                            <div x-show="requestNeedsNote">
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-2" x-text="requestService?.id === 'other' ? (lang === 'et' ? 'Mis sa vajad?' : 'What do you need?') : requestService?.id === 'cleaning-note' ? (lang === 'et' ? 'Sinu sõnum' : 'Your message') : requestKind === 'question' ? (lang === 'et' ? 'Sinu küsimus' : 'Your question') : (lang === 'et' ? 'Mis ja kus?' : 'What and where?')"></label>
                                <textarea x-model="requestNote" rows="4" maxlength="500" :placeholder="requestPlaceholder" class="w-full bg-white border border-[#E8E3DD] focus:border-accent outline-none p-4 font-sans font-light text-sm transition-colors placeholder:text-[#B8B2AA] resize-none"></textarea>
                            </div>

                            <!-- Issue: how urgent, and who to call if it cannot wait -->
                            <div x-show="requestKind === 'issue' && isOrderable(requestService)">
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-3" x-text="lang === 'et' ? 'Kui kiire?' : 'How urgent?'"></label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button type="button" @click="requestUrgent = false" :class="!requestUrgent ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="lang === 'et' ? 'Tavaline — ülevaatus sobival ajal' : 'Normal — inspection when it suits'"></button>
                                    <button type="button" @click="requestUrgent = true" :class="requestUrgent ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="lang === 'et' ? 'Kiire — segab igapäevaelu' : 'Urgent — disrupts daily life'"></button>
                                </div>
                                <!-- The 24h emergency line is the developer's own number; shown only when the brand has set one -->
                                <p x-show="brand?.emergencyPhone" x-cloak class="text-xs text-muted font-sans font-light mt-3">
                                    <span x-text="lang === 'et' ? 'Avarii 24h ' : 'Emergency 24h '"></span>
                                    <a :href="'tel:' + String(brand?.emergencyPhone || '').replace(/\s+/g, '')" class="text-black hover:text-accent transition-colors whitespace-nowrap" x-text="brand?.emergencyPhone"></a>
                                </p>
                            </div>

                            <!-- Time: required for a visit, optional for an issue, absent for a question -->
                            <div x-show="requestKind !== 'question' && isOrderable(requestService)">
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-2" x-text="requestKind === 'issue' ? (lang === 'et' ? 'Millal sobib ülevaatus?' : 'When suits an inspection?') : (lang === 'et' ? 'Millal sobib?' : 'When suits you?')"></label>
                                <div x-show="requestKind === 'issue'" class="grid grid-cols-2 gap-2">
                                    <button type="button" @click="requestDate = ''" :class="!requestDate ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="lang === 'et' ? 'Esimesel võimalusel' : 'Earliest available'"></button>
                                    <button type="button" @click="if (!requestDate) requestDate = minRequestDate" :class="requestDate ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="lang === 'et' ? 'Valin päeva' : 'I will pick a day'"></button>
                                </div>
                                <input x-show="requestKind !== 'issue' || requestDate" type="date" x-model="requestDate" :min="minRequestDate" class="w-full bg-white border border-[#E8E3DD] focus:border-accent outline-none px-4 py-3 font-sans font-light text-sm" :class="requestKind === 'issue' ? 'mt-2' : ''">
                                <p x-show="requestKind !== 'issue'" class="text-xs text-muted/70 font-sans font-light mt-1.5" x-text="lang === 'et' ? 'Jäta tühjaks, kui sobib esimesel võimalusel.' : 'Leave empty for the earliest available.'"></p>
                            </div>
                            <div x-show="requestKind !== 'question' && isOrderable(requestService)">
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-3" x-text="lang === 'et' ? 'Kellaaeg' : 'Time of day'"></label>
                                <div class="grid grid-cols-2 gap-2">
                                    <template x-for="w in timeWindowsFor(requestService)" :key="w.id">
                                        <button type="button" @click="requestWindow = w.id" :class="requestWindow === w.id ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="w.label"></button>
                                    </template>
                                </div>
                            </div>

                            <!-- Details for a visit (optional) -->
                            <div x-show="!requestNeedsNote">
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-2" x-text="lang === 'et' ? 'Täpsustus' : 'Details'"></label>
                                <textarea x-model="requestNote" rows="3" maxlength="500" :placeholder="requestPlaceholder" class="w-full bg-white border border-[#E8E3DD] focus:border-accent outline-none p-4 font-sans font-light text-sm transition-colors placeholder:text-[#B8B2AA] resize-none"></textarea>
                            </div>

                            <!-- How they get in this time — standing profile, I will be home, or a one-time note -->
                            <div x-show="requestKind !== 'question' && isOrderable(requestService)">
                                <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-3" x-text="lang === 'et' ? 'Kuidas sel korral sisse saab?' : 'How do they get in this time?'"></label>
                                <div class="grid gap-2">
                                    <button type="button" x-show="homeProfile.access" @click="requestAccess = 'profile'" :class="requestAccess === 'profile' ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-4 border text-left text-xs font-sans transition-colors">
                                        <span class="block" x-text="lang === 'et' ? 'Koduhooldaja juhis' : 'The housekeeper’s note'"></span>
                                        <span class="block mt-1 opacity-70 font-light leading-relaxed" x-text="homeProfile.access"></span>
                                    </button>
                                    <button type="button" @click="requestAccess = 'home'" :class="requestAccess === 'home' ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-4 border text-left text-xs font-sans transition-colors" x-text="lang === 'et' ? 'Olen sel ajal kodus' : 'I will be home'"></button>
                                    <button type="button" @click="requestAccess = 'note'" :class="requestAccess === 'note' ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] hover:border-accent bg-white'" class="py-3 px-4 border text-left text-xs font-sans transition-colors" x-text="lang === 'et' ? 'Annan selleks korraks teise juhise' : 'A different note for this visit'"></button>
                                </div>
                                <textarea x-show="requestAccess === 'note'" x-model="requestAccessNote" rows="2" maxlength="400" :placeholder="lang === 'et' ? 'Nt: uksekood 8821# kuni reedeni. Võtit ei jäta.' : 'E.g.: door code 8821# until Friday. No key left.'" class="w-full mt-2 bg-white border border-[#E8E3DD] focus:border-accent outline-none p-3 font-sans font-light text-sm transition-colors placeholder:text-[#B8B2AA] resize-none"></textarea>
                                <p class="text-xs text-muted font-sans font-light mt-2 leading-relaxed" x-text="requestService?.category === 'cleaning' || requestService?.id === 'flowers' ? (lang === 'et' ? 'See juhis on koduhooldajale. Kui oled ise kodus või kood on teine, vali allolev.' : 'This note is for the housekeeper. If you will be home, or the code is different, choose below.') : (lang === 'et' ? 'Koduhooldaja võti ei lähe automaatselt kaasa. Ütle, kas oled ise kohal või anna sellele visiidile oma juhis.' : 'The housekeeper’s key is not sent along automatically. Say if you will be there, or give a note for this visit.')"></p>
                            </div>

                            <p x-show="requestError" x-cloak class="text-sm text-red-500 font-sans font-light" x-text="requestError"></p>
                            <div class="flex items-center justify-between gap-4 pt-2">
                                <p class="text-xs text-muted font-sans font-light leading-relaxed" x-text="!isOrderable(requestService) ? (lang === 'et' ? 'Ainult huvi — ei kohusta millekski.' : 'Interest only — no commitment.') : requestService?.id === 'cleaning-note' ? (lang === 'et' ? 'Koduhooldaja vastab siia ja e-postiga.' : 'The housekeeper replies here and by e-mail.') : requestKind === 'question' ? (lang === 'et' ? 'Vastus tuleb kirjalikult ja jääb kodu juurde kirja.' : 'The answer comes in writing and stays on record.') : requestKind === 'issue' ? (lang === 'et' ? 'Garantii korras — tasuta. Saad kohe kinnituskirja.' : 'Under warranty — free. You get an instant confirmation.') : (lang === 'et' ? 'Saad kohe kinnituskirja. Lõplik aeg ja hind kinnitatakse vastuses.' : 'You get an instant confirmation. Final time and price are confirmed in the reply.')"></p>
                                <button type="submit" :disabled="requestProcessing || (isOrderable(requestService) && requestNoteTooShort)" class="p-btn shrink-0 disabled:opacity-50">
                                    <span x-show="!requestProcessing" x-text="!isOrderable(requestService) ? (lang === 'et' ? 'Soovin seda' : 'I would like this') : (lang === 'et' ? 'Saada ' : 'Send ') + requestNoun.toLowerCase()"></span>
                                    <span x-show="requestProcessing" x-cloak>
                                        <svg class="w-4 h-4 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                    </span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Request thread: the whole conversation, past or current. E-mail only notifies. -->
            <div x-show="viewRequest" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-4 bg-black/40" role="dialog" aria-modal="true" aria-labelledby="thread-modal-title" @click.self="closeThread()" @keydown.escape.window="if (!proposeBooking && !rescheduleBookingId) closeThread()">
                <div class="bg-paper w-full sm:max-w-lg max-h-[92vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">
                    <div class="flex justify-between items-start mb-6">
                        <div class="min-w-0">
                            <p class="flex items-center gap-2 text-[10px] uppercase tracking-[0.16em] text-muted font-sans mb-2">
                                <span class="w-2 h-2 rounded-full shrink-0" :class="partnerDot(viewRequest?.category)"></span>
                                <span :class="viewRequest ? requestStatusColor(viewRequest.status).split(' ')[0] : ''" x-text="viewRequest ? requestStatusLabel(viewRequest.status, viewRequest) : ''"></span>
                                <span x-show="viewRequest?.providerName" class="text-muted/70 truncate" x-text="'· ' + shortName(viewRequest?.providerName)"></span>
                            </p>
                            <h3 id="thread-modal-title" class="font-serif text-2xl font-light leading-tight" x-text="viewRequest?.serviceName"></h3>
                        </div>
                        <button type="button" @click="closeThread()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors shrink-0 -mr-2 -mt-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    <dl class="grid grid-cols-2 gap-x-6 gap-y-3 pb-5 mb-5 border-b border-[#E8E3DD] text-sm font-sans">
                        <div>
                            <dt class="text-[10px] uppercase tracking-[0.16em] text-muted mb-1" x-text="lang === 'et' ? 'Saadetud' : 'Sent'"></dt>
                            <dd class="font-light" x-text="formatMsgTime(viewRequest?.createdAt)"></dd>
                        </div>
                        <div x-show="viewRequest?.scheduledAt">
                            <dt class="text-[10px] uppercase tracking-[0.16em] text-muted mb-1" x-text="lang === 'et' ? 'Kinnitatud aeg' : 'Confirmed time'"></dt>
                            <dd class="font-light" x-text="formatMsgTime(viewRequest?.scheduledAt)"></dd>
                            <!-- A confirmed request is a visit now: change its time where visits are changed -->
                            <button type="button" x-show="viewRequest?.status === 'confirmed' && bookingForRequest(viewRequest)" x-cloak @click="changeTime(bookingForRequest(viewRequest))" class="mt-1 text-[11px] uppercase tracking-[0.15em] font-sans text-accent hover:text-black transition-colors" x-text="lang === 'et' ? 'Muuda aega' : 'Change time'"></button>
                        </div>
                        <div x-show="viewRequest?.price">
                            <dt class="text-[10px] uppercase tracking-[0.16em] text-muted mb-1" x-text="lang === 'et' ? 'Hind' : 'Price'"></dt>
                            <dd class="font-light" x-text="viewRequest?.price"></dd>
                        </div>
                        <div x-show="viewRequest?.access" class="col-span-2">
                            <dt class="text-[10px] uppercase tracking-[0.16em] text-muted mb-1" x-text="lang === 'et' ? 'Sissepääs sellel korral' : 'Access this time'"></dt>
                            <dd class="font-light leading-relaxed" x-text="viewRequest?.access"></dd>
                        </div>
                    </dl>
                    <div class="space-y-4">
                        <template x-for="m in threadMessages" :key="m.id">
                            <div>
                                <p class="text-[10px] uppercase tracking-[0.14em] font-sans text-muted mb-1">
                                    <span x-text="m.by === 'client' ? (m.name || (lang === 'et' ? 'Sina' : 'You')) : (m.name || viewRequest?.providerName || '')"></span>
                                    <span x-show="m.at" x-text="' · ' + formatMsgTime(m.at)"></span>
                                </p>
                                <p class="text-sm font-sans font-light leading-relaxed whitespace-pre-line" :class="m.by === 'provider' ? 'bg-cream/50 border border-[#E8E3DD] p-3' : ''" x-text="m.text"></p>
                            </div>
                        </template>
                    </div>
                    <form x-show="canReplyTo(viewRequest)" class="mt-6 pt-5 border-t border-[#E8E3DD]" @submit.prevent="sendThread()">
                        <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-2" x-text="lang === 'et' ? 'Lisa sõnum' : 'Add a message'"></label>
                        <textarea x-model="threadText" rows="3" maxlength="1500" :placeholder="lang === 'et' ? 'Täpsustus, küsimus, uus info…' : 'A clarification, a question, new info…'" class="w-full bg-white border border-[#E8E3DD] focus:border-accent outline-none p-4 font-sans font-light text-sm transition-colors placeholder:text-[#B8B2AA] resize-none"></textarea>
                        <p x-show="threadError" class="text-sm text-red-500 font-sans font-light mt-2" x-text="threadError"></p>
                        <div class="flex items-center justify-between gap-4 mt-3">
                            <button type="button" x-show="viewRequest?.status === 'requested'" @click="cancelRequest(viewRequest).then((ok) => { if (ok) closeThread(); })" class="text-[11px] uppercase tracking-[0.15em] font-sans text-muted hover:text-black transition-colors" x-text="lang === 'et' ? 'Võta tagasi' : 'Withdraw'"></button>
                            <button type="submit" :disabled="!threadText.trim() || threadSending" class="p-btn ml-auto disabled:opacity-50">
