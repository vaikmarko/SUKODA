                                    <div class="p-6">
                                        <p class="text-sm text-muted font-sans font-light mb-4" x-text="t('pauseLead')"></p>
                                        <input type="text"
                                               x-model="pauseReason"
                                               :placeholder="t('pauseReasonPh')"
                                               :aria-label="t('pauseReasonPh')"
                                               class="w-full bg-transparent border-b border-line focus:border-accent outline-none py-2 font-sans font-light text-base transition-colors placeholder:text-line-strong mb-5">
                                        <button type="button" @click="pauseSubscription()"
                                                :disabled="pauseProcessing"
                                                class="p-btn-2 disabled:opacity-50">
                                            <span x-show="!pauseProcessing" x-text="t('pauseBtn')"></span>
                                            <span x-show="pauseProcessing" x-cloak x-text="t('docSaving')"></span>
                                        </button>
                                        <p x-show="pauseError" x-cloak class="text-sm text-red-500 font-sans font-light mt-3" x-text="pauseError"></p>
                                    </div>
                                </div>

                                <!-- Paused state: show resume option -->
                                <div x-show="order?.pausedAt" x-cloak class="border border-line p-6">
                                    <h2 class="p-h" x-text="t('pausedTitle')"></h2>
                                    <p class="text-sm text-muted font-sans font-light mt-4" x-text="t('pausedSince', { date: formatDateLong(order?.pausedAt) })"></p>
                                    <p class="text-sm text-muted font-sans font-light mt-2 mb-6" x-text="t('pausedBody')"></p>
                                    <button type="button" @click="resumeSubscription()"
                                            :disabled="resumeProcessing"
                                            class="p-btn disabled:opacity-50">
                                        <span x-show="!resumeProcessing" x-text="t('resumeBtn')"></span>
                                        <span x-show="resumeProcessing" x-cloak x-text="t('docSaving')"></span>
                                    </button>
                                    <p x-show="pauseError" x-cloak class="text-sm text-red-500 font-sans font-light mt-3" x-text="pauseError"></p>
                                </div>
                            </div>
                        </aside>
                    </div>
                </div>

                <div id="minu-telli"></div>

            </main>

            <!-- Request form: three shapes — a visit (needs a time), an issue (describe first, time optional), a question (answered in writing) -->
            <div x-show="requestService || addonChooser" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-4 bg-black/40" role="dialog" aria-modal="true" aria-labelledby="request-modal-title" @click.self="closeRequest()" @keydown.escape.window="if (!viewRequest && !proposeBooking && !rescheduleBookingId) closeRequest()">
                <div class="bg-paper w-full sm:max-w-lg max-h-[92vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">

                    <!-- Success -->
                    <div x-show="requestDone" x-cloak class="text-center py-6">
                        <div class="w-16 h-16 bg-accent rounded-full flex items-center justify-center mx-auto mb-6 animate-checkmark">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="font-serif text-2xl font-light mb-3" x-text="t(requestDone?.interest ? 'doneNoted' : requestKind === 'question' ? 'doneQuestion' : requestKind === 'issue' ? 'doneIssue' : 'doneRequest')"></h3>
                        <p class="text-sm text-muted font-sans font-light leading-relaxed max-w-sm mx-auto mb-2">
                            <span x-text="requestService?.name"></span>
                            <span x-show="requestDate && requestKind !== 'question'" x-text="' · ' + formatDateShort(requestDate)"></span>
                        </p>
                        <p class="text-sm text-muted font-sans font-light leading-relaxed max-w-sm mx-auto" x-text="requestDoneBody"></p>
                        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
                            <button type="button" x-show="requestDone?.request?.id" @click="const id = requestDone.request.id; closeRequest(); openThread((extras.requests || []).find((x) => x.id === id))" class="p-btn" x-text="t('openIt')"></button>
                            <button type="button" @click="closeRequest()" :class="requestDone?.request?.id ? 'p-btn-2' : 'p-btn'" x-text="t('gotIt')"></button>
                        </div>
                    </div>

                    <!-- Form -->
                    <div x-show="addonChooser && !requestService && !requestDone">
                        <div class="flex justify-between items-start mb-6">
                            <div class="min-w-0">
                                <p class="text-[10px] uppercase tracking-[0.16em] text-muted font-sans mb-2" x-text="lang === 'et' ? 'Järgmise koristusega' : 'With the next clean'"></p>
                                <h3 class="font-serif text-2xl font-light leading-tight" x-text="lang === 'et' ? 'Lisa koristusvisiidile' : 'Add to the cleaning visit'"></h3>
                            </div>
                            <button type="button" @click="closeRequest()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors shrink-0 -mr-2 -mt-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <p class="text-sm text-muted font-sans font-light mb-6 leading-relaxed" x-text="(nextCleaning ? formatDateShort(nextCleaning.scheduledAt) + ' · ' + formatTime(nextCleaning.scheduledAt) + '. ' : '') + (lang === 'et' ? 'Vali üks. Midagi ei ole veel valitud ja arvet ei tule enne, kui töö on kinnitatud.' : 'Choose one. Nothing is selected yet, and nothing is invoiced before the work is confirmed.')"></p>
                        <div class="border border-[#E8E3DD] divide-y divide-[#E8E3DD]">
                            <template x-for="s in visitAddons" :key="'pick-' + s.id">
                                <button type="button" @click="openWithVisit(s)" class="w-full text-left px-4 py-3.5 hover:bg-cream/40 transition-colors">
                                    <span class="block font-sans text-sm" x-text="s.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div x-show="requestService && !requestDone">
                        <div class="flex justify-between items-start mb-6">
                            <div class="min-w-0">
                                <p class="flex items-center gap-2 eyebrow mb-2">
                                    <span class="w-2 h-2 rounded-full shrink-0" :class="partnerDot(requestService?.category)"></span>
                                    <span x-text="requestNoun"></span>
                                    <span x-show="showProvider && partnerNameFor(requestService)" class="text-muted/70" x-text="'· ' + shortName(partnerNameFor(requestService))"></span>
                                </p>
                                <h3 id="request-modal-title" class="font-serif text-2xl font-light leading-tight" x-text="requestService?.name"></h3>
                            </div>
                            <button type="button" @click="closeRequest()" :aria-label="t('docClose')" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors shrink-0 -mr-2 -mt-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <p class="text-sm text-muted font-sans font-light mb-7 leading-relaxed" x-text="requestService?.description"></p>
                        <div x-show="requestService?.id !== 'other' && requestService?.id !== 'cleaning-note' && (requestPriceLine || requestPriceBlurb)" class="mb-7 bg-cream/40 border border-line p-4">
                            <p class="eyebrow" x-text="t('priceLabel')"></p>
                            <p x-show="requestPriceLine" class="font-sans text-sm mt-1.5" x-text="requestPriceLine"></p>
                            <p x-show="quoteLine" class="font-sans text-sm mt-2" x-text="quoteLine"></p>
                            <p class="text-sm text-muted font-sans font-light mt-2 leading-relaxed" x-text="requestPriceBlurb"></p>
                        </div>

                        <form @submit.prevent="submitRequest()" class="space-y-6">
                            <p x-show="!isOrderable(requestService)" x-cloak class="bg-cream/60 border border-line p-4 text-sm text-muted font-sans font-light leading-relaxed" x-text="t('notOrderable')"></p>

                            <!-- The words come first for an issue, a question — and for 'something else', where the note is the request -->
                            <div x-show="requestNeedsNote">
                                <label class="eyebrow mb-2" for="request-note" x-text="t(requestService?.id === 'other' ? 'noteWhatNeed' : requestService?.id === 'cleaning-note' ? 'noteMessage' : requestKind === 'question' ? 'noteQuestion' : 'noteIssue')"></label>
                                <textarea id="request-note" x-model="requestNote" rows="4" maxlength="500" :placeholder="requestPlaceholder" class="w-full bg-white border border-line focus:border-accent outline-none p-4 font-sans font-light text-base transition-colors placeholder:text-muted-light resize-none"></textarea>
                            </div>

                            <!-- Issue: how urgent, and who to call if it cannot wait -->
                            <div x-show="requestKind === 'issue' && isOrderable(requestService)">
                                <p class="eyebrow mb-3" x-text="t('urgencyLabel')"></p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button type="button" @click="requestUrgent = false" :aria-pressed="!requestUrgent" :class="!requestUrgent ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="t('urgencyNormal')"></button>
                                    <button type="button" @click="requestUrgent = true" :aria-pressed="requestUrgent" :class="requestUrgent ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="t('urgencyUrgent')"></button>
                                </div>
                                <!-- The 24h emergency line is the developer's own number; shown only when the brand has set one -->
                                <p x-show="brand?.emergencyPhone" x-cloak class="text-xs text-muted font-sans font-light mt-3">
                                    <span x-text="t('emergency') + ' '"></span>
                                    <a :href="'tel:' + String(brand?.emergencyPhone || '').replace(/\s+/g, '')" class="text-black hover:text-accent transition-colors whitespace-nowrap" x-text="brand?.emergencyPhone"></a>
                                </p>
                            </div>

                            <!-- Time: required for a visit, optional for an issue, absent for a question -->
                            <div x-show="requestKind !== 'question' && isOrderable(requestService)">
                                <label class="eyebrow mb-2" for="request-date" x-text="t(requestKind === 'issue' ? 'whenInspection' : 'whenSuits')"></label>
                                <div x-show="requestKind === 'issue'" class="grid grid-cols-2 gap-2">
                                    <button type="button" @click="requestDate = ''" :aria-pressed="!requestDate" :class="!requestDate ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="t('earliest')"></button>
                                    <button type="button" @click="if (!requestDate) requestDate = minRequestDate" :aria-pressed="!!requestDate" :class="requestDate ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="t('pickDay')"></button>
                                </div>
                                <input id="request-date" x-show="requestKind !== 'issue' || requestDate" type="date" x-model="requestDate" :min="requestDateMin" class="w-full bg-white border border-line focus:border-accent outline-none px-4 py-3 font-sans font-light text-sm" :class="requestKind === 'issue' ? 'mt-2' : ''">
                                <p x-show="requestKind === 'visit' && requestService?.category === 'cleaning'" class="text-xs text-muted font-sans font-light mt-1.5" x-text="t('visitLead', { date: formatDateLong(requestDateMin) })"></p>
                            </div>
                            <div x-show="requestKind !== 'question' && isOrderable(requestService)">
                                <p class="eyebrow mb-3" x-text="t('orderTime')"></p>
                                <div class="grid grid-cols-2 gap-2">
                                    <template x-for="w in timeWindowsFor(requestService)" :key="w.id">
                                        <button type="button" @click="requestWindow = w.id" :aria-pressed="requestWindow === w.id" :class="requestWindow === w.id ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-3 border text-center text-xs font-sans transition-colors" x-text="w.label"></button>
                                    </template>
                                </div>
                            </div>

                            <!-- Details for a visit (optional) -->
                            <div x-show="!requestNeedsNote">
                                <label class="eyebrow mb-2" for="request-details" x-text="t('detailsLabel')"></label>
                                <textarea id="request-details" x-model="requestNote" rows="3" maxlength="500" :placeholder="requestPlaceholder" class="w-full bg-white border border-line focus:border-accent outline-none p-4 font-sans font-light text-base transition-colors placeholder:text-muted-light resize-none"></textarea>
                            </div>

                            <!-- How they get in this time — standing profile, I will be home, or a one-time note -->
                            <div x-show="requestKind !== 'question' && isOrderable(requestService)">
                                <p class="eyebrow mb-3" x-text="t('accessLabel')"></p>
                                <div class="grid gap-2">
                                    <button type="button" x-show="homeProfile.access" @click="requestAccess = 'profile'" :aria-pressed="requestAccess === 'profile'" :class="requestAccess === 'profile' ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-4 border text-left text-xs font-sans transition-colors">
                                        <span class="block" x-text="t('accessProfile')"></span>
                                        <span class="block mt-1 opacity-70 font-light leading-relaxed" x-text="homeProfile.access"></span>
                                    </button>
                                    <button type="button" @click="requestAccess = 'home'" :aria-pressed="requestAccess === 'home'" :class="requestAccess === 'home' ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-4 border text-left text-xs font-sans transition-colors" x-text="t('accessHome')"></button>
                                    <button type="button" @click="requestAccess = 'note'" :aria-pressed="requestAccess === 'note'" :class="requestAccess === 'note' ? 'bg-black text-paper border-black' : 'border-line hover:border-accent bg-white'" class="py-3 px-4 border text-left text-xs font-sans transition-colors" x-text="t('accessOther')"></button>
                                </div>
                                <textarea x-show="requestAccess === 'note'" x-model="requestAccessNote" rows="2" maxlength="400" :placeholder="t('accessPh')" :aria-label="t('accessOther')" class="w-full mt-2 bg-white border border-line focus:border-accent outline-none p-3 font-sans font-light text-base transition-colors placeholder:text-muted-light resize-none"></textarea>
                                <p x-show="!(requestService?.category === 'cleaning' || requestService?.id === 'flowers')" class="text-xs text-muted font-sans font-light mt-2 leading-relaxed" x-text="t('accessKeyNote')"></p>
                            </div>

                            <p x-show="requestError" x-cloak class="text-sm text-red-500 font-sans font-light" x-text="requestError"></p>
                            <div class="flex items-center justify-between gap-4 pt-2">
                                <p class="text-xs text-muted font-sans font-light leading-relaxed" x-text="t(!isOrderable(requestService) ? 'footInterest' : requestService?.id === 'cleaning-note' ? 'footCleaner' : requestKind === 'question' ? 'footQuestion' : requestKind === 'issue' ? 'footIssue' : 'footVisit')"></p>
                                <button type="submit" :disabled="requestProcessing || (isOrderable(requestService) && requestNoteTooShort) || (requestKind === 'visit' && isOrderable(requestService) && !requestDate)" class="p-btn shrink-0 disabled:opacity-50">
                                    <span x-show="!requestProcessing" x-text="!isOrderable(requestService) ? t('wantThis') : requestKind === 'issue' ? t('reportProblem') : t('sendNoun', { noun: requestNoun.toLowerCase() })"></span>
                                    <span x-show="requestProcessing" x-cloak x-text="t('telliSending')"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Request thread: the whole conversation, past or current. E-mail only notifies. -->
            <div x-show="viewRequest" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-4 bg-black/40" role="dialog" aria-modal="true" aria-labelledby="thread-modal-title" @click.self="closeThread()" @keydown.escape.window="if (!proposeBooking && !rescheduleBookingId) closeThread()">
                <div class="bg-paper w-full sm:max-w-lg max-h-[92vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">
                    <div class="flex justify-between items-start mb-6">
                        <div class="min-w-0">
                            <p class="flex items-center gap-2 eyebrow mb-2">
                                <span class="w-2 h-2 rounded-full shrink-0" :class="partnerDot(viewRequest?.category)"></span>
                                <span :class="viewRequest ? requestStatusColor(viewRequest.status).split(' ')[0] : ''" x-text="viewRequest ? requestStatusLabel(viewRequest.status, viewRequest) : ''"></span>
                                <span x-show="showProvider && viewRequest?.providerName" class="text-muted/70 truncate" x-text="'· ' + shortName(viewRequest?.providerName)"></span>
                            </p>
                            <h3 id="thread-modal-title" class="font-serif text-2xl font-light leading-tight" x-text="viewRequest?.serviceName"></h3>
                        </div>
                        <button type="button" @click="closeThread()" :aria-label="t('docClose')" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors shrink-0 -mr-2 -mt-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    <dl class="grid grid-cols-2 gap-x-6 gap-y-3 pb-5 mb-5 border-b border-line text-sm font-sans">
                        <div>
                            <dt class="eyebrow mb-1" x-text="t('sentLabel')"></dt>
                            <dd class="font-light" x-text="formatMsgTime(viewRequest?.createdAt)"></dd>
                        </div>
                        <div x-show="viewRequest?.scheduledAt">
                            <dt class="eyebrow mb-1" x-text="t('confirmedTime')"></dt>
                            <dd class="font-light" x-text="formatMsgTime(viewRequest?.scheduledAt)"></dd>
                            <!-- A confirmed request is a visit now: change its time where visits are changed -->
                            <button type="button" x-show="viewRequest?.status === 'confirmed' && bookingForRequest(viewRequest)" x-cloak @click="changeTime(bookingForRequest(viewRequest))" class="mt-1 text-sm font-sans underline underline-offset-4 hover:text-accent transition-colors" x-text="t('reschedule')"></button>
                        </div>
                        <div x-show="viewRequest?.price">
                            <dt class="eyebrow mb-1" x-text="t('priceLabel')"></dt>
                            <dd class="font-light" x-text="viewRequest?.price"></dd>
                        </div>
                        <div x-show="viewRequest?.access" class="col-span-2">
                            <dt class="eyebrow mb-1" x-text="t('accessThisTime')"></dt>
                            <dd class="font-light leading-relaxed" x-text="viewRequest?.access"></dd>
                        </div>
                    </dl>
                    <div class="space-y-4">
                        <template x-for="m in threadMessages" :key="m.id">
                            <div>
                                <p class="eyebrow mb-1">
                                    <span x-text="m.by === 'client' ? (m.name || t('youShort')) : (showProvider ? (m.name || viewRequest?.providerName || '') : 'SUKODA')"></span>
                                    <span x-show="m.at" x-text="' · ' + formatMsgTime(m.at)"></span>
                                </p>
                                <p class="text-sm font-sans font-light leading-relaxed whitespace-pre-line" :class="m.by === 'provider' ? 'bg-cream/50 border border-line p-3' : ''" x-text="m.text"></p>
                            </div>
                        </template>
                    </div>
                    <form x-show="canReplyTo(viewRequest)" class="mt-6 pt-5 border-t border-line" @submit.prevent="sendThread()">
                        <label class="eyebrow mb-2" for="thread-text" x-text="t('addMessage')"></label>
                        <textarea id="thread-text" x-model="threadText" rows="3" maxlength="1500" :placeholder="t('threadPh')" class="w-full bg-white border border-line focus:border-accent outline-none p-4 font-sans font-light text-base transition-colors placeholder:text-muted-light resize-none"></textarea>
                        <p x-show="threadError" class="text-sm text-red-500 font-sans font-light mt-2" x-text="threadError"></p>
                        <div class="flex items-center justify-between gap-4 mt-3">
                            <button type="button" x-show="viewRequest?.status === 'requested'" @click="cancelRequest(viewRequest).then((ok) => { if (ok) closeThread(); })" class="text-sm font-sans text-muted hover:text-black transition-colors" x-text="t('withdraw')"></button>
                            <button type="submit" :disabled="!threadText.trim() || threadSending" class="p-btn ml-auto disabled:opacity-50">
                                <span x-show="!threadSending" x-text="t('sendWord')"></span>
                                <span x-show="threadSending" x-cloak x-text="t('telliSending')"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Propose new time modal (partner-managed visits) -->
            <div x-show="proposeBooking" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[110] flex items-end sm:items-center justify-center sm:p-4 bg-black/40" role="dialog" aria-modal="true" aria-labelledby="propose-modal-title" @click.self="closePropose()" @keydown.escape.window="if (!rescheduleBookingId) closePropose()">
                <div class="bg-paper w-full sm:max-w-lg max-h-[92vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">
                    <div x-show="proposeSuccess" x-cloak class="text-center py-6">
                        <div class="w-16 h-16 bg-accent rounded-full flex items-center justify-center mx-auto mb-6 animate-checkmark">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="font-serif text-2xl font-light mb-3" x-text="t('doneRequest')"></h3>
                        <p class="text-sm text-muted font-sans font-light max-w-sm mx-auto" x-text="proposeSentBody"></p>
                    </div>
                    <div x-show="!proposeSuccess">
                        <div class="flex justify-between items-center mb-6">
                            <h3 id="propose-modal-title" class="font-serif text-xl font-light" x-text="t('proposeTitle')"></h3>
                            <button type="button" @click="closePropose()" :aria-label="t('docClose')" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <p class="text-sm text-muted font-sans font-light mb-6">
                            <span x-text="t('currentTime')"></span>
                            <span class="capitalize text-black" x-text="formatDate(proposeBooking?.scheduledAt) + ', ' + formatTime(proposeBooking?.scheduledAt)"></span>.
                            <span x-text="proposeHintText"></span>
                        </p>
                        <form @submit.prevent="submitPropose()" class="space-y-6">
                            <div>
                                <label class="eyebrow mb-2" for="propose-date" x-text="t('newDay')"></label>
                                <input id="propose-date" type="date" x-model="proposeDate" :min="minRequestDate" required class="w-full bg-transparent border-b border-line focus:border-accent outline-none py-3 font-sans font-light text-sm">
                            </div>
                            <div>
                                <p class="eyebrow mb-3" x-text="t('orderTime')"></p>
                                <div class="grid grid-cols-3 gap-2">
                                    <template x-for="w in extras.timeWindows.filter(x => x.id !== 'with-visit')" :key="w.id">
                                        <button type="button" @click="proposeWindow = w.id" :aria-pressed="proposeWindow === w.id" :class="proposeWindow === w.id ? 'bg-black text-paper border-black' : 'border-line hover:border-accent'" class="py-3 px-2 border text-center text-xs font-sans font-light transition-colors" x-text="w.label"></button>
                                    </template>
                                </div>
                            </div>
                            <div>
                                <label class="eyebrow mb-2" for="propose-note" x-text="t('noteLabel')"></label>
                                <input id="propose-note" type="text" x-model="proposeNote" maxlength="300" :placeholder="t('proposeNotePh')" class="w-full bg-transparent border-b border-line focus:border-accent outline-none py-3 font-sans font-light text-base placeholder:text-line-strong">
                            </div>
                            <p x-show="proposeError" x-cloak class="text-sm text-red-500 font-sans font-light" x-text="proposeError"></p>
                            <div class="flex gap-4 pt-2">
                                <button type="button" @click="closePropose()" class="p-btn-2" x-text="t('docCancel')"></button>
                                <button type="submit" :disabled="!proposeDate || proposeProcessing" class="p-btn flex-1 disabled:opacity-50">
                                    <span x-show="!proposeProcessing" x-text="t('sendWord')"></span>
                                    <span x-show="proposeProcessing" x-cloak x-text="t('telliSending')"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Reschedule modal -->
            <div x-show="rescheduleBookingId" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/40" role="dialog" aria-modal="true" aria-labelledby="reschedule-modal-title" @click.self="closeReschedule()" @keydown.escape.window="closeReschedule()">
                <div class="bg-paper max-w-lg w-full max-h-[90vh] overflow-y-auto border border-[#E8E3DD] p-6 md:p-8 shadow-lg" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" @click.stop>
                    <div class="flex justify-between items-center mb-6">
                        <h3 id="reschedule-modal-title" class="font-serif text-xl font-light" x-text="lang === 'et' ? 'Muuda visiidi aega' : 'Reschedule visit'"></h3>
                        <button type="button" @click="closeReschedule()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <div x-show="rescheduleSuccess" x-cloak class="mb-6 p-4 bg-green-50 border border-green-200 text-green-800 text-sm font-sans" x-text="lang === 'et' ? 'Aeg uuendatud. Saadame meeldetuletuse.' : 'Time updated. We will send a reminder.'"></div>
                    <p x-show="rescheduleError" x-cloak class="mb-4 text-red-500 text-sm font-sans font-light" x-text="rescheduleError"></p>

                    <div x-show="rescheduleSlotsLoading" class="py-8 text-center">
                        <div class="w-10 h-10 border border-accent border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p class="text-sm text-muted font-sans" x-text="lang === 'et' ? 'Laadin vabu aegu…' : 'Loading available times…'"></p>
                    </div>

                    <div x-show="!rescheduleSlotsLoading && !rescheduleSuccess" x-cloak>
                        <div class="mb-6">
                            <div class="flex items-center justify-between mb-4">
                                <button @click="reschedulePrevMonth()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                <h4 class="font-serif text-lg font-light" x-text="rescheduleCurrentMonthLabel"></h4>
                                <button @click="rescheduleNextMonth()" class="w-10 h-10 flex items-center justify-center hover:bg-cream rounded-full transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                            <div class="grid grid-cols-7 gap-1 mb-2">
                                <template x-for="(day, di) in (lang === 'et' ? ['E', 'T', 'K', 'N', 'R', 'L', 'P'] : ['M', 'T', 'W', 'T', 'F', 'S', 'S'])" :key="di">
                                    <div class="text-center text-[11px] uppercase tracking-[0.16em] text-muted font-sans py-2" x-text="day"></div>
                                </template>
                            </div>
                            <div class="grid grid-cols-7 gap-1">
                                <template x-for="(d, i) in rescheduleCalendarDays" :key="i">
                                    <button type="button" @click="rescheduleSelectDay(d)" :disabled="!d.day || d.isPast || !d.hasSlots"
                                            :class="{ 'bg-accent/20': d.date === rescheduleDate, 'text-accent': d.hasSlots && !d.isPast && d.date !== rescheduleDate }"
                                            class="aspect-square flex items-center justify-center text-sm font-sans rounded-lg disabled:opacity-40 disabled:cursor-not-allowed hover:bg-cream/50 transition-colors" x-text="d.day"></button>
                                </template>
                            </div>
                        </div>

                        <div x-show="rescheduleDate" x-transition class="mb-6">
                            <p class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans mb-3" x-text="lang === 'et' ? 'Saadaolevad ajad' : 'Available times'"></p>
                            <div class="grid grid-cols-3 gap-2">
                                <template x-for="time in rescheduleAvailableTimes" :key="time">
                                    <button type="button" @click="rescheduleTime = time"
                                            :class="rescheduleTime === time ? 'bg-black text-paper' : 'border border-[#E8E3DD] hover:border-accent'"
                                            class="py-3 px-4 text-center text-sm font-sans font-light rounded transition-colors" x-text="time"></button>
                                </template>
                            </div>
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button type="button" @click="closeReschedule()" class="p-btn-2" x-text="lang === 'et' ? 'Loobu' : 'Cancel'"></button>
                            <button type="button" @click="confirmReschedule()" :disabled="!rescheduleDate || !rescheduleTime || rescheduleProcessing"
                                    class="p-btn flex-1 disabled:opacity-50">
                                <span x-show="!rescheduleProcessing" x-text="lang === 'et' ? 'Kinnita' : 'Confirm'"></span>
                                <span x-show="rescheduleProcessing" x-cloak>
                                    <svg class="w-4 h-4 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer (compact: this is a working portal, not the marketing site) -->
            <footer class="border-t border-[#E8E3DD] px-6 md:px-12 py-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 text-sm font-sans font-light text-muted">
                    <div class="flex flex-wrap items-center gap-4">
                        <!-- White label: the developer's portal, run by SUKODA -->
                        <span x-show="brand" x-cloak class="text-xs" x-text="lang === 'et' ? 'Portaali haldab SUKODA · Epic Ship OÜ' : 'Portal run by SUKODA · Epic Ship OÜ'"></span>
                        <a x-show="!brand" href="index.html" class="font-serif text-lg tracking-[0.08em] font-light text-black">SUKODA</a>
                        <span class="hidden md:inline text-[#D4CFC8]">·</span>
                        <a href="mailto:tere@sukoda.ee" class="hover:text-black transition-colors">tere@sukoda.ee</a>
                    </div>
                    <div class="flex flex-wrap items-center gap-x-5 gap-y-2">
                        <a href="tingimused.html" class="hover:text-black transition-colors" x-text="lang === 'et' ? 'Tingimused' : 'Terms'"></a>
                        <a href="privaatsus.html" class="hover:text-black transition-colors" x-text="lang === 'et' ? 'Privaatsus' : 'Privacy'"></a>
                        <span class="text-xs">© 2026 Epic Ship OÜ · 14713548</span>
                    </div>
                </div>
            </footer>
        </div>

    </div>

</body>
</html>
