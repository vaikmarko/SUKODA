<!DOCTYPE html>
<html lang="et" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <style>[x-cloak] { display: none !important; } html { font-size: 17px; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SUKODA | Minu portaal</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/logo/icon-s-black.svg">
    <link rel="apple-touch-icon" href="assets/logo/icon-square.svg">
    <link rel="preload" href="/assets/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <script type="module" src="/assets/js/main.js"></script>
</head>
<body class="antialiased" x-data="{
    lang: localStorage.getItem('sukoda_lang') || 'et',
    token: localStorage.getItem('sukoda_portal_token') || '',
    authenticated: false,
    loading: true,

    loginEmail: '',
    loginSending: false,
    loginSent: false,
    loginDesk: false,
    loginError: '',

    order: null,

    viewer: null,
    bookings: [],
    activeTab: 'overview',

    homeProfile: {
        access: '',
        pets: '',
        allergies: '',
        flowerPreference: '',
        linens: '',
        towels: '',
        specialRequests: '',
    },
    profileSaving: false,
    profileSaved: false,
    profileEditing: false,
    // Fields of the home profile, in the order they read best; `long` = textarea
    get profileFields() {
        const et = this.lang === 'et';
        return [
            { key: 'access', label: et ? 'Sissepääs' : 'Access', hint: et ? 'Koduhooldaja püsiv juhis: kood, võti, kellel võti on. Garantiile ja tehnikule küsitakse iga visiidi juures eraldi.' : 'The housekeeper’s standing note: code, key, who holds it. Warranty and the technician are asked separately, each visit.', long: true },
            { key: 'pets', label: et ? 'Lemmikloomad' : 'Pets', hint: et ? 'nt kass Luna, sõbralik' : 'e.g. cat Luna, friendly' },
            { key: 'allergies', label: et ? 'Allergiad ja vahendid' : 'Allergies & products', hint: et ? 'nt looduslikud vahendid, lateksiallergia' : 'e.g. natural products, latex allergy' },
            { key: 'flowerPreference', label: et ? 'Lilled' : 'Flowers', hint: et ? 'nt valged tulbid, mitte liiliaid' : 'e.g. white tulips, no lilies' },
            { key: 'linens', label: et ? 'Voodipesu' : 'Linens', hint: et ? 'nt vahetada iga 2 nädala tagant' : 'e.g. change every 2 weeks' },
            { key: 'towels', label: et ? 'Rätikud' : 'Towels', hint: et ? 'nt vahetada igal visiidil' : 'e.g. change every visit' },
            { key: 'specialRequests', label: et ? 'Erisoovid' : 'Special requests', hint: et ? 'nt eritähelepanu köögile; kardinad pooleldi lahti; vannitoas ilma tugeva lõhnata' : 'e.g. extra attention to the kitchen; curtains half open; no strong scents in the bathroom', long: true },
        ];
    },
    get profileFilled() { return this.profileFields.filter((f) => (this.homeProfile[f.key] || '').trim()); },
    homeTypeLabel(t) {
        const et = this.lang === 'et';
        return t === 'apartment' ? (et ? 'Korter' : 'Flat') : t === 'house' ? (et ? 'Maja' : 'House') : t === 'summer' ? (et ? 'Suvila' : 'Cottage') : '';
    },

    pauseReason: '',
    pauseProcessing: false,
    resumeProcessing: false,

    rescheduleBookingId: null,
    rescheduleSlots: {},
    rescheduleSlotsLoading: false,
    rescheduleDate: '',
    rescheduleTime: '',
    rescheduleAvailableTimes: [],
    rescheduleCalendarDays: [],
    rescheduleCurrentMonth: '',
    rescheduleCurrentMonthLabel: '',
    rescheduleProcessing: false,
    rescheduleError: '',
    rescheduleSuccess: false,

    // Partner-managed visit: propose a new time (provider confirms)
    proposeBooking: null,
    proposeDate: '',
    proposeWindow: 'any',
    proposeNote: '',
    proposeProcessing: false,
    proposeError: '',
    proposeSuccess: false,

    // Household contacts (who receives notifications)
    contacts: [],
    contactsSaving: false,
    contactsSaved: false,
    contactsError: '',

    // Away periods (oleme eemal)
    awayFrom: '',
    awayTo: '',
    awayNote: '',
    awayProcessing: false,
    awayError: '',
    awayDone: '',

    // Extras (lisateenused)
    extras: { catalogue: [], timeWindows: [], requests: [], provider: null, florist: null, partners: [], brand: null, maxOpenRequests: 5, away: [] },
    extrasLoaded: false,
    requestService: null,
    addonChooser: false,
    requestDate: '',
    requestWindow: 'any',
    requestNote: '',
    requestUrgent: false,
    requestAccess: 'profile',
    requestAccessNote: '',
    requestProcessing: false,
    requestError: '',
    requestDone: null,

    // Open request thread (past or current) — the conversation lives here, e-mail only notifies
    viewRequest: null,
    threadText: '',
    threadSending: false,
    threadError: '',

    // Kodu hooldusrütm (recurring upkeep) + kodu dokumendid
    maintAdding: false,          // custom-item form open
    maintForm: { name: '', intervalMonths: 6, lastDoneAt: '' },
    maintDoneFor: null,          // item id whose tehtud-date picker is open
    maintDoneDate: '',
    maintBusy: '',
    maintError: '',
    maintShowSuggestions: false,
    maintOpen: null,
    docAdding: false,
    docForm: { title: '', url: '', category: 'other', note: '' },
    docFile: null,
    docBusy: false,
    docError: '',

    async init() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        // Deep link to a tab (e-mails: /minu?tab=home)
        if (['overview', 'extras', 'visits', 'home'].includes(urlParams.get('tab'))) this.activeTab = urlParams.get('tab');

        // Warm the profile/extras functions in parallel with token validation so the
        // real calls below don't each pay a Cloud Functions cold start in sequence.
        if (urlToken || this.token) {
            for (const p of ['/api/me', '/api/me/extras']) fetch(p, { headers: { 'Authorization': 'Bearer warmup' } }).catch(() => {});
        }

        if (urlToken) {
            try {
                const res = await fetch('/api/auth/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: urlToken }),
                });
                if (res.ok) {
                    const data = await res.json();
                    this.token = data.token;
                    localStorage.setItem('sukoda_portal_token', data.token);
                    const tab = urlParams.get('tab');
                    window.history.replaceState({}, '', tab ? `/minu?tab=${encodeURIComponent(tab)}` : '/minu');
                } else {
                    // A link in the URL is an explicit login attempt — don't keep a previous household's session.
                    localStorage.removeItem('sukoda_portal_token');
                    this.token = '';
                }
            } catch (e) {
                console.error('Token validation failed:', e);
                localStorage.removeItem('sukoda_portal_token');
                this.token = '';
            }
        }

        if (this.token) {
            await this.loadProfile();
            // Deep link from an e-mail: /minu?request=<id> opens that request's thread
            const reqId = urlParams.get('request');
            if (reqId && this.authenticated) {
                try {
                    await this.loadExtras();
                    const r = (this.extras.requests || []).find((x) => x.id === reqId);
                    if (r) await this.openThread(r);
                } catch (e) { console.error(e); }
                window.history.replaceState({}, '', '/minu?tab=extras');
            }
        }
        this.loading = false;
    },

    async loadProfile() {
        try {
            const res = await fetch('/api/me', {
                headers: { 'Authorization': 'Bearer ' + this.token },
            });
            if (res.ok) {
                const data = await res.json();
                this.order = data.order;
                this.viewer = data.viewer || null; // who is logged in: primary customer or a household member
                this.bookings = data.bookings || [];
                this.contacts = JSON.parse(JSON.stringify(data.order.contacts || []));
                this.authenticated = true;
                if (data.order.homeProfile) {
                    this.homeProfile = { ...this.homeProfile, ...data.order.homeProfile };
                    this.profileEditing = !this.profileFilled.length;
                }
                this.loadExtras();
            } else {
                localStorage.removeItem('sukoda_portal_token');
                this.token = '';
            }
        } catch (e) {
            console.error('Failed to load profile:', e);
        }
    },

    async loadExtras() {
        try {
            const res = await fetch('/api/me/extras', { headers: { 'Authorization': 'Bearer ' + this.token } });
            if (res.ok) {
                const data = await res.json();
                this.extras = { ...this.extras, ...data };
                this.extrasLoaded = true;
                // White label: the tab reads as the developer's portal
                if (this.brand?.name) document.title = `${this.brand.name} | ${this.lang === 'et' ? 'Minu kodu' : 'My home'}`;
            }
        } catch (e) {
            console.error('Failed to load extras:', e);
        }
    },

    // ---- Contacts ----
    addContact() {
        if (this.contacts.length >= (this.extras.maxContacts || 6)) return;
        // Temporary id so the row keeps its inputs when a neighbour is removed (the server assigns the real one)
        this.contacts.push({ id: 'new-' + Math.random().toString(36).slice(2, 8), name: '', email: '', phone: '', notify: true });
    },
    removeContact(i) {
        this.contacts.splice(i, 1);
    },
    async saveContacts() {
        if (this.contactsSaving) return;
        this.contactsSaving = true;
        this.contactsSaved = false;
        this.contactsError = '';
        try {
            const res = await fetch('/api/me/contacts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ contacts: this.contacts.filter(c => c.name || c.email) }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'failed');
            this.contacts = data.contacts;
            this.contactsSaved = true;
            setTimeout(() => this.contactsSaved = false, 3000);
        } catch (e) {
            this.contactsError = this.lang === 'et' ? 'Salvestamine ebaõnnestus. Kontrolli e-posti aadresse.' : 'Saving failed. Check the email addresses.';
        } finally {
            this.contactsSaving = false;
        }
    },

    // ---- Extras (lisateenused) ----
    todayStr() {
        const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Tallinn', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        return p; // YYYY-MM-DD
    },
    isAwayNow(p) {
        const t = this.todayStr();
        return p.from <= t && t <= p.to;
    },
    presetAwayMonth(offset) {
        const [y, m] = this.todayStr().split('-').map(Number);
        const first = new Date(Date.UTC(y, m - 1 + offset, 1));
        const last = new Date(Date.UTC(y, m + offset, 0));
        const iso = (d) => d.toISOString().slice(0, 10);
        this.awayFrom = offset === 0 ? this.todayStr() : iso(first);
        this.awayTo = iso(last);
    },
    async addAway() {
        if (this.awayProcessing || !this.awayFrom) return;
        this.awayProcessing = true; this.awayError = ''; this.awayDone = '';
        try {
            const res = await fetch('/api/me/away', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ from: this.awayFrom, to: this.awayTo || this.awayFrom, note: this.awayNote }),
            });
            const data = await res.json();
            if (!res.ok) { this.awayError = data.error || (this.lang === 'et' ? 'Salvestamine ebaõnnestus' : 'Could not save'); return; }
            this.extras.away = data.away || [];
            const n = (data.cancelled || []).length;
            const kept = data.kept || [];
            this.awayDone = this.lang === 'et'
                ? (n ? `Kirjas. ${n} koristus${n === 1 ? '' : 't'} tühistatud, koduhooldaja sai teate.` : 'Kirjas. Sellesse vahemikku koristusi ei jäänud, koduhooldaja sai teate.')
                : (n ? `Saved. ${n} cleaning visit${n === 1 ? '' : 's'} cancelled, your housekeeper has been told.` : 'Saved. No cleaning visits fell into this period, your housekeeper has been told.');
            if (kept.length) {
                const list = kept.map((b) => this.visitLabel(b) + ' ' + this.formatDateShort(b.scheduledAt)).join(', ');
                this.awayDone += this.lang === 'et' ? ` Need visiidid jäävad alles — muuda aega eraldi: ${list}.` : ` These visits stay — move them separately: ${list}.`;
            }
            this.awayFrom = ''; this.awayTo = ''; this.awayNote = '';
            await this.loadProfile();
        } catch (e) {
            this.awayError = this.lang === 'et' ? 'Ühendus ebaõnnestus' : 'Connection failed';
        } finally {
            this.awayProcessing = false;
        }
    },
    async removeAway(p) {
        if (this.awayProcessing) return;
        if (!confirm(this.lang === 'et' ? 'Eemalda eemalolek? Tühistatud ajad taastatakse ja koduhooldaja saab teate.' : 'Remove this away period? Cancelled visits are restored and your housekeeper is told.')) return;
        this.awayProcessing = true; this.awayError = ''; this.awayDone = '';
        try {
            const res = await fetch('/api/me/away/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ periodId: p.id }),
            });
            const data = await res.json();
            if (!res.ok) { this.awayError = data.error || 'Error'; return; }
            this.extras.away = data.awayPeriods || [];
            this.awayDone = this.lang === 'et' ? `Eemaldatud. ${data.restored || 0} aega taastatud.` : `Removed. ${data.restored || 0} visit(s) restored.`;
            await this.loadProfile();
        } catch (e) {
            this.awayError = this.lang === 'et' ? 'Ühendus ebaõnnestus' : 'Connection failed';
        } finally {
            this.awayProcessing = false;
        }
    },

    /** Still live: waiting for a reply, needs a new day from the household, or confirmed and ahead */
    get openRequests() {
        return this.extras.requests.filter(r => ['requested', 'declined', 'confirmed'].includes(r.status));
    },
    /** Waiting on someone — the partner (requested) or the household (declined). Confirmed ones live in the calendar. */
    get awaitingRequests() {
        return this.extras.requests.filter(r => r.status === 'requested' || r.status === 'declined');
    },
    /** History: done, answered in writing, or withdrawn */
    get pastRequests() {
        return this.extras.requests.filter(r => ['completed', 'answered', 'cancelled'].includes(r.status));
    },
    get pendingRescheduleIds() {
        return this.extras.requests.filter(r => r.type === 'reschedule' && r.status === 'requested').map(r => r.targetBookingId);
    },
    get minRequestDate() {
        return window.SUKODA_TIME.shiftDateString(window.SUKODA_TIME.getDateString(), 1);
    },
    isOrderable(service) {
        if (!service) return true;
        const cat = (this.extras.categories || []).find((c) => c.id === service.category);
        return !cat || cat.orderable !== false;
    },
    openRequest(service) {
        this.viewRequest = null;
        this.addonChooser = false;
        this.requestService = service;
        this.requestDate = '';
        this.requestWindow = service.category === 'flowers' ? 'with-visit' : 'any';
        this.requestUrgent = false;
        const forCleaner = service.category === 'cleaning' || service.id === 'flowers';
        this.requestAccess = (forCleaner && this.homeProfile.access) ? 'profile' : 'home';
        this.requestAccessNote = '';
        this.requestNote = '';
        this.requestError = '';
        this.requestDone = null;
    },
    closeRequest() {
        this.requestService = null;
        this.requestDone = null;
        this.addonChooser = false;
    },
    async openThread(r) {
        if (!r) return;
        this.requestService = null;
        this.viewRequest = r;
        this.threadText = '';
        this.threadError = '';
        this.activeTab = 'extras';
        // The partner may have written since the page loaded — show the thread as it is now
        await this.loadExtras();
        if (this.viewRequest && this.viewRequest.id === r.id) this.viewRequest = (this.extras.requests || []).find((x) => x.id === r.id) || this.viewRequest;
    },
    closeThread() { this.viewRequest = null; this.threadText = ''; this.threadError = ''; },
    get threadMessages() {
        const r = this.viewRequest;
        if (!r) return [];
        const msgs = Array.isArray(r.messages) ? r.messages.filter((m) => m && m.text) : [];
        if (msgs.length) return msgs;
        const out = [];
        if (r.note) out.push({ id: 'note', by: 'client', name: r.customerName || '', text: r.note, at: r.createdAt });
        if (r.providerMessage) out.push({ id: 'pm', by: 'provider', name: r.providerName || '', text: r.providerMessage, at: r.answeredAt || r.confirmedAt || r.completedAt || r.declinedAt });
        return out;
    },
    canReplyTo(r) {
        return r && !['cancelled'].includes(r.status);
    },
    formatMsgTime(iso) {
        if (!iso) return '';
        return this.formatDateLong(iso) + ' · ' + this.formatTime(iso);
    },
    /** Message · Küsimus · Pöördumine · Soov — what the drawer calls the thing being sent */
    get requestNoun() {
        const et = this.lang === 'et';
        if (this.requestService?.id === 'cleaning-note') return et ? 'Sõnum' : 'Message';
        if (this.requestService?.id === 'extra-works') return et ? 'Hinnapäring' : 'Quote request';
        if (this.requestKind === 'question') return et ? 'Küsimus' : 'Question';
        if (this.requestKind === 'issue') return et ? 'Pöördumine' : 'Report';
        return et ? 'Soov' : 'Request';
    },
    /** Issues, questions, messages and “something else” all start with words; the server wants at least a few */
    get requestNeedsNote() { return this.requestKind !== 'visit' || this.requestService?.id === 'other'; },
    get requestNoteTooShort() { return this.requestNeedsNote && (this.requestNote || '').trim().length < 5; },
    resolveAccess() {
        if (this.requestKind === 'question') return '';
        if (this.requestAccess === 'home') return this.lang === 'et' ? 'Olen sel ajal kodus.' : 'I will be home.';
        if (this.requestAccess === 'note') return (this.requestAccessNote || '').trim();
        return (this.homeProfile.access || '').trim();
    },
    get requestPriceBlurb() {
        const et = this.lang === 'et';
        const s = this.requestService;
        if (!s) return '';
        const cat = (this.extras.categories || []).find((c) => c.id === s.category);
        const tm = cat?.terms;
        const who = this.shortName(cat?.partnerName) || (et ? 'tegija' : 'the provider');
        if (s.pricing === 'quote') return et ? `Küsimine on tasuta. ${who} saadab hinnapakkumise kirjalikult — töö algab alles siis, kui sa selle kinnitad.` : `Asking is free. ${who} sends a written quote — work starts only once you confirm it.`;
        if (this.requestKind === 'question') return et ? 'Küsimus on tasuta. Vastus tuleb kirjalikult siia ja e-postiga.' : 'Questions are free. The answer arrives here and by e-mail.';
        if (this.requestKind === 'issue') return et ? 'Garantiiajal tasuta. Kui töö jääb garantiist välja, anname sellest enne teada — ilma sinu nõusolekuta ei tehta midagi ega esitata arvet.' : 'Free during warranty. If the work falls outside it, we tell you first — nothing is done or invoiced without your consent.';
        if (s.priceLabel?.included && tm?.quota) return et ? `${tm.quota}. Kui miski jääb sellest välja, kinnitab ${who} hinna vastuses — enne tööd.` : `${tm.quota}. If anything falls outside that, ${who} confirms the price in the reply — before the work.`;
        return et ? `${who} kinnitab hinna vastuses. Arvet ei esitata enne, kui oled töö kinnitanud.` : `${who} confirms the price in the reply. Nothing is invoiced before you confirm the work.`;
    },
    /** Guide price for this job. A category invoice (the standing clean) is not this job's bill. */
    get requestPriceLine() {
        const s = this.requestService;
        if (!s || s.priceLabel?.included) return s?.priceLabel?.text || '';
        const label = s.priceLabel?.text || '';
        if (/^(arve|billed by)\b/i.test(label)) return (typeof s.priceHint === 'string' ? s.priceHint : '') || '';
        return label.replace(/\s·\s(arve|billed by)\s.+$/i, '');
    },
    askPartner(p) {
        // Write here on a partner card: a written question to the builder team, a message to the housekeeper
        const prefer = { warranty: ['home-manual'], building: ['building-question'], handyman: ['small-repairs'], cleaning: ['cleaning-note'], flowers: ['flowers'] }[p.category] || ['other'];
        const cat = this.extras.catalogue || [];
        const svc = prefer.map((id) => cat.find((s) => s.id === id)).find(Boolean) || cat.find((s) => s.category === p.category);
        if (svc) this.openRequest(svc);
    },
    async sendThread() {
        const r = this.viewRequest;
        const text = (this.threadText || '').trim();
        if (!r || !text || this.threadSending) return;
        this.threadSending = true;
        this.threadError = '';
        try {
            const res = await fetch('/api/me/requests/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({ requestId: r.id, text }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'failed');
            this.threadText = '';
            if (data.request) {
                this.extras = { ...this.extras, requests: this.extras.requests.map((x) => x.id === data.request.id ? { ...x, ...data.request } : x) };
                this.viewRequest = { ...r, ...data.request };
            } else {
                await this.loadExtras();
                this.viewRequest = (this.extras.requests || []).find((x) => x.id === r.id) || r;
            }
        } catch (e) {
            this.threadError = e.message && e.message !== 'failed' ? e.message : (this.lang === 'et' ? 'Saatmine ebaõnnestus.' : 'Sending failed.');
        } finally {
            this.threadSending = false;
        }
    },

    // ---- Hooldusrütm ----
    get maintenance() { return this.extras.maintenance || { items: [], suggestions: [], intervals: [1, 2, 3, 6, 12, 24], homeType: null, remindersEnabled: true }; },
    // Only what the household itself has to do counts as due for the household
    get maintenanceDue() { return this.maintenance.items.filter((i) => i.state !== 'ok' && i.doneBy !== 'provider').length; },
    get maintHomeItems() { return this.maintenance.items.filter((i) => i.doneBy !== 'provider'); },
    get maintProviderItems() { return this.maintenance.items.filter((i) => i.doneBy === 'provider'); },
    get providerFirstName() { return (this.maintenance.provider?.name || this.extras.provider?.name || '').split(' ')[0]; },
    nextLabel(item) {
        const d = new Date(item.nextDueAt + 'T12:00:00');
        return d.toLocaleDateString(this.lang === 'et' ? 'et-EE' : 'en-GB', { month: 'long', year: 'numeric' });
    },
    lastDoneLabel(item) {
        if (!item.lastDoneAt) return '';
        const d = new Date(item.lastDoneAt + 'T12:00:00').toLocaleDateString(this.lang === 'et' ? 'et-EE' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        return (this.lang === 'et' ? 'viimati ' : 'last ') + d;
    },
    async assignMaintenance(item, doneBy) { await this.maintenanceAction({ action: 'update', itemId: item.id, doneBy }, 'own-' + item.id); },
    intervalLabel(m) {
        if (this.lang === 'et') return m === 1 ? 'iga kuu' : m === 12 ? 'kord aastas' : m === 24 ? 'iga 2 aasta tagant' : `iga ${m} kuu tagant`;
        return m === 1 ? 'monthly' : m === 12 ? 'yearly' : m === 24 ? 'every 2 years' : `every ${m} months`;
    },
    dueLabel(item) {
        const d = new Date(item.nextDueAt + 'T12:00:00');

    /** One list of what waits on the household: requests waiting on someone, upkeep due, a time pending. Confirmed visits live in the calendar. */
    get attention() {

    /** Four verbs on the overview. Everything else is one tab away. */

        out.push({ id: 'order', category: 'handyman', tone: 'bg-cream text-black', icon: this.serviceIcon('small-repairs'), title: et ? 'Telli teenus' : 'Order a service', sub: '', who: '', cta: et ? 'Vali' : 'Choose', go: () => { this.activeTab = 'extras'; } });
        if (this.visitAddons.length && this.nextCleaning) out.push({ id: 'addon', category: 'cleaning', tone: 'bg-black text-paper', icon: 'M12 6v6m0 0v6m0-6h6m-6 0H6', title: et ? 'Lisa koristusvisiidile' : 'Add to the cleaning visit', sub: this.visitAddons.map((s) => s.name).slice(0, 3).join(', ') + (this.visitAddons.length > 3 ? (et ? ' ja muud' : ' and more') : '') + ' — ' + this.formatDateShort(this.nextCleaning.scheduledAt) + (et ? ' visiidi käigus.' : ' during the visit.'), who: this.order?.provider?.name || '', cta: et ? 'Vali' : 'Choose', go: () => this.openAddonChooser() });

    // ---- Composition helpers (layout only; no new data) ----

    get brand() {

    warrantyUntilLabel() {

        return window.SUKODA_TIME.formatDate(String(d).slice(0, 10) + 'T12:00:00', this.lang === 'et' ? 'et-EE' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    get handymanQuota() {

    /** The housekeeper's next regular visit (extras like a warranty call are separate visits) */
    get nextCleaning() { return this.upcomingBookings.find((b) => b.kind !== 'extra') || null; },
    /** One colour per role, used on avatars, chips and dots: housekeeper black · builder's team gold · handyman slate · florist rose · others stone */
    partnerDot(category) { return category === 'cleaning' ? 'bg-black' : category === 'warranty' ? 'bg-accent' : category === 'handyman' ? 'bg-[#6B7A86]' : category === 'flowers' ? 'bg-pink-300' : 'bg-[#B8B2AA]'; },

    // ---- Dokumendid ----

    async documentAction(body) {

    },
    docSourceLabel(d) {

    },
    /** Files are streamed through the API with the session token — the bucket itself is never public */
    fileHref(d) { return '/api/me/documents/file?id=' + encodeURIComponent(d.id) + '&token=' + encodeURIComponent(this.token); },
    onDocFile(e) {
        const f = e.target.files && e.target.files[0];
        this.docFile = f || null;
        if (f && !this.docForm.title) this.docForm.title = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').slice(0, 120);
        e.target.value = '';
    },
    async addDocument() {
        if (!this.docForm.title) return;
        if (this.docFile) {
            const f = this.docFile;
            if (f.size > 8 * 1024 * 1024) { this.docError = this.lang === 'et' ? 'Fail on suurem kui 8 MB' : 'File is larger than 8 MB'; return; }
            const data = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result)); r.onerror = reject; r.readAsDataURL(f); });
            this.docBusy = true; this.docError = '';
            try {
                const res = await fetch('/api/me/documents/upload', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }, body: JSON.stringify({ ...this.docForm, url: '', fileName: f.name, contentType: f.type || 'application/octet-stream', data }) });
                const out = await res.json();
                if (!res.ok) { this.docError = out.error || 'Error'; return; }
                this.extras = { ...this.extras, documents: out.documents };
                this.docAdding = false; this.docFile = null; this.docForm = { title: '', url: '', category: 'other', note: '' };
            } catch (e) { this.docError = 'Error'; } finally { this.docBusy = false; }
            return;
        }
        if (await this.documentAction({ action: 'add', ...this.docForm })) { this.docAdding = false; this.docForm = { title: '', url: '', category: 'other', note: '' }; }

    async removeDocument(d) {

    async submitRequest() {

                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
                body: JSON.stringify({

    openReschedule(booking) {
        this.rescheduleBookingId = booking.id;
        this.rescheduleDate = '';
        this.rescheduleTime = '';
        this.rescheduleError = '';
        this.rescheduleSuccess = false;
        this.rescheduleCurrentMonth = window.SUKODA_TIME.getYearMonth(booking.scheduledAt || new Date());
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

    updateRescheduleMonthLabel() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const months = { et: ['Jaanuar', 'Veebruar', 'Märts', 'Aprill', 'Mai', 'Juuni', 'Juuli', 'August', 'September', 'Oktoober', 'November', 'Detsember'], en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'] };
        this.rescheduleCurrentMonthLabel = (months[this.lang] || months.et)[m - 1] + ' ' + y;
    },

    async loadRescheduleSlots() {
        if (!this.order?.size || !this.rescheduleCurrentMonth) return;
        this.rescheduleSlotsLoading = true;
        this.rescheduleError = '';
        try {
            const res = await fetch('/api/slots?size=' + this.order.size + '&month=' + this.rescheduleCurrentMonth);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            this.rescheduleSlots = data.slots || {};
            // Demo account fallback: if no slots from Cal.com, use mock slots so reschedule works
            const isEmpty = Object.keys(this.rescheduleSlots).length === 0;
            if (isEmpty && this.order?.id?.startsWith('demo-')) {
                this.rescheduleSlots = this.getDemoRescheduleSlots();
            }
            this.buildRescheduleCalendar();
        } catch (e) {
            if (this.order?.id?.startsWith('demo-')) {
                this.rescheduleSlots = this.getDemoRescheduleSlots();
                this.buildRescheduleCalendar();
            } else {
                this.rescheduleError = this.lang === 'et' ? 'Aegade laadimine ebaõnnestus.' : 'Failed to load times.';
            }
        } finally {
            this.rescheduleSlotsLoading = false;
        }
    },

    getDemoRescheduleSlots() {
        const [y, m] = (this.rescheduleCurrentMonth || window.SUKODA_TIME.getYearMonth()).split('-').map(Number);
        const slots = {};
        const todayStr = window.SUKODA_TIME.getDateString();
        const times = ['09:00', '10:00', '11:00', '14:00'];
        for (let d = 1; d <= 28; d++) {
            const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            if (dateStr < todayStr) continue;
            const dateObj = new Date(dateStr + 'T12:00:00');
            const dow = dateObj.getDay();
            if (dow >= 1 && dow <= 5) slots[dateStr] = times;
        }
        return slots;
    },

    buildRescheduleCalendar() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const lastDay = new Date(y, m, 0);
        const todayStr = window.SUKODA_TIME.getDateString();
        let startDow = firstDay.getDay() - 1;
        if (startDow < 0) startDow = 6;
        this.rescheduleCalendarDays = [];
        for (let i = 0; i < startDow; i++) {
            this.rescheduleCalendarDays.push({ day: '', date: '', hasSlots: false, isPast: true });
        }
        for (let d = 1; d <= lastDay.getDate(); d++) {
            const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            const hasSlots = this.rescheduleSlots[dateStr] && this.rescheduleSlots[dateStr].length > 0;
            this.rescheduleCalendarDays.push({ day: d, date: dateStr, hasSlots, isPast: dateStr < todayStr });
        }
    },

    rescheduleSelectDay(day) {
        if (!day.hasSlots || day.isPast) return;
        this.rescheduleDate = day.date;
        this.rescheduleTime = '';
        this.rescheduleAvailableTimes = this.rescheduleSlots[day.date] || [];
    },

    reschedulePrevMonth() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const [currentYear, currentMonth] = window.SUKODA_TIME.getYearMonth().split('-').map(Number);
        const currentYM = currentYear * 12 + (currentMonth - 1);
        const targetYM = y * 12 + (m - 2);
        if (targetYM < currentYM) return;
        const newMonth = m - 1;
        const newYear = newMonth < 1 ? y - 1 : y;
        const adjustedMonth = newMonth < 1 ? 12 : newMonth;
        this.rescheduleCurrentMonth = newYear + '-' + String(adjustedMonth).padStart(2, '0');
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

    rescheduleNextMonth() {
        const [y, m] = (this.rescheduleCurrentMonth || '2026-01').split('-').map(Number);
        const newMonth = m + 1;
        const newYear = newMonth > 12 ? y + 1 : y;
        const adjustedMonth = newMonth > 12 ? 1 : newMonth;
        this.rescheduleCurrentMonth = newYear + '-' + String(adjustedMonth).padStart(2, '0');
        this.updateRescheduleMonthLabel();
        this.loadRescheduleSlots();
    },

    closeReschedule() {
        this.rescheduleBookingId = null;
        this.rescheduleDate = '';
        this.rescheduleTime = '';
        this.rescheduleError = '';
        this.rescheduleSuccess = false;

    async confirmReschedule() {
        if (!this.rescheduleBookingId || !this.rescheduleDate || !this.rescheduleTime || this.rescheduleProcessing) return;
        this.rescheduleProcessing = true;
        this.rescheduleError = '';
        try {
            const newStartTime = window.SUKODA_TIME.tallinnDateTimeToIso(this.rescheduleDate, this.rescheduleTime);
            const res = await fetch('/api/me/reschedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },

                    bookingId: this.rescheduleBookingId,
                    newDate: this.rescheduleDate,
                    newTime: this.rescheduleTime,
                    newStartTime,
                }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Reschedule failed');
            this.rescheduleSuccess = true;
            await this.loadProfile();
            setTimeout(() => { this.closeReschedule(); }, 2000);
        } catch (e) {
            this.rescheduleError = this.lang === 'et' ? 'Aja muutmine ebaõnnestus. Proovi uuesti.' : 'Reschedule failed. Please try again.';
        } finally {
            this.rescheduleProcessing = false;
        }
    },

    getPackageName(pkg) {
        const names = {
            once: this.lang === 'et' ? '1× kuus' : '1× month',
            twice: this.lang === 'et' ? '2× kuus' : '2× month',
            weekly: this.lang === 'et' ? '4× kuus' : '4× month',
        };
        if (names[pkg]) return names[pkg];
        // Partner-managed homes: describe the agreed rhythm from the schedule, not a package code
        const f = this.order?.schedule?.active !== false ? this.order?.schedule?.frequency : null;
        const rhythm = { weekly: names.weekly, biweekly: names.twice, monthly: names.once }[f];
        return rhythm || (this.lang === 'et' ? 'Kokkuleppel' : 'As agreed');
    },

    getSizeName(size) {
        const names = {
            small: '1-2 ' + (this.lang === 'et' ? 'tuba' : 'rooms'),
            medium: '3 ' + (this.lang === 'et' ? 'tuba' : 'rooms'),
            large: '4 ' + (this.lang === 'et' ? 'tuba' : 'rooms'),
        };
        return names[size] || size;
    },

    get awayNow() {
        return (this.extras.away || []).some((p) => this.isAwayNow(p));
    },

    getStatusLabel(status) {
        if (this.order?.pausedAt) return this.lang === 'et' ? 'Pausil' : 'Paused';
        if (this.awayNow) return this.lang === 'et' ? 'Eemal' : 'Away';
        const labels = {
            paid: this.lang === 'et' ? 'Aktiivne' : 'Active',
            cancelling: this.lang === 'et' ? 'Tühistamisel' : 'Cancelling',
            cancelled: this.lang === 'et' ? 'Tühistatud' : 'Cancelled',
        };
        return labels[status] || status;
    },

    getStatusColor(status) {
        if (this.order?.pausedAt || this.awayNow) return 'text-amber-600 bg-amber-50';
        const colors = {
            paid: 'text-green-600 bg-green-50',
            cancelling: 'text-amber-600 bg-amber-50',
            cancelled: 'text-red-500 bg-red-50',
        };
        return colors[status] || 'text-gray-500 bg-gray-50';
    },

    get upcomingBookings() {
        const now = new Date().toISOString();
        return this.bookings
            .filter(b => (b.status === 'confirmed' || b.status === 'scheduled') && b.scheduledAt > now)
            .sort((a, b) => a.scheduledAt < b.scheduledAt ? -1 : 1);
    },

    get pastBookings() {
        const now = new Date().toISOString();
        return this.bookings.filter(b => b.scheduledAt <= now || b.status === 'completed' || b.status === 'cancelled');
    },

    visitLabel(b) {
        if (b?.kind === 'extra' && b.serviceName) return b.serviceName;
        return this.lang === 'et' ? 'Koristus' : 'Cleaning';
    },

    formatDate(iso) {
        if (!iso) return '';
        const opts = { weekday: 'long', day: 'numeric', month: 'long' };
        return window.SUKODA_TIME.formatDate(iso, this.lang === 'et' ? 'et-EE' : 'en-GB', opts);
    },

    formatDateShort(v) {
        if (!v) return '';
        const iso = v.length === 10 ? v + 'T12:00:00' : v;
        return window.SUKODA_TIME.formatDate(iso, this.lang === 'et' ? 'et-EE' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    },

    /** Records and history carry the year: “14. märts 2026” — the folder outlives the season */
    formatDateLong(v) {
        if (!v) return '';
        const iso = v.length === 10 ? v + 'T12:00:00' : v;
        return window.SUKODA_TIME.formatDate(iso, this.lang === 'et' ? 'et-EE' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    },

    /** A read-only fact for developer homes; a toggle for the household's own home */
    get homeTypeText() { return this.homeTypeLabel(this.maintenance.homeType || this.homeProfile.homeType || ''); },

    /** Only the top-most open layer closes on Esc */
    closeTopLayer() {
        if (this.rescheduleBookingId) return this.closeReschedule();
        if (this.proposeBooking) return this.closePropose();
        if (this.requestService || this.addonChooser) return this.closeRequest();
        if (this.viewRequest) return this.closeThread();
    },

    formatTime(iso) {
        if (!iso) return '';
        return window.SUKODA_TIME.formatTime(iso, this.lang === 'et' ? 'et-EE' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
    },

        <div x-show="!loading && !authenticated" x-cloak>

            <!-- Minimal nav -->
            <nav class="grid-line-b" aria-label="Main navigation">
                <div class="flex justify-between items-center h-16 md:h-20 px-4 md:px-12">
                    <a href="index.html" class="font-serif text-2xl md:text-3xl tracking-[0.08em] font-light">SUKODA</a>
                    <div class="flex text-[11px] uppercase tracking-[0.16em] font-sans font-medium gap-2">
                        <button @click="lang = 'et'; localStorage.setItem('sukoda_lang', 'et')" :class="lang === 'et' ? 'text-black' : 'text-muted hover:text-black'" class="transition-colors">ET</button>
                        <span class="text-[#D4CFC8]">/</span>
                        <button @click="lang = 'en'; localStorage.setItem('sukoda_lang', 'en')" :class="lang === 'en' ? 'text-black' : 'text-muted hover:text-black'" class="transition-colors">EN</button>
                    </div>
                </div>
            </nav>

            <!-- Login form -->
            <main :id="authenticated ? null : 'main-content'" class="min-h-[80vh] flex items-center justify-center px-4 py-12 md:py-24">
                <div class="max-w-md w-full text-center">

                    <a href="index.html" class="font-serif text-3xl md:text-4xl tracking-[0.08em] font-light inline-block mb-6">SUKODA</a>
                    <div class="accent-line mx-auto mb-8"></div>

                    <h1 class="font-serif text-3xl md:text-4xl font-light mb-3" x-text="lang === 'et' ? 'Minu SUKODA' : 'My SUKODA'"></h1>

                    <!-- Pre-send state -->
                    <div x-show="!loginSent">
                        <p class="text-muted font-sans font-light text-sm mb-10 max-w-sm mx-auto leading-relaxed" x-text="lang === 'et' ? 'Sisesta oma e-post. Saadame sulle privaatse lingi oma SUKODA ruumi.' : 'Enter your email. We\'ll send you a private link to your SUKODA space.'"></p>

                        <form @submit.prevent="sendMagicLink()" class="text-left mb-8">
                            <label class="text-[11px] uppercase tracking-[0.18em] text-muted font-sans block mb-2" x-text="lang === 'et' ? 'E-post' : 'Email'"></label>
                            <input type="email"
                                   x-model="loginEmail"
                                   required
                                   :placeholder="lang === 'et' ? 'sinu@email.ee' : 'your@email.com'"
                                   class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-3 font-sans font-light text-sm transition-colors placeholder:text-[#D4CFC8]">

                            <p x-show="loginError" x-cloak class="text-sm text-red-500 font-sans font-light mt-3" x-text="loginError"></p>

                            <button type="submit"
                                    :disabled="loginSending || !loginEmail"
                                    class="w-full mt-8 bg-black text-paper px-8 py-4 text-xs uppercase tracking-[0.16em] font-sans hover:bg-accent transition-all duration-500 disabled:opacity-50">
                                <span x-show="!loginSending" x-text="lang === 'et' ? 'Saada link' : 'Send link'"></span>
                                <span x-show="loginSending" x-cloak>
                                    <svg class="w-5 h-5 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                </span>
                            </button>
                        </form>
                    </div>

                    <!-- Post-send success -->
                    <div x-show="loginSent" x-cloak x-transition>
                        <div class="w-16 h-16 bg-accent rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <p class="font-serif text-xl font-light mb-2" x-text="lang === 'et' ? 'Kontrolli oma e-posti. Link saadetud.' : 'Check your email. Link sent.'"></p>
                        <p x-show="loginDesk" x-cloak class="text-muted font-sans font-light text-sm max-w-sm mx-auto" x-text="lang === 'et' ? 'See e-post kuulub teenusepakkuja töölauale — link avab sinu töölaua (sukoda.ee/haldus).' : 'This e-mail belongs to a provider desk — the link opens your desk (sukoda.ee/haldus).'"></p>
                    </div>

                    <!-- No subscription CTA -->
                    <div class="border-t border-[#E8E3DD] pt-8 mt-4">
                        <p class="text-muted font-sans font-light text-sm">
                            <span x-text="lang === 'et' ? 'Sul pole veel tellimust?' : 'Don\'t have an order yet?'"></span>
                            <a href="index.html#liitu" class="text-black font-medium hover:text-accent transition-colors ml-1" x-text="lang === 'et' ? 'Alusta siin' : 'Start here'"></a>
                        </p>
                    </div>
                </div>
            </main>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- STATE 2: LOGGED IN                              -->
        <!-- ═══════════════════════════════════════════════ -->
        <div x-show="!loading && authenticated" x-cloak>

            <!-- Navigation -->
            <nav class="sticky top-0 z-50 bg-paper/95 backdrop-blur-sm grid-line-b" aria-label="Main navigation">
                <div class="flex justify-between items-center h-16 md:h-20 px-4 md:px-12">
                    <a href="index.html" class="font-serif text-2xl md:text-3xl tracking-[0.08em] font-light">SUKODA</a>
                    <div class="flex items-center gap-4 md:gap-6">
                        <div class="flex text-[11px] uppercase tracking-[0.16em] font-sans font-medium gap-2">
                            <button type="button" @click="lang = 'et'; localStorage.setItem('sukoda_lang', 'et')" :class="lang === 'et' ? 'text-black' : 'text-muted hover:text-black'" class="transition-colors">ET</button>
                            <span class="text-[#D4CFC8]">/</span>
                            <button type="button" @click="lang = 'en'; localStorage.setItem('sukoda_lang', 'en')" :class="lang === 'en' ? 'text-black' : 'text-muted hover:text-black'" class="transition-colors">EN</button>
                        </div>
                        <button type="button" @click="logout()" class="text-xs uppercase tracking-[0.16em] font-sans font-medium text-muted hover:text-black transition-colors" x-text="lang === 'et' ? 'Logi välja' : 'Log out'"></button>
                    </div>
                </div>
            </nav>

            <!-- Welcome header: the home itself, first — for developer homes with the project picture and the three facts that matter -->
            <div class="grid-line-b">
                <div class="grid lg:grid-cols-12 items-stretch">
                    <div class="px-6 md:px-12 py-8 md:py-12 flex flex-col justify-center" :class="brand?.image ? 'lg:col-span-7' : 'lg:col-span-12'">
                        <div class="accent-line mb-4"></div>
                        <h1 class="font-serif text-3xl md:text-4xl font-light" x-text="(lang === 'et' ? 'Tere, ' : 'Hello, ') + ((viewer?.name || order?.customerName || '').split(' ')[0])"></h1>
                        <p class="text-sm text-muted font-sans font-light mt-3" x-show="(order?.customerAddress || order?.address) || brand?.warrantyUntil">
                            <span x-text="order?.customerAddress || order?.address"></span><span x-show="brand?.warrantyUntil && (order?.customerAddress || order?.address)"> · </span><span x-show="brand?.warrantyUntil" x-text="(lang === 'et' ? 'Garantii kuni ' : 'Warranty until ') + (brand?.warrantyUntil ? window.SUKODA_TIME.formatDate(brand.warrantyUntil + 'T12:00:00', lang === 'et' ? 'et-EE' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '')"></span>
                        </p>
                    </div>
                    <!-- The home. Only with a real project picture from the developer — never a stock interior under the project's name. -->
                    <div x-show="brand?.image" x-cloak class="lg:col-span-5 relative min-h-[220px] lg:min-h-0 border-t lg:border-t-0 lg:border-l border-[#E8E3DD]">
                        <img :src="brand?.image || ''" alt="" class="absolute inset-0 w-full h-full object-cover" loading="eager">
                        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/60 to-transparent px-6 py-4 flex items-end justify-between gap-4">
                            <p class="text-paper font-sans text-sm" x-text="order?.customerAddress || order?.address"></p>
                            <p class="text-paper/80 text-[10px] uppercase tracking-[0.18em] font-sans" x-text="brand?.project"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab navigation: the home portal — cleaning is one service among several -->
            <div class="px-6 md:px-12 grid-line-b overflow-x-auto">
                <div class="flex gap-8 md:gap-12 text-[13px] md:text-sm uppercase tracking-[0.14em] font-sans font-medium whitespace-nowrap">
                    <button @click="activeTab = 'overview'" :class="activeTab === 'overview' ? 'text-black border-b-2 border-accent' : 'text-muted hover:text-black border-b-2 border-transparent'" class="py-4 transition-colors" x-text="lang === 'et' ? 'Ülevaade' : 'Overview'"></button>
                    <button @click="activeTab = 'extras'" :class="activeTab === 'extras' ? 'text-black border-b-2 border-accent' : 'text-muted hover:text-black border-b-2 border-transparent'" class="py-4 transition-colors relative">
                        <span x-text="lang === 'et' ? 'Teenused' : 'Services'"></span>
                        <span x-show="awaitingRequests.length" x-cloak class="absolute top-2 -right-5 bg-accent text-white text-[10px] rounded-full w-[18px] h-[18px] flex items-center justify-center" x-text="awaitingRequests.length"></span>
                    </button>
                    <button @click="activeTab = 'visits'" :class="activeTab === 'visits' ? 'text-black border-b-2 border-accent' : 'text-muted hover:text-black border-b-2 border-transparent'" class="py-4 transition-colors" x-text="lang === 'et' ? 'Kalender' : 'Calendar'"></button>
                    <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'text-black border-b-2 border-accent' : 'text-muted hover:text-black border-b-2 border-transparent'" class="py-4 transition-colors" x-text="lang === 'et' ? 'Minu kodu' : 'My home'"></button>
                </div>
            </div>

            <main id="main-content" class="px-6 md:px-12 py-8 md:py-12">

                <!-- ─────────────────────────────────── -->
                <!-- TAB 1: OVERVIEW                      -->
                <!-- ─────────────────────────────────── -->
                <div x-show="activeTab === 'overview'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
                    <div class="grid lg:grid-cols-12 gap-6 lg:gap-8 items-start">
                        <div class="lg:col-span-8 space-y-6 lg:space-y-8 min-w-0">

                        <!-- Away notice (compact) -->
                        <div x-show="extras.away?.length" x-cloak class="flex items-center justify-between gap-4 bg-amber-50/70 border border-amber-200 px-5 py-4">
                            <p class="text-sm font-sans text-amber-800">
                                <span x-text="lang === 'et' ? 'Eemal: ' : 'Away: '"></span>
                                <span x-text="(extras.away || []).map(p => formatDateShort(p.from) + (p.to !== p.from ? ' – ' + formatDateShort(p.to) : '')).join(' · ')"></span>
                            </p>
                            <button type="button" @click="activeTab = 'visits'" class="text-[11px] uppercase tracking-[0.16em] font-sans text-amber-800 hover:text-black shrink-0" x-text="lang === 'et' ? 'Muuda' : 'Edit'"></button>
                        </div>

                        <!-- Next visit (hero) -->
                        <div x-show="upcomingBookings.length > 0" class="bg-white border border-[#E8E3DD] p-have">
                            <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h"><span class="p-num">01</span><span x-text="lang === 'et' ? 'Järgmine visiit' : 'Next visit'"></span></h2>
                                <button type="button" @click="activeTab = 'visits'" class="text-[11px] uppercase tracking-[0.16em] font-sans text-accent hover:text-black transition-colors" x-text="lang === 'et' ? 'Kalender →' : 'Calendar →'"></button>
                            </div>
                            <div class="p-6 md:p-8 flex flex-wrap items-center justify-between gap-5">
                                <div class="flex items-center gap-5 min-w-0">
                                    <div class="w-16 h-16 rounded-full bg-accent/10 flex flex-col items-center justify-center shrink-0 leading-none">
                                        <span class="font-serif text-3xl text-accent" x-text="dayNumber(upcomingBookings[0]?.scheduledAt)"></span>
                                        <span class="text-[10px] uppercase tracking-[0.14em] text-muted font-sans mt-0.5" x-text="monthShort(upcomingBookings[0]?.scheduledAt)"></span>
                                    </div>
                                    <div class="min-w-0">
                                        <p class="font-serif text-2xl md:text-3xl font-light capitalize leading-tight" x-text="formatDate(upcomingBookings[0]?.scheduledAt)"></p>
                                        <p class="text-base text-muted font-sans font-light mt-1.5"><span class="text-black" x-text="formatTime(upcomingBookings[0]?.scheduledAt)"></span> · <span x-text="visitLabel(upcomingBookings[0])"></span><span x-show="upcomingBookings[0]?.providerName || order?.provider?.name" x-text="' · ' + (upcomingBookings[0]?.providerName || order?.provider?.name)"></span></p>
                                    </div>
                                </div>
                                <span x-show="pendingRescheduleIds.includes(upcomingBookings[0]?.id)" class="inline-flex px-3 py-1.5 text-[10px] uppercase tracking-[0.15em] font-sans text-amber-600 bg-amber-50 rounded-full shrink-0" x-text="lang === 'et' ? 'Uus aeg ootel' : 'New time pending'"></span>
                                <button type="button" x-show="!pendingRescheduleIds.includes(upcomingBookings[0]?.id)" @click="changeTime(upcomingBookings[0])" class="p-btn shrink-0" x-text="lang === 'et' ? 'Muuda aega' : 'Reschedule'"></button>
                            </div>
                            <!-- Small extras belong to the visit, not to a separate list -->
                            <div x-show="visitAddons.length && upcomingBookings[0]?.kind !== 'extra'" x-cloak class="px-6 md:px-8 py-4 border-t border-[#E8E3DD]">
                                <button type="button" @click="openAddonChooser()" class="text-[11px] uppercase tracking-[0.16em] font-sans text-muted hover:text-black" x-text="lang === 'et' ? 'Lisa sellele visiidile →' : 'Add to this visit →'"></button>
                            </div>
                            <!-- Then: the next few, as a compact strip -->
                            <div x-show="upcomingBookings.length > 1" class="border-t border-[#E8E3DD] overflow-hidden">
                                <div class="grid grid-cols-3 sm:grid-cols-[auto_1fr_1fr_1fr] -mr-px">
                                    <div class="hidden sm:flex px-4 md:px-6 py-3 border-r border-[#E8E3DD] bg-cream/30 items-center">
                                        <p class="text-[10px] uppercase tracking-[0.16em] text-muted font-sans" x-text="lang === 'et' ? 'Edasi' : 'Then'"></p>
                                    </div>
                                    <template x-for="b in upcomingBookings.slice(1, 4)" :key="b.id">
                                        <div class="px-4 md:px-6 py-3 border-r border-[#E8E3DD] min-w-0">
                                            <p class="text-sm font-sans truncate" x-text="formatDateShort(b.scheduledAt)"></p>
                                            <p class="text-xs text-muted font-sans font-light truncate"><span x-text="formatTime(b.scheduledAt)"></span> · <span x-text="visitLabel(b)"></span></p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- No upcoming visits -->
                        <div x-show="upcomingBookings.length === 0 && order?.status === 'paid' && !order?.pausedAt" class="bg-white border border-[#E8E3DD] p-8 md:p-10 text-center">
                            <svg class="w-8 h-8 text-muted mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <p class="text-base text-muted font-sans font-light" x-text="lang === 'et' ? 'Visiite pole veel planeeritud' : 'No visits scheduled yet'"></p>
                        </div>

                        <!-- 02 · What needs you: open requests, upkeep that is due, a time waiting for confirmation. One list, no hunting. -->
                        <div class="bg-white border border-[#E8E3DD]">
                            <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h"><span class="p-num">02</span><span x-text="lang === 'et' ? 'Vajab sinu tähelepanu' : 'Needs your attention'"></span></h2>
                                <span x-show="attention.length" class="text-[11px] font-sans text-muted" x-text="attention.length"></span>
                            </div>
                            <div x-show="attention.length" class="divide-y divide-[#E8E3DD]">
                                <template x-for="a in attention" :key="a.key">
                                    <button type="button" @click="a.go()" class="w-full text-left px-6 py-4 flex items-center gap-4 hover:bg-cream/40 transition-colors group">
                                        <span class="w-2.5 h-2.5 rounded-full shrink-0" :class="a.dot"></span>
                                        <span class="min-w-0 flex-1">
                                            <span class="font-sans text-base block truncate" x-text="a.title"></span>
                                            <span class="text-sm text-muted font-sans font-light block truncate" x-text="a.sub"></span>
                                        </span>
                                        <span class="inline-flex px-2.5 py-1 text-[10px] uppercase tracking-[0.14em] font-sans rounded-full shrink-0" :class="a.chipClass" x-text="a.chip"></span>
                                        <svg class="w-4 h-4 text-muted/50 group-hover:text-black transition-colors shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                </template>
                            </div>
                            <p x-show="extrasLoaded && !attention.length" class="px-6 py-8 text-sm text-muted font-sans font-light flex items-center gap-3">
                                <span class="w-2.5 h-2.5 rounded-full bg-green-500 shrink-0"></span>
                                <span x-text="lang === 'et' ? 'Kõik on korras. Midagi ei oota sinu otsust.' : 'All is well. Nothing is waiting on you.'"></span>
                            </p>
                        </div>

                        <!-- 03 · What do you need? Four verbs. Everything else lives under Teenused. -->
                        <div class="bg-white border border-[#E8E3DD]">
                            <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h"><span class="p-num">03</span><span x-text="lang === 'et' ? 'Mida sa vajad?' : 'What do you need?'"></span></h2>
                                <button type="button" @click="activeTab = 'extras'" class="text-[11px] uppercase tracking-[0.16em] font-sans text-accent hover:text-black transition-colors" x-text="lang === 'et' ? 'Kõik teenused →' : 'All services →'"></button>
                            </div>
                            <div class="divide-y divide-[#E8E3DD]">
                                <template x-for="q in quickActions" :key="q.id">
                                    <button type="button" @click="q.go()" class="group w-full text-left px-6 py-4 flex items-baseline justify-between gap-4 hover:bg-cream/40 transition-colors">
                                        <span class="font-sans text-sm font-light" x-text="q.title"></span>
                                        <span class="shrink-0 text-[11px] uppercase tracking-[0.14em] font-sans text-muted group-hover:text-black" x-text="q.cta"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        </div>

                        <aside class="lg:col-span-4 space-y-6 lg:space-y-8 min-w-0">
                        <!-- Home partners -->
                        <div x-show="extrasLoaded && partners.length" x-cloak class="bg-white border border-[#E8E3DD]">
                            <div class="px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h" x-text="lang === 'et' ? 'Kelle poole pöörduda' : 'Who to contact'"></h2>
                            </div>
                            <!-- One entry per role: the housekeeper, the builder's warranty team, the florist … each with a way to reach them -->
                            <div class="divide-y divide-[#E8E3DD]">
                                <template x-for="p in partners" :key="'partner-' + p.category">
                                    <div class="px-6 py-3 flex items-center justify-between gap-4">
                                        <span class="min-w-0">
                                            <span class="block font-sans text-sm truncate" x-text="p.contactName || p.name"></span>
                                            <span class="block text-xs text-muted font-sans font-light truncate" x-text="p.label"></span>
                                        </span>
                                        <span class="flex items-center gap-4 shrink-0">
                                            <a x-show="p.phone" :href="'tel:' + p.phone" class="text-[11px] uppercase tracking-[0.14em] font-sans text-muted hover:text-black" x-text="p.phone"></a>
                                            <button type="button" @click="askPartner(p)" class="text-[11px] uppercase tracking-[0.14em] font-sans text-muted hover:text-black" x-text="lang === 'et' ? 'Kirjuta' : 'Write'"></button>
                                        </span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- The home in four numbers. Developer homes already carry their facts in the header — one place each. -->
                        <div class="border border-[#E8E3DD]" x-show="extrasLoaded && !brand" x-cloak>
                            <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h" x-text="lang === 'et' ? 'Minu kodu' : 'My home'"></h2>
                                <button type="button" @click="activeTab = 'home'" class="text-[11px] uppercase tracking-[0.16em] font-sans text-accent hover:text-black transition-colors" x-text="lang === 'et' ? 'Ava →' : 'Open →'"></button>
                            </div>
                            <div class="grid grid-cols-2 divide-x divide-y divide-[#E8E3DD] -mb-px">
                                <button type="button" @click="activeTab = 'home'; $nextTick(() => document.getElementById('dokumendid')?.scrollIntoView({ behavior: 'smooth', block: 'start' }))" class="p-5 text-left hover:bg-cream/40 transition-colors">
                                    <span class="block font-serif text-2xl font-light leading-none" x-text="documents.items.length"></span>
                                    <span class="block text-[10px] uppercase tracking-[0.14em] text-muted font-sans mt-2" x-text="lang === 'et' ? (documents.items.length === 1 ? 'Dokument kaustas' : 'Dokumenti kaustas') : 'Documents'"></span>
                                </button>
                                <button type="button" @click="activeTab = 'home'; $nextTick(() => document.getElementById('hooldus')?.scrollIntoView({ behavior: 'smooth', block: 'start' }))" class="p-5 text-left hover:bg-cream/40 transition-colors">
                                    <span class="block font-serif text-2xl font-light leading-none" x-text="maintenance.items.length"></span>
                                    <span class="block text-[10px] uppercase tracking-[0.14em] text-muted font-sans mt-2" x-text="lang === 'et' ? (maintenance.items.length === 1 ? 'Hoolduskirje' : 'Hoolduskirjet') : 'Upkeep items'"></span>
                                </button>
                                <button type="button" @click="activeTab = 'home'" class="p-5 text-left hover:bg-cream/40 transition-colors">
                                    <span class="block font-serif text-2xl font-light leading-none" x-text="1 + contacts.length"></span>
                                    <span class="block text-[10px] uppercase tracking-[0.14em] text-muted font-sans mt-2" x-text="lang === 'et' ? 'Saab teateid' : 'Notified'"></span>
                                </button>
                                <button type="button" @click="activeTab = 'home'" class="p-5 text-left hover:bg-cream/40 transition-colors">
                                    <span class="block font-serif text-2xl font-light leading-none" x-text="profileFilled.length + '/' + profileFields.length"></span>
                                    <span class="block text-[10px] uppercase tracking-[0.14em] text-muted font-sans mt-2" x-text="lang === 'et' ? 'Kodu info' : 'Home info'"></span>
                                </button>
                            </div>
                        </div>

                        <!-- Who to talk to: the developer's after-sales team for a developer home, SUKODA otherwise. The building's 24h line only when the developer has set one. -->
                        <p x-show="brand?.emergencyPhone" x-cloak class="text-sm text-muted font-sans font-light px-1">
                            <span x-text="lang === 'et' ? 'Avarii 24h: ' : 'Emergency 24h: '"></span><a :href="'tel:' + (brand?.emergencyPhone || '').replace(/\s+/g, '')" class="text-black hover:text-accent transition-colors" x-text="brand?.emergencyPhone"></a>
                        </p>
                        </aside>
                    </div>
                </div>

                <!-- ─────────────────────────────────── -->
                <!-- TAB 2: HOME PROFILE                  -->
                <!-- ─────────────────────────────────── -->
                <div x-show="activeTab === 'home'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
                    <div class="grid lg:grid-cols-12 gap-6 lg:gap-8 items-start">

                        <div class="lg:col-span-7 space-y-6 lg:space-y-8 min-w-0">

                        <!-- ── Kodu: what the people who come here should know. Reads as a card; edits in place ── -->
                        <div class="bg-white border border-[#E8E3DD]">
                            <div class="flex flex-wrap items-center justify-between gap-3 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h"><span class="p-num">01</span><span x-text="lang === 'et' ? 'Minu kodu' : 'My home'"></span></h2>
                                <!-- Home type: a fact about the home, and it narrows the upkeep suggestions. The developer already knows what it built. -->
                                <div x-show="!brand" class="flex items-center gap-1 text-[11px] uppercase tracking-[0.14em] font-sans shrink-0">
                                    <template x-for="t in ['apartment', 'house', 'summer']" :key="t">
                                        <button type="button" @click="setHomeType(t)" :class="maintenance.homeType === t ? 'bg-black text-paper border-black' : 'border-[#E8E3DD] text-muted hover:text-black'" class="px-3 py-1.5 border transition-colors duration-150" x-text="homeTypeLabel(t)"></button>
                                    </template>
                                </div>
                                <p x-show="brand && homeTypeText" x-cloak class="text-[10px] uppercase tracking-[0.16em] text-muted font-sans shrink-0"><span x-text="homeTypeText"></span><span x-show="brand?.project" x-text="' · ' + brand?.project"></span></p>
                            </div>
                            <div class="p-6 md:p-8">
                                <p class="font-serif text-2xl md:text-3xl font-light leading-snug" x-text="order?.customerAddress || order?.address || (lang === 'et' ? 'Kodu' : 'Home')"></p>
                                <p class="text-sm text-muted font-sans font-light leading-relaxed mt-3 max-w-lg" x-text="lang === 'et' ? 'Koduhooldaja näeb sissepääsu, lemmikuid ja eelistusi igal visiidil.' : 'The housekeeper sees access, pets and preferences on every visit.'"></p>

                                <!-- Read mode -->
                                <div x-show="!profileEditing" class="mt-7">
                                    <!-- Same voice as the service cards: label above, value below, two columns, one rule on top -->
                                    <dl class="grid sm:grid-cols-2 gap-x-8 gap-y-5 pt-5 border-t border-[#E8E3DD]">
                                        <template x-for="f in profileFilled" :key="f.key">
                                            <div :class="f.long ? 'sm:col-span-2' : ''">
                                                <dt class="text-[10px] uppercase tracking-[0.16em] text-muted font-sans mb-1" x-text="f.label"></dt>
                                                <dd class="font-sans text-sm leading-relaxed whitespace-pre-line" x-text="homeProfile[f.key]"></dd>
                                            </div>
                                        </template>
                                    </dl>
                                    <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mt-5">
                                        <button type="button" @click="profileEditing = true" class="text-[11px] uppercase tracking-[0.16em] font-sans font-medium text-accent hover:text-black transition-colors" x-text="lang === 'et' ? 'Muuda' : 'Edit'"></button>
                                        <p x-show="profileFilled.length < profileFields.length" class="text-xs text-muted font-sans font-light" x-text="(lang === 'et' ? 'Täitmata: ' : 'Not filled: ') + profileFields.filter((f) => !(homeProfile[f.key] || '').trim()).map((f) => f.label.toLowerCase()).join(', ')"></p>
                                    </div>
                                </div>

                                <!-- Edit mode -->
                                <form x-show="profileEditing" x-cloak @submit.prevent="saveHomeProfile()" class="mt-7">
                                    <div class="grid sm:grid-cols-2 gap-x-8 gap-y-6">
                                        <template x-for="f in profileFields" :key="f.key">
                                            <label class="block" :class="f.long ? 'sm:col-span-2' : ''">
                                                <span class="text-[11px] uppercase tracking-[0.15em] text-muted font-sans block mb-1.5" x-text="f.label"></span>
                                                <template x-if="f.long"><textarea x-model="homeProfile[f.key]" :placeholder="f.hint" rows="3" maxlength="500" class="w-full bg-transparent border border-[#E8E3DD] focus:border-accent outline-none p-3 font-sans font-light text-base transition-colors placeholder:text-[#D4CFC8] resize-none"></textarea></template>
                                                <template x-if="!f.long"><input type="text" x-model="homeProfile[f.key]" :placeholder="f.hint" maxlength="300" class="w-full bg-transparent border-b border-[#E8E3DD] focus:border-accent outline-none py-2 font-sans font-light text-base transition-colors placeholder:text-[#D4CFC8]"></template>
                                            </label>
                                        </template>
                                    </div>
                                    <div class="flex items-center gap-4 mt-8">
                                        <button type="submit" :disabled="profileSaving" class="p-btn disabled:opacity-50">
                                            <span x-show="!profileSaving" x-text="lang === 'et' ? 'Salvesta' : 'Save'"></span>
                                            <span x-show="profileSaving" x-cloak x-text="lang === 'et' ? 'Salvestan…' : 'Saving…'"></span>
                                        </button>
                                        <button type="button" x-show="profileFilled.length" @click="profileEditing = false" class="text-[11px] uppercase tracking-[0.15em] text-muted hover:text-black font-sans" x-text="lang === 'et' ? 'Loobu' : 'Cancel'"></button>
                                        <span x-show="profileSaved" x-cloak x-transition class="text-green-600 text-sm font-sans font-light" x-text="lang === 'et' ? 'Salvestatud' : 'Saved'"></span>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- ── Hooldusrütm: what the home needs on a rhythm — split by who does it ── -->
                        <div id="hooldus" class="bg-white border border-[#E8E3DD]">
                            <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#E8E3DD]">
                                <h2 class="p-h"><span class="p-num">02</span><span x-text="lang === 'et' ? 'Hooldus' : 'Upkeep'"></span></h2>
                                <span x-show="maintenanceDue" class="inline-flex px-2.5 py-1 text-[11px] uppercase tracking-[0.12em] rounded-full bg-accent/10 text-accent" x-text="maintenanceDue + (lang === 'et' ? ' ootel' : ' due')"></span>
                            </div>
                            <div class="p-6 md:p-8 space-y-10">

                            <div x-show="maintHomeItems.length">
                                <h3 class="font-serif text-2xl font-light mb-2" x-text="lang === 'et' ? 'Sina' : 'You'"></h3>
                                <div>
                                    <template x-for="item in maintHomeItems" :key="item.id">
                                        <div class="border-b border-[#E8E3DD]">
                                            <button type="button" @click="maintOpen = maintOpen === item.id ? null : item.id; if (maintOpen === item.id) $nextTick(() => $el.nextElementSibling && $el.nextElementSibling.scrollIntoView({ behavior: 'smooth', block: 'nearest' }))" class="group w-full text-left py-3 flex items-baseline justify-between gap-4">
                                                <span class="font-sans text-sm font-light" x-text="item.name"></span>
                                                <span class="shrink-0 text-xs font-sans font-light" :class="item.state === 'overdue' ? 'text-red-500' : item.state === 'due' ? 'text-accent' : 'text-muted'" x-text="dueLabel(item)"></span>
                                            </button>
                                            <div x-show="maintOpen === item.id" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="pb-4">
                                                <p x-show="item.hint" class="text-sm text-muted font-sans font-light leading-relaxed" x-text="item.hint"></p>
                                                <p x-show="item.note" class="text-sm font-sans font-light leading-relaxed mt-1" x-text="item.note"></p>
                                                <p class="text-sm text-muted font-sans font-light mt-3">
                                                    <select :value="item.intervalMonths" @change="changeInterval(item, $event.target.value)" class="bg-transparent text-muted outline-none font-light cursor-pointer">
                                                        <template x-for="m in maintenance.intervals" :key="m"><option :value="m" :selected="m === item.intervalMonths" x-text="intervalLabel(m)"></option></template>
                                                    </select>
                                                    <span x-show="item.lastDoneAt" x-text="' · ' + lastDoneLabel(item)"></span>
                                                </p>
                                                <div x-show="maintDoneFor === item.id" x-cloak class="flex flex-wrap items-center gap-3 mt-3">
                                                    <input type="date" x-model="maintDoneDate" :max="maintenance.today" class="border border-[#E8E3DD] bg-white px-3 py-2 text-sm font-sans font-light outline-none focus:border-accent">
                                                    <button type="button" @click="markMaintenanceDone(item, maintDoneDate)" :disabled="!!maintBusy" class="p-btn p-btn-sm disabled:opacity-50" x-text="lang === 'et' ? 'Märgi' : 'Mark'"></button>
                                                </div>
                                                <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mt-4 text-[11px] uppercase tracking-[0.14em] font-sans">
