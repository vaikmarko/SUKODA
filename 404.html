<!DOCTYPE html>
<html lang="et" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <style>[x-cloak] { display: none !important; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUKODA | Lehte ei leitud</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo/icon-s-black.svg">
    <link rel="apple-touch-icon" href="/assets/logo/icon-square.svg">
    <script type="module" src="/assets/js/main.js"></script>
    <link rel="preload" href="/assets/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="antialiased" x-data="notFoundPage()">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[10000] focus:bg-accent focus:text-paper focus:px-4 focus:py-2 focus:text-sm focus:font-sans" x-text="t('skip')">Sisu juurde</a>

    <div class="max-w-[1440px] mx-auto bg-paper min-h-screen border-x border-line flex flex-col">

        <!-- Navigation: name, language, one way in -->
        <nav class="grid-line-b" :aria-label="t('navLabel')">
            <div class="flex justify-between items-center h-16 md:h-20 px-4 md:px-12">
                <a href="/" class="font-serif text-2xl md:text-3xl tracking-[0.08em] font-light">SUKODA</a>
                <div class="flex items-center gap-4 md:gap-6">
                    <div class="flex items-center gap-2 text-xs uppercase tracking-[0.16em] font-sans font-medium" role="group" :aria-label="t('langLabel')">
                        <button type="button" @click="lang = 'et'" :class="{ 'text-black': lang === 'et', 'text-muted hover:text-black': lang !== 'et' }" :aria-pressed="lang === 'et'" class="transition-colors py-2 px-1">ET</button>
                        <span class="text-muted-light" aria-hidden="true">·</span>
                        <button type="button" @click="lang = 'en'" :class="{ 'text-black': lang === 'en', 'text-muted hover:text-black': lang !== 'en' }" :aria-pressed="lang === 'en'" class="transition-colors py-2 px-1">EN</button>
                        <span class="text-muted-light" aria-hidden="true">·</span>
                        <button type="button" @click="lang = 'ru'" :class="{ 'text-black': lang === 'ru', 'text-muted hover:text-black': lang !== 'ru' }" :aria-pressed="lang === 'ru'" class="transition-colors py-2 px-1">RU</button>
                    </div>
                    <a href="/minu" class="p-btn p-btn-sm hidden md:inline-flex" x-text="t('login')">Sisene</a>
                </div>
            </div>
        </nav>

        <!-- 404: what happened, what to do -->
        <main id="main-content" class="flex-1 flex items-center justify-center px-6 py-24 md:py-32">
            <div class="text-center max-w-lg">
                <div class="animate-in">
                    <p class="eyebrow text-accent mb-6">404</p>
                    <h1 class="font-serif text-3xl md:text-4xl font-light mb-6 leading-tight" x-text="t('title')">Sellist lehte ei ole.</h1>
                </div>
                <div class="animate-in-delay">
                    <p class="text-sm text-muted font-sans font-light leading-relaxed mb-10 max-w-sm mx-auto" x-text="t('text')"></p>
                    <a href="/" class="p-btn w-full sm:w-auto sm:min-w-[14rem]" x-text="t('home')">Avalehele</a>
                    <p class="mt-6">
                        <a href="/minu" class="text-sm font-sans font-light text-muted hover:text-black transition-colors border-b border-line hover:border-black" x-text="t('myHome')">Minu kodu</a>
                    </p>
                    <p class="mt-12 text-xs text-muted font-sans font-light">
                        <span x-text="t('questions')"></span>
                        <a href="mailto:tere@sukoda.ee" class="text-muted hover:text-black transition-colors border-b border-line hover:border-black">tere@sukoda.ee</a>
                    </p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-line py-6 px-6 md:px-12">
            <p class="text-xs text-muted font-sans font-light text-center leading-relaxed">
                <span x-text="t('company')"></span>
                <span class="text-muted-light mx-2" aria-hidden="true">·</span>
                <a href="/tingimused" class="hover:text-black transition-colors" x-text="t('terms')"></a>
                <span class="text-muted-light mx-2" aria-hidden="true">·</span>
                <a href="/privaatsus" class="hover:text-black transition-colors" x-text="t('privacy')"></a>
            </p>
        </footer>

    </div>

    <script>
    function notFoundPage() {
        const LANGS = ['et', 'en', 'ru'];
        const saved = localStorage.getItem('sukoda_lang');
        return {
            lang: LANGS.includes(saved) ? saved : 'et',
            T: {
                skip: { et: 'Sisu juurde', en: 'Skip to content', ru: 'К содержимому' },
                navLabel: { et: 'Peamenüü', en: 'Main navigation', ru: 'Главное меню' },
                langLabel: { et: 'Keel', en: 'Language', ru: 'Язык' },
                login: { et: 'Sisene', en: 'Log in', ru: 'Войти' },
                title: { et: 'Sellist lehte ei ole.', en: 'There is no such page.', ru: 'Такой страницы нет.' },
                text: { et: 'Aadress võib olla vale või on leht ära kolinud. Mine avalehele või ava oma kodu.', en: 'The address may be wrong, or the page has moved. Go to the front page or open your home.', ru: 'Возможно, адрес указан неверно или страница переехала. Перейдите на главную или откройте свой дом.' },
                home: { et: 'Avalehele', en: 'Front page', ru: 'На главную' },
                myHome: { et: 'Minu kodu', en: 'My home', ru: 'Мой дом' },
                questions: { et: 'Küsimuste korral kirjuta', en: 'Questions? Write to', ru: 'Есть вопросы? Напишите на' },
                company: { et: '© 2026 SUKODA · Epic Ship OÜ', en: '© 2026 SUKODA · Epic Ship OÜ', ru: '© 2026 SUKODA · Epic Ship OÜ' },
                terms: { et: 'Tingimused', en: 'Terms', ru: 'Условия' },
                privacy: { et: 'Privaatsus', en: 'Privacy', ru: 'Конфиденциальность' },
            },
            t(key, vars) {
                const row = this.T[key] || {};
                const s = row[this.lang] || row.et || key;
                return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : s;
            },
            init() {
                this.$watch('lang', (v) => { localStorage.setItem('sukoda_lang', v); document.documentElement.lang = v; });
                document.documentElement.lang = this.lang;
            },
        };
    }
    </script>

</body>
</html>
