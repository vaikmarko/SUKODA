    <script>
    function devPage() {
        const LANGS = ['et', 'en', 'ru'];
        const saved = localStorage.getItem('sukoda_lang');
        return {
            lang: LANGS.includes(saved) ? saved : 'et',
            T: {
                navLabel: { et: 'Peamenüü', en: 'Main navigation', ru: 'Главное меню' },
                langLabel: { et: 'Keel', en: 'Language', ru: 'Язык' },
                bar: { et: 'Memorandum arendajale · konfidentsiaalne · september 2026', en: 'Memorandum for developers · confidential · September 2026', ru: 'Меморандум для застройщика · конфиденциально · сентябрь 2026' },
                navCta: { et: 'Koostöö sisu', en: 'The offer', ru: 'Условия сотрудничества' },

                heroKicker: { et: 'Koduportaal arendaja ostjatele', en: 'A home portal for a developer\'s buyers', ru: 'Портал дома для покупателей застройщика' },
                heroTitle1: { et: 'Kodu, mis tuleb', en: 'A home that comes', ru: 'Дом, который передаётся' },
                heroTitle2: { et: 'hooldusega.', en: 'with its upkeep.', ru: 'вместе с уходом.' },
                heroLead: {
                    et: 'SUKODA on koduportaal, kus ostja ajad, pere, teenused, dokumendid ja küsimused on ühes kohas, ja töölaud, kus koduhooldaja, remondimees või lillepood neid kodusid teenindab. Portaal ja töölaud on kasutuses päris kodudes.',
                    en: 'SUKODA is a home portal where the buyer\'s times, household, services, documents and questions live in one place, and a desk from which the housekeeper, handyman or florist serves those homes. The portal and the desk are in use in real homes.',
                    ru: 'SUKODA — это портал дома, где время визитов, семья, услуги, документы и вопросы покупателя собраны в одном месте, и рабочий стол, с которого помощница по дому, мастер или цветочный магазин обслуживают эти дома. Портал и рабочий стол уже используются в реальных домах.',
                },
                heroLead2: {
                    et: 'Teie ostja saab võtmetega kaasa kaardi. Kaardi kood avab tema kodu portaalis, mis kannab teie brändi ning töötab teie ehitaja ja teie partneritega.',
                    en: 'Your buyer receives a card together with the keys. The code on the card opens their home in a portal that carries your brand and works with your builder and your partners.',
                    ru: 'Ваш покупатель получает вместе с ключами карту. Код на карте открывает его дом в портале, который носит ваш бренд и работает с вашим строителем и вашими партнёрами.',
                },

                s1Title: { et: 'Mis see on', en: 'What it is', ru: 'Что это' },
                s1Big1: { et: 'Üks koht kodu jaoks.', en: 'One place for the home.', ru: 'Одно место для дома.' },
                s1Big2: { et: 'Üks töölaud neile, kes kodu eest hoolitsevad.', en: 'One desk for those who care for the home.', ru: 'Один рабочий стол для тех, кто заботится о доме.' },
                forOwner: { et: 'Koduomanikule', en: 'For the homeowner', ru: 'Владельцу жилья' },
                forPartner: { et: 'Partnerile', en: 'For the partner', ru: 'Партнёру' },
                s1Quote: {
                    et: 'Kodu keskmes on omanik ja inimesed, kes kodu eest hoolitsevad; platvorm hoiab omaniku ja partnerite suhtluse, ajad ja kokkulepped korras.',
                    en: 'At the centre of the home are the owner and the people who care for it; the platform keeps the communication, times and agreements between owner and partners in order.',
                    ru: 'В центре дома — владелец и люди, которые о нём заботятся; платформа поддерживает порядок в общении, времени визитов и договорённостях между владельцем и партнёрами.',
                },

                s2Title: { et: 'Kuidas portaal töötab', en: 'How the portal works', ru: 'Как работает портал' },
                s2Big1: { et: 'Tõestus ei ole slaid,', en: 'The proof is not a slide,', ru: 'Доказательство — не слайд,' },
                s2Big2: { et: 'vaid kodu, kus portaal iga nädal töötab.', en: 'but a home where the portal works every week.', ru: 'а дом, где портал работает каждую неделю.' },
                s2P1: {
                    et: 'Koduhooldaja avab töölaua, lisab kliendi ja pere kontaktid ning määrab ajad või korduva graafiku. Pere saab ühe kirja kõigi aegadega ja kalendrikutsed. Edaspidi jõuavad muudatused, tühistamised ja meeldetuletused kõigini ise.',
                    en: 'The housekeeper opens a desk, adds the client and the household contacts, and sets the times or a recurring schedule. The household gets one e-mail with all the times and the calendar invites. From then on, changes, cancellations and reminders reach everyone by themselves.',
                    ru: 'Помощница по дому открывает рабочий стол, добавляет клиента и контакты семьи и задаёт время визитов или регулярный график. Семья получает одно письмо со всем расписанием и приглашения в календарь. Дальше изменения, отмены и напоминания приходят всем сами.',
                },
                s2P2: {
                    et: 'Kui pere soovib midagi lisaks, näiteks aknaid, lisavisiiti või lilli külaliste tulekuks, saadab pere soovi portaalist. Koduhooldaja näeb soovi töölaual ning kinnitab aja ja hinna, pere saab kinnituse kalendrikutsega. Kui pere on kuu aega ära, märgib pere eemaloleku portaalis: visiidid jäävad ära, graafik jätab need nädalad vahele ja partner saab teate.',
                    en: 'When the household wants something extra, such as windows, an additional visit or flowers before guests arrive, the household sends the request from the portal. The housekeeper sees the request on the desk and confirms the time and the price; the household gets the confirmation as a calendar invite. When the household is away for a month, the household marks the absence in the portal: the visits are cancelled, the schedule skips those weeks and the partner is notified.',
                    ru: 'Если семье нужно что-то дополнительно, например окна, дополнительный визит или цветы к приходу гостей, семья отправляет пожелание из портала. Помощница по дому видит его на рабочем столе и подтверждает время и цену, семья получает подтверждение приглашением в календарь. Если семьи нет месяц, семья отмечает отсутствие в портале: визиты отменяются, график пропускает эти недели, а партнёр получает уведомление.',
                },
                s2P3: {
                    et: 'Kui koduhooldaja teenusesse kuuluvad värsked lilled, seadistab koduhooldaja poe ühe korra. Tellimus läheb poodi kaks päeva enne iga visiiti koos kliendi eelistusega, koduhooldaja saab meeldetuletuse lilled kaasa võtta ja klient koopia. Keegi ei helista ega kirjuta.',
                    en: 'When fresh flowers are part of the housekeeper\'s service, the housekeeper sets up the shop once. The order goes to the shop two days before every visit together with the client\'s preference; the housekeeper gets a reminder to bring the flowers and the client gets a copy. Nobody calls and nobody writes.',
                    ru: 'Если в услугу помощницы по дому входят свежие цветы, помощница один раз настраивает магазин. Заказ уходит в магазин за два дня до каждого визита вместе с предпочтениями клиента, помощница получает напоминание взять цветы, а клиент — копию. Никто не звонит и не пишет.',
                },
                before: { et: 'Enne', en: 'Before', ru: 'Раньше' },

                s3Title: { et: 'Teie ostjale ja teile', en: 'For your buyer and for you', ru: 'Вашему покупателю и вам' },
                s3Big1: { et: 'Ostja saab võtmetega portaali.', en: 'The buyer gets the portal with the keys.', ru: 'Покупатель получает портал вместе с ключами.' },
                s3Big2: { et: 'Teie saate suhte, mis ei lõpe üleandmisega.', en: 'You get a relationship that does not end at handover.', ru: 'Вы получаете отношения, которые не заканчиваются передачей ключей.' },
                s3P1: {
                    et: 'Iga müüdud kodu on portaalis olemas enne, kui ostja sisse kolib: aadress, plaanid, kasutusjuhendid, garantiitingimused ja majaga seotud partnerid. Ostja sisestab kaardilt koodi, lisab pere ja näeb, kes tema kodu eest hoolitseb.',
                    en: 'Every sold home is in the portal before the buyer moves in: address, plans, manuals, warranty terms and the partners tied to the building. The buyer enters the code from the card, adds the household and sees who cares for their home.',
                    ru: 'Каждый проданный дом есть в портале ещё до заселения покупателя: адрес, планы, инструкции, гарантийные условия и партнёры, связанные с домом. Покупатель вводит код с карты, добавляет семью и видит, кто заботится о его доме.',
                },
                s3P2: {
                    et: 'Garantiiküsimus, koristus, remondimees, lilled ja aed liiguvad kõik sama rada: soov, õige partner, kinnitus koos ajaga, kalendrikutse, tehtud. Partnerid on teie omad: ehitaja garantiimeeskond, lepinguline koristusfirma, haldur. Kui mõnes valdkonnas partnerit ei ole, kogub portaal huvi ja teie näete, mida ostjad tegelikult tahavad.',
                    en: 'A warranty question, cleaning, the handyman, flowers and the garden all follow the same path: request, the right partner, confirmation with a time, calendar invite, done. The partners are yours: the builder\'s warranty team, the contracted cleaning company, the property manager. Where there is no partner yet, the portal collects interest and you see what buyers actually want.',
                    ru: 'Гарантийный вопрос, уборка, мастер, цветы и сад идут по одному пути: пожелание, нужный партнёр, подтверждение со временем, приглашение в календарь, выполнено. Партнёры ваши: гарантийная команда строителя, клининговая компания по договору, управляющий. Если в какой-то области партнёра нет, портал собирает интерес, и вы видите, чего покупатели действительно хотят.',
                },
                s3P3: {
                    et: 'Kõik käib teie brändi all, portaal, kirjad ja kalendrikutsed, ning teie arveldusega: pakett hinna sees, kuutasu või tellimus partneri arvega. Platvorm ei võta vahelt ega sunni peale oma partnereid.',
                    en: 'Everything runs under your brand, the portal, the e-mails and the calendar invites, and with your billing: a package included in the price, a monthly fee or an order invoiced by the partner. The platform takes no cut and imposes no partners of its own.',
                    ru: 'Всё работает под вашим брендом — портал, письма и приглашения в календарь — и с вашими расчётами: пакет в цене, ежемесячная плата или заказ по счёту партнёра. Платформа не берёт комиссию и не навязывает своих партнёров.',
                },

                s4Title: { et: 'Mis on valmis, mis lisandub', en: 'What is ready, what is added', ru: 'Что готово, что добавится' },
                readyTitle: { et: 'Valmis ja kasutuses', en: 'Ready and in use', ru: 'Готово и используется' },
                nextTitle: { et: 'Arendaja kihina lisandub · 4–6 nädalat', en: 'Added as the developer layer · 4–6 weeks', ru: 'Добавится как слой застройщика · 4–6 недель' },
                nextNote: { et: 'Kõik lisanduv ehitub olemasolevale ahelale (kodu, partner, soov, teavitus). Ümberehitust ei ole, on laiendus.', en: 'Everything added builds on the existing chain (home, partner, request, notification). There is no rebuild, only an extension.', ru: 'Всё новое строится на существующей цепочке (дом, партнёр, пожелание, уведомление). Это не переделка, а расширение.' },

                s5Title: { et: 'Tehnoloogia ja üleandmine', en: 'Technology and handover', ru: 'Технология и передача' },
                s5P1: {
                    et: 'Google Firebase (Cloud Functions, Firestore, Hosting) Euroopa regioonis, e-kirjad Resendi kaudu, kalendrikutsed standardse ICS-failiga. Halduskulu on väike ja kasvab kodude arvuga, mitte ette. Partneri kaudu tulevad kodud ei vaja Stripe\'i ega välist kalendriteenust.',
                    en: 'Google Firebase (Cloud Functions, Firestore, Hosting) in the European region, e-mail through Resend, calendar invites as standard ICS files. Running costs are small and grow with the number of homes, not up front. Homes that come through a partner need neither Stripe nor an external calendar service.',
                    ru: 'Google Firebase (Cloud Functions, Firestore, Hosting) в европейском регионе, письма через Resend, приглашения в календарь стандартными файлами ICS. Расходы на эксплуатацию небольшие и растут вместе с числом домов, а не авансом. Домам, подключённым через партнёра, не нужны ни Stripe, ни внешний календарный сервис.',
                },
                s5P2: {
                    et: 'Üleandmine on projekti omaniku vahetus Google\'i organisatsioonis, domeeni ja saatja-aadressi seadistus ning dokumenteeritud koodibaas. Arendaja saab kogu koodi ja andmed, ühtegi komponenti ei jää müüja kontrolli alla.',
                    en: 'Handover means changing the project owner in the Google organisation, setting up the domain and sender address, and a documented codebase. The developer receives all the code and data; no component stays under the seller\'s control.',
                    ru: 'Передача — это смена владельца проекта в организации Google, настройка домена и адреса отправителя и задокументированная кодовая база. Застройщик получает весь код и данные, ни один компонент не остаётся под контролем продавца.',
                },
                s5P3: {
                    et: 'Andmemudel toetab juba mitut partnerit ja rolli: koduomanik, pere kontakt, partner, haldur. Arendaja kiht, organisatsioon, mille alla kuuluvad kodud, partnerid ja bränd, lisandub olemasolevale.',
                    en: 'The data model already supports several partners and roles: homeowner, household contact, partner, property manager. The developer layer, an organisation that owns homes, partners and a brand, is added on top.',
                    ru: 'Модель данных уже поддерживает нескольких партнёров и роли: владелец жилья, контакт семьи, партнёр, управляющий. Слой застройщика — организация, к которой относятся дома, партнёры и бренд, — добавляется поверх существующего.',
                },

                { et: 'Arendaja kiht ehitatakse ühiselt ja kulu jagatakse', en: 'The developer layer is built together and the cost is shared', ru: 'Слой застройщика создаётся совместно, расходы делятся' },
                { et: 'Platvormi areng jätkub ja arendaja saab uuendused kaasa', en: 'The platform keeps developing and the developer receives the updates', ru: 'Платформа продолжает развиваться, застройщик получает обновления' },
            ],
            compareItems: [
                { big: { et: '2 portaali', en: '2 portals', ru: '2 портала' }, small: { et: 'kodu ja partner, kalendrikutsed, teavitused', en: 'home and partner, calendar invites, notifications', ru: 'дом и партнёр, приглашения в календарь, уведомления' } },
                { big: { et: '9–12 kuud', en: '9–12 months', ru: '9–12 месяцев' }, small: { et: 'tiimiga, enne esimest päris kodu', en: 'with a team, before the first real home', ru: 'с командой, до первого реального дома' } },
                { big: { et: 'Katse-eksitus', en: 'Trial and error', ru: 'Метод проб и ошибок' }, small: { et: 'graafikud, pühad, eemalolekud ja tühistamised on juba läbitud', en: 'schedules, holidays, absences and cancellations are already solved', ru: 'графики, праздники, отсутствия и отмены уже пройдены' } },
            ],
            t(key, vars) {
                const row = this.T[key] || {};
                const s = row[this.lang] || row.et || key;
                return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : s;
            },
            pick(obj) {
                if (!obj) return '';
                return obj[this.lang] || obj.et || '';
            },
            init() {
                this.$watch('lang', (v) => { localStorage.setItem('sukoda_lang', v); document.documentElement.lang = v; });
                document.documentElement.lang = this.lang;
            },
        };
    }
