<style>

a{color:#141312}a:hover{color:#5F5A54}

.seg{height:48px;border-radius:14px;border:1px solid #D1C9BF;background:#fff;color:#141312;font:500 15px Inter,sans-serif;cursor:pointer}

.sw{width:48px;height:28px;border-radius:999px;border:1px solid #D1C9BF;background:#fff;position:relative;padding:0;cursor:pointer}

.b1{display:flex;align-items:center;justify-content:center;height:56px;border-radius:16px;background:#141312;color:#FAF8F5;font:600 16px Inter,sans-serif;border:0;padding:0 28px;cursor:pointer}
