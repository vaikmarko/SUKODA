<!DOCTYPE html>
<html lang="et" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <style>[x-cloak] { display: none !important; } html { font-size: 17px; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SUKODA | Töölaud</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/icons/desk-192.png">
    <link rel="apple-touch-icon" href="/icons/desk-180.png">
    <link rel="manifest" href="/manifest-desk.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Töölaud">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).catch(function () {});
      }
    </script>
    <script src="/push.js"></script>
    <link rel="preload" href="/assets/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <script type="module" src="/assets/js/main.js"></script>
    <style>
        .h-input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--color-line); padding: 10px 0; font-size: 15px; font-weight: 300; outline: none; transition: border-color .2s; }
        .h-input:focus { border-color: var(--color-accent); }
        .h-select { width: 100%; background: #fff; border: 1px solid var(--color-line); padding: 10px 12px; font-size: 15px; font-weight: 300; outline: none; }
        .h-select:focus { border-color: var(--color-accent); }
        .h-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .18em; color: var(--color-muted); margin-bottom: 6px; }
        .p-btn:disabled, .p-btn-2:disabled { opacity: .45; cursor: not-allowed; }
        /* Quiet inline action (text only) — same voice as .p-btn, no frame */
        .h-link { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 .25rem; font-size: 11px; text-transform: uppercase; letter-spacing: .15em; font-weight: 500; color: var(--color-muted); transition: color .3s; }
        .h-link:hover { color: var(--color-black); }
        .h-link-accent { color: var(--color-accent); }
        .h-link:disabled { opacity: .45; cursor: not-allowed; }
        .h-chip { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; padding: 3px 8px; border-radius: 999px; }
        .cal-cell { min-height: 84px; }
        @media (max-width: 767px) { .cal-cell { min-height: 56px; } }
    </style>
</head>
<body class="antialiased" x-data="haldusApp()" x-init="init()">

    <div class="max-w-[1200px] mx-auto bg-paper min-h-screen border-x border-line">

        <!-- Loading -->
        <div x-show="loading" class="min-h-screen flex items-center justify-center">
            <div class="w-10 h-10 border border-accent border-t-transparent rounded-full animate-spin"></div>
        </div>

        <!-- ═══════════════ LOGIN ═══════════════ -->
        <div x-show="!loading && !authenticated" x-cloak>
            <nav class="grid-line-b" aria-label="Main navigation">
                <div class="flex justify-between items-center h-16 md:h-20 px-4 md:px-12">
                    <a href="/" class="font-serif text-2xl md:text-3xl tracking-[0.08em] font-light">SUKODA</a>
                    <div class="flex items-center gap-1" role="group" :aria-label="t('langLabel')">
                        <button type="button" @click="setLang('et')" class="text-xs font-sans py-3 px-2" :class="{ 'text-black': lang !== 'en', 'text-muted': lang === 'en' }" :aria-pressed="lang !== 'en'">ET</button>
                        <button type="button" @click="setLang('en')" class="text-xs font-sans py-3 px-2" :class="{ 'text-black': lang === 'en', 'text-muted': lang !== 'en' }" :aria-pressed="lang === 'en'">EN</button>
                    </div>
                </div>
            </nav>
            <main class="min-h-[80vh] flex items-center justify-center px-4 py-12 md:py-24">
                <div class="max-w-md w-full text-center">
                    <p class="eyebrow mb-3">Töölaud</p>
                    <h1 class="font-serif text-3xl md:text-4xl font-light mb-3" x-text="signupMode && !loginSent ? t('signupTitle') : t('loginTitle')"></h1>
                    <p x-show="globalError" x-cloak class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 text-sm font-sans text-left" x-text="globalError"></p>

                    <div x-show="!loginSent && !signupMode">
                        <p class="text-muted font-sans font-light text-sm mb-10 max-w-sm mx-auto leading-relaxed" x-text="t('loginLead')"></p>
                        <form @submit.prevent="sendMagicLink()" class="text-left mb-8">
                            <label class="h-label" for="login-email" x-text="t('emailLabel')"></label>
                            <input id="login-email" type="email" x-model="loginEmail" required autocomplete="email" class="h-input font-sans">
                            <p x-show="loginError" x-cloak class="text-sm text-red-500 font-sans font-light mt-3" x-text="loginError"></p>
                            <button type="submit" :disabled="loginSending || !loginEmail" class="p-btn w-full mt-8" x-text="loginSending ? t('sending') : t('sendLink')"></button>
                        </form>
                    </div>
                    <!-- Self-serve onboarding: a partner opens their own desk, link arrives at once -->
                    <div x-show="!loginSent && signupMode" x-cloak>
                        <p class="text-muted font-sans font-light text-sm mb-8 max-w-sm mx-auto leading-relaxed" x-text="t('signupLead')"></p>
                        <form @submit.prevent="signup()" class="text-left mb-8 space-y-5">
                            <div class="grid sm:grid-cols-2 gap-4">
                                <div><label class="h-label" x-text="t('nameLabel')"></label><input type="text" x-model="signupForm.name" required autocomplete="name" class="h-input font-sans"></div>
                                <div><label class="h-label" x-text="t('companyOpt')"></label><input type="text" x-model="signupForm.businessName" autocomplete="organization" class="h-input font-sans"></div>
                            </div>
                            <div class="grid sm:grid-cols-2 gap-4">
                                <div><label class="h-label" x-text="t('emailLabel')"></label><input type="email" x-model="signupForm.email" required autocomplete="email" class="h-input font-sans"></div>
                                <div><label class="h-label" x-text="t('phoneOpt')"></label><input type="tel" x-model="signupForm.phone" autocomplete="tel" class="h-input font-sans"></div>
                            </div>
                            <div>
                                <p class="h-label" x-text="t('offerLabel')"></p>
                                <div class="flex flex-wrap gap-2 mt-1">
                                    <template x-for="o in signupServices" :key="o.id">
                                        <button type="button" @click="toggleSignupService(o.id)" :class="signupForm.services.includes(o.id) ? 'bg-black text-paper border-black' : 'border-line-strong text-muted hover:text-black'" class="min-h-11 px-3 border text-sm font-light transition-colors" :aria-pressed="signupForm.services.includes(o.id)" x-text="t(o.key)"></button>
                                    </template>
                                </div>
                            </div>
                            <div><label class="h-label" x-text="t('areaLabel')"></label><input type="text" x-model="signupForm.city" :placeholder="t('areaPh')" class="h-input font-sans"></div>
                            <p x-show="loginError" x-cloak class="text-sm text-red-500 font-sans font-light" x-text="loginError"></p>
                            <button type="submit" :disabled="loginSending || !signupForm.name || !signupForm.email" class="p-btn w-full" x-text="loginSending ? t('opening') : t('openDesk')"></button>
                            <p class="text-xs text-muted font-sans font-light leading-relaxed" x-text="t('signupPricing')"></p>
                        </form>
                    </div>
                    <div x-show="loginSent" x-cloak x-transition>
                        <p class="font-serif text-xl font-light mb-2" x-text="t('linkSent')"></p>
                        <p x-show="loginPortal" x-cloak class="text-muted font-sans font-light text-sm mb-2" x-text="t('linkIsHome')"></p>
                        <p class="text-muted font-sans font-light text-sm"><span x-text="t('linkMissing')"></span> <a href="mailto:tere@sukoda.ee" class="text-black">tere@sukoda.ee</a></p>
                    </div>
                    <div class="border-t border-line pt-8 mt-8" x-show="!loginSent">
                        <button type="button" @click="signupMode = !signupMode; loginError = ''" class="h-link h-link-accent mx-auto" x-text="signupMode ? t('haveAccess') : t('newHere')"></button>
                    </div>
                </div>
            </main>
        </div>

        <!-- ═══════════════ APP ═══════════════ -->
        <div x-show="!loading && authenticated" x-cloak>

            <nav class="sticky top-0 z-40 bg-paper/95 backdrop-blur-sm grid-line-b" aria-label="Main navigation">
                <div class="flex justify-between items-center h-16 md:h-20 px-4 md:px-12">
                    <div class="flex items-center gap-3">
                        <a href="/" class="font-serif text-2xl md:text-3xl tracking-[0.08em] font-light">SUKODA</a>
                        <span class="eyebrow text-accent hidden sm:inline">Töölaud</span>
                    </div>
                    <div class="flex items-center gap-2 md:gap-4">
                        <button type="button" @click="loadData()" :disabled="refreshing" class="h-link" x-text="refreshing ? t('refreshing') : t('refresh')"></button>
                        <button type="button" @click="logout()" class="h-link" x-text="t('logOut')"></button>
                    </div>
                </div>
            </nav>

            <div class="px-4 md:px-12 py-4 grid-line-b">
                <p class="font-serif text-2xl font-light" x-text="t('greet', { name: greetName() })"></p>
            </div>

            <!-- Tabs -->
            <div class="px-4 md:px-12 grid-line-b flex items-stretch">
                <div class="flex-1 overflow-x-auto">
                    <div class="flex gap-4 md:gap-12 text-xs uppercase tracking-wide md:tracking-[0.16em] font-sans font-medium whitespace-nowrap">
                        <template x-for="tab in tabs" :key="tab.id">
                            <button type="button" @click="activeTab = tab.id" :class="activeTab === tab.id ? 'text-black border-b-2 border-accent' : 'text-muted hover:text-black'" class="pb-4 pt-4 transition-colors relative" :aria-current="activeTab === tab.id ? 'page' : null">
                                <span x-text="t(tab.key)"></span>
                                <span x-show="tab.id === 'requests' && pendingRequests.length" class="absolute top-2 -right-5 bg-accent text-white text-xs rounded-full w-5 h-5 flex items-center justify-center" x-text="pendingRequests.length" :aria-label="t('newWishes', { n: pendingRequests.length })"></span>
                            </button>
                        </template>
                    </div>
                </div>
                <div class="flex items-center gap-1 shrink-0 pl-4" role="group" :aria-label="t('langLabel')">
                    <button type="button" @click="setLang('et')" class="text-xs font-sans py-3 px-2" :class="{ 'text-black': lang !== 'en', 'text-muted': lang === 'en' }" :aria-pressed="lang !== 'en'">ET</button>
                    <button type="button" @click="setLang('en')" class="text-xs font-sans py-3 px-2" :class="{ 'text-black': lang === 'en', 'text-muted': lang !== 'en' }" :aria-pressed="lang === 'en'">EN</button>
                </div>
            </div>

            <main class="px-4 md:px-12 py-6 md:py-10">
                <section id="push-offer" hidden class="border border-line bg-paper p-4 mb-6 max-w-xl">
                    <p class="eyebrow" data-push-label></p>
                    <p class="text-sm text-muted font-sans font-light mt-2" data-push-lead></p>
                    <div class="flex gap-3 mt-4">
                        <button type="button" class="p-btn" data-push-allow></button>
                        <button type="button" class="p-btn-2" data-push-later></button>
                    </div>
                </section>

                <p x-show="globalError" x-cloak class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 text-sm font-sans" x-text="globalError"></p>
                <p x-show="toast" x-cloak x-transition class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] bg-black text-paper px-6 py-3 text-xs font-sans tracking-wide shadow-lg" x-text="toast"></p>

                <!-- ─────────── TÄNA ─────────── -->
                <div x-show="activeTab === 'today'">
                    <div class="max-w-3xl">
                        <p class="font-serif text-xl font-light capitalize mb-4" x-text="todayHeading()"></p>
                        <div x-show="todayVisits.length === 0" class="border border-line bg-cream/40 p-8 text-center">
                            <p class="text-sm text-muted font-sans" x-text="t('todayEmpty')"></p>
                            <button type="button" @click="activeTab = 'calendar'" class="p-btn-2 mt-4" x-text="t('openCalendar')"></button>
                        </div>
                        <div x-show="unmarkedPast.length" class="border border-line bg-paper p-4 mb-4">
                            <p class="eyebrow" x-text="t('unmarkedTitle')"></p>
                            <p class="text-sm text-muted font-sans mt-1" x-text="t('unmarkedLead')"></p>
                            <div class="mt-3 space-y-2">
                                <template x-for="b in unmarkedPast.slice(0, 5)" :key="b.id">
                                    <div class="flex items-center justify-between gap-3 text-sm font-sans">
                                        <span class="font-light min-w-0 truncate"><span x-text="fmtDateShort(b.scheduledAt)"></span> · <span x-text="b.customerName"></span></span>
                                        <div class="flex gap-2 shrink-0">
                                            <button type="button" @click="completeVisit(b)" :disabled="todaySavingId === b.id" class="h-link h-link-accent" x-text="todaySavingId === b.id ? t('saving') : t('done')"></button>
                                            <button type="button" @click="cancelVisit(b)" :disabled="todaySavingId === b.id" class="h-link" x-text="t('didNotHappen')"></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <template x-for="b in todayVisits" :key="b.id">
                                <article class="border border-line bg-paper p-4">
                                    <p class="font-sans text-sm text-muted" x-text="visitWhen(b)"></p>
                                    <h3 class="font-serif text-2xl font-light mt-1" x-text="b.customerName"></h3>
                                    <a x-show="addressFor(b)" :href="mapsHref(addressFor(b))" target="_blank" rel="noopener" class="text-sm font-sans text-black underline underline-offset-4 mt-1 inline-block" :aria-label="t('openMap')" x-text="addressFor(b)"></a>
                                    <template x-if="accessVisible(b)">
                                        <div class="mt-4">
                                            <p class="eyebrow" x-text="t('access')"></p>
                                            <p class="font-serif text-2xl font-light mt-1" x-text="entranceCode(b)"></p>
                                        </div>
                                    </template>
                                    <p x-show="hasAccess(b) && !accessVisible(b)" class="text-sm text-muted font-sans mt-4" x-text="t('accessLater')"></p>
                                    <a x-show="residentPhone(b)" :href="telHref(residentPhone(b))" class="p-btn-2 w-full mt-4" x-text="t('call') + ' · ' + residentPhone(b)"></a>
                                    <div x-show="jobText(b)" class="mt-4">
                                        <p class="eyebrow" x-text="t('jobLabel')"></p>
                                        <p class="text-sm font-sans font-light mt-1" x-text="jobText(b)"></p>
                                    </div>
                                    <a x-show="jobPhoto(b)" :href="jobPhoto(b)" target="_blank" rel="noopener" class="text-sm font-sans underline underline-offset-4 mt-4 mr-4 inline-block" x-text="t('jobPhoto')"></a>
                                    <a x-show="floorPlanFor(b)" :href="floorPlanFor(b)" target="_blank" rel="noopener" class="text-sm font-sans underline underline-offset-4 mt-4 inline-block" x-text="t('floorPlan')"></a>
                                    <div x-show="passFact(b, 'water')" class="mt-4">
                                        <p class="eyebrow" x-text="t('waterMain')"></p>
                                        <p class="text-sm font-sans font-light mt-1" x-text="passFact(b, 'water')"></p>
                                    </div>
                                    <div x-show="passFact(b, 'panel')" class="mt-4">
                                        <p class="eyebrow" x-text="t('breaker')"></p>
                                        <p class="text-sm font-sans font-light mt-1" x-text="passFact(b, 'panel')"></p>
                                    </div>
                                    <div x-show="todayTasks(b).length" class="mt-4">
                                        <p class="eyebrow" x-text="t('todayList')"></p>
                                        <ul class="mt-2 space-y-1">
                                            <template x-for="(line, i) in todayTasks(b)" :key="b.id + '-' + i">
                                                <li class="text-sm font-sans font-light" x-text="line"></li>
                                            </template>
                                        </ul>
                                    </div>
                                    <div x-show="standingNote(b)" class="mt-4">
                                        <p class="eyebrow" x-text="t('standing')"></p>
                                        <p class="text-sm font-sans font-light mt-1" x-text="standingNote(b)"></p>
                                    </div>
                                    <p x-show="bringLine(b)" class="text-sm font-sans mt-4" x-text="bringLine(b)"></p>
                                    <label class="block mt-4">
                                        <span class="eyebrow" x-text="t('noteLabel')"></span>
                                        <textarea rows="2" class="h-input resize-none font-sans mt-1" :placeholder="t('notePh')" :value="todayNotes[b.id] || ''" @input="todayNotes[b.id] = $event.target.value"></textarea>
                                    </label>
                                    <button type="button" class="p-btn w-full mt-4" :disabled="todaySavingId === b.id" @click="markTodayDone(b)" x-text="todaySavingId === b.id ? t('saving') : t('done')"></button>
                                    <button type="button" class="h-link w-full mt-2 justify-center" :disabled="todaySavingId === b.id" @click="markNoEntry(b)" x-text="t('noEntry')"></button>
                                </article>
                            </template>
                        </div>
                        <button type="button" @click="openVisitModal({ date: todayStr })" class="h-link h-link-accent mt-4" x-text="t('addVisit')"></button>
                    </div>
                </div>

                <!-- ─────────── KALENDER ─────────── -->
                <div x-show="activeTab === 'calendar'">
                    <div class="flex items-center justify-between mb-6">
                        <button type="button" @click="calPrev()" class="w-11 h-11 flex items-center justify-center hover:bg-cream rounded-full" :aria-label="t('prevMonth')"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg></button>
                        <h2 class="font-serif text-2xl font-light" x-text="calMonthLabel"></h2>
                        <button type="button" @click="calNext()" class="w-11 h-11 flex items-center justify-center hover:bg-cream rounded-full" :aria-label="t('nextMonth')"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/></svg></button>
                    </div>
                    <div class="grid grid-cols-7 border-t border-l border-line text-center">
                        <template x-for="(d, i) in calDays()" :key="i"><div class="py-2 border-r border-b border-line eyebrow" x-text="d"></div></template>
                    </div>
                    <div class="grid grid-cols-7 border-l border-line">
                        <template x-for="(cell, i) in calCells" :key="i">
                            <button type="button" @click="cell.date && selectDay(cell.date)"
                                    :class="{ 'bg-cream/40': cell.date && cell.date < todayStr, 'bg-accent/10': cell.date === selectedDay, 'ring-1 ring-inset ring-accent': cell.date === todayStr }"
                                    class="cal-cell border-r border-b border-line p-1.5 text-left align-top hover:bg-cream/60 transition-colors disabled:cursor-default" :disabled="!cell.date" :aria-label="cell.date ? fmtDateLong(cell.date) + (cell.holiday ? ' · ' + cell.holiday : '') : null" :aria-pressed="cell.date ? cell.date === selectedDay : null">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-sans" :class="cell.date === todayStr ? 'text-accent font-medium' : 'text-muted'" x-text="cell.day"></span>
                                    <span x-show="cell.holiday" class="w-1.5 h-1.5 rounded-full bg-red-400" :title="cell.holiday"></span>
                                </div>
                                <div class="mt-1 space-y-0.5">
                                    <template x-for="b in cell.items.slice(0, 3)" :key="b.id">
                                        <div class="truncate text-xs font-sans px-1 py-0.5 rounded" :class="chipClass(b)"><span class="hidden md:inline" x-text="fmtTime(b.scheduledAt) + ' '"></span><span x-text="firstName(b.customerName)"></span></div>
                                    </template>
                                    <div x-show="cell.items.length > 3" class="text-xs text-muted font-sans px-1">+<span x-text="cell.items.length - 3"></span></div>
                                </div>
                            </button>
                        </template>
                    </div>

                    <div x-show="selectedDay" x-cloak class="mt-8 max-w-3xl">
                        <div class="flex items-center justify-between gap-3 mb-4">
                            <p class="font-serif text-xl font-light capitalize"><span x-text="fmtDateLong(selectedDay)"></span><span x-show="holidayName(selectedDay)" class="text-red-500 text-sm font-sans ml-3" x-text="holidayName(selectedDay)"></span></p>
                            <button type="button" @click="openVisitModal({ date: selectedDay })" class="p-btn-2 shrink-0" x-text="t('addVisit')"></button>
                        </div>
                        <div x-show="dayVisits(selectedDay).length === 0" class="bg-cream/40 border border-line p-6 text-center text-sm text-muted font-sans font-light" x-text="t('calEmpty')"></div>
                        <div class="space-y-2">
                            <template x-for="b in dayVisits(selectedDay)" :key="b.id">
                                <div x-html="visitCard(b)" @click="handleCardClick($event, b)"></div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- ─────────── KLIENDID ─────────── -->
                <div x-show="activeTab === 'customers'">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                        <input type="text" x-model="customerSearch" :placeholder="t('searchHomes')" :aria-label="t('searchHomes')" class="h-input font-sans sm:max-w-xs">
                        <button type="button" x-show="isCleaningProvider && (filteredCustomers.length || customerSearch)" @click="openCustomerModal()" class="p-btn" x-text="t('addClient')"></button>
                    </div>
                    <div x-show="filteredCustomers.length === 0" class="bg-cream/40 border border-line p-10 text-center">
                        <p class="font-serif text-xl font-light mb-2" x-text="customerSearch ? t('homesNoMatch') : t('homesEmpty')"></p>
                        <p class="text-sm text-muted font-sans font-light" x-show="isCleaningProvider && !customerSearch" x-text="t('homesEmptyAdd')"></p>
                        <p class="text-sm text-muted font-sans font-light" x-show="!isCleaningProvider && !customerSearch" x-text="t('homesEmptyAssigned')"></p>
                        <button type="button" x-show="isCleaningProvider && !customerSearch" @click="openCustomerModal()" class="p-btn mt-6" x-text="t('addClient')"></button>
                    </div>
                    <div class="grid md:grid-cols-2 gap-3">
                        <template x-for="c in filteredCustomers" :key="c.id">
                            <button type="button" @click="openCustomerDetail(c)" class="bg-white border border-line p-5 text-left w-full hover:bg-cream/40 transition-colors">
                                <p class="eyebrow mb-1" x-text="clientSource(c)"></p>

            nextWeekday(weekday) {
                const today = this.todayStr || new Date().toISOString().slice(0, 10);
                const [y, m, d] = today.split('-').map(Number);
                const base = new Date(Date.UTC(y, m - 1, d, 12));
                let add = (Number(weekday) - base.getUTCDay() + 7) % 7;

            addMonthsStr(dateStr, n) {
                const [y, m, d] = String(dateStr || '').split('-').map(Number);

                dt.setUTCMonth(dt.getUTCMonth() + Number(n || 0));
                const last = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
                dt.setUTCDate(Math.min(d, last));

            /** First day on or after `start` that is a working day, not a public holiday and not yet full */
            firstFreeDay(start) {
                const days = this.availForm.days.length ? this.availForm.days : [1, 2, 3, 4, 5];
                const max = Number(this.availForm.maxPerDay) || 4;
                let date = start;
                for (let i = 0; i < 60; i++) {
                    const [y, m, d] = date.split('-').map(Number);
                    let dow = new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay(); if (dow === 0) dow = 7;
                    const busy = this.liveBookings.filter((b) => this.dateOf(b.scheduledAt) === date).length;

                return start;

                let date = r.preferredDate || T().shiftDateString(this.todayStr, 2);
                if (date < this.todayStr) date = T().shiftDateString(this.todayStr, 1);

                let dur = r.type === 'reschedule' && r.targetBookingId ? (() => { const b = this.bookings.find((x) => x.id === r.targetBookingId); return b ? Math.round((new Date(b.endTime) - new Date(b.scheduledAt)) / 60000) : 180; })() : (svc?.durationMin || 60);
                if (!this.durationOptions.includes(dur)) dur = 60;
                const includedPrice = this.termsIncluded(r) && r.kind !== 'issue' && r.category !== 'warranty' ? this.t('termsIncluded') : '';
                this.confirmModal = { open: true, request: r, date, time: tw, durationMin: dur, price: includedPrice, message: '', force: false, conflicts: [], error: '', saving: false };
            },
            async confirmRequest() {
                const m = this.confirmModal; if (m.saving) return; m.saving = true; m.error = '';
                try {
                    // Included by the home's terms → the client already sees "hinnas sees"; never send an invented price
                    const res = await this.api('/api/haldus/requests/confirm', { method: 'POST', body: JSON.stringify({ requestId: m.request.id, date: m.date, time: m.time, durationMin: m.durationMin, price: this.termsIncluded(m.request) ? '' : m.price, message: m.message, force: m.force }) });
                    const d = await res.json().catch(() => ({}));
                    if (res.status === 409 && d.code === 'CONFLICT') { m.conflicts = d.conflicts || []; return; }
                    if (res.status === 401) { this.logout(); return; }
                    if (!res.ok) throw new Error(this.errText(d, this.t('actionFailed')));
                    m.open = false; this.showToast(this.t('confirmedToast'));
                    await this.loadData(this.range.from, this.range.to);
                } catch (e) { m.error = e.message; } finally { m.saving = false; }
            },
            replyRequest(r) {
                this.openMsgModal({
                    title: this.t('replyTitle'),
                    subtitle: `${r.serviceName} · ${r.customerName}`,
                    hint: this.t('msgHint'),
                    placeholder: this.t('replyPh'), button: this.t('replySend'),
                    submit: async (message) => {
                        const res = await this.api('/api/haldus/requests/reply', { method: 'POST', body: JSON.stringify({ requestId: r.id, message }) });
                        await this.okJson(res, this.t('sendFailed'));
                        this.showToast(this.t('replySent'));
                        await this.loadData(this.range.from, this.range.to);
                    },
                });
            },
            /** Follow-up on an already handled request — the thread stays open both ways */
            messageRequest(r) {
                this.openMsgModal({
                    title: this.t('writeClient'),
                    subtitle: `${r.serviceName} · ${r.customerName}`,
                    hint: this.t('writeHint'),
                    placeholder: this.t('writePh'), button: this.t('send'),
                    submit: async (text) => {
                        const res = await this.api('/api/haldus/requests/message', { method: 'POST', body: JSON.stringify({ requestId: r.id, text }) });
                        await this.okJson(res, this.t('sendFailed'));
                        this.showToast(this.t('messageSent'));
                        await this.loadData(this.range.from, this.range.to);
                    },
                });
            },
            declineRequest(r) {
                const issue = r.kind === 'issue';
                this.openMsgModal({
                    title: issue ? this.t('notWarranty') : this.t('decline'),
                    subtitle: `${r.serviceName} · ${r.customerName}`,
                    hint: issue ? this.t('declineIssueHint') : this.t('declineHint'),
                    placeholder: issue ? this.t('declinePhIssue') : this.t('declinePhTime'), button: this.t('sendToClient'), required: issue,
                    submit: async (message) => {
                        const res = await this.api('/api/haldus/requests/decline', { method: 'POST', body: JSON.stringify({ requestId: r.id, message }) });
                        await this.okJson(res, this.t('sendFailed'));
                        this.showToast(this.t('sentToClient'));
                        await this.loadData(this.range.from, this.range.to);
                    },
                });
            },
        };
    }
    </script>
</body>
</html>
