<!DOCTYPE html>
<html lang="et" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <style>[x-cloak] { display: none !important; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUKODA | Ava oma kodu</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo/icon-s-black.svg">
    <link rel="apple-touch-icon" href="/assets/logo/icon-square.svg">
    <script type="module" src="/assets/js/main.js"></script>
    <link rel="preload" href="/assets/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* Form fields: one line under the text, tokens only */
        .l-input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--color-line); padding: 10px 0; font-size: 0.875rem; font-weight: 300; outline: none; transition: border-color .2s; border-radius: 0; }
        .l-input:focus { border-color: var(--color-accent); }
        .l-code { font-family: var(--font-serif); font-size: 1.5rem; letter-spacing: .18em; text-transform: uppercase; text-align: center; font-weight: 300; }
    </style>
</head>
<body class="antialiased" x-data="lunastaApp()">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[10000] focus:bg-accent focus:text-paper focus:px-4 focus:py-2 focus:text-sm focus:font-sans" x-text="t('skip')">Sisu juurde</a>

    <div class="max-w-[1440px] mx-auto bg-paper min-h-screen border-x border-line flex flex-col">

        <!-- Nav: only the name and the language. Nothing to learn here. -->
        <nav class="grid-line-b" :aria-label="t('navLabel')">
            <div class="flex justify-between items-center h-16 md:h-20 px-4 md:px-12">
                <a href="/" class="font-serif text-2xl md:text-3xl tracking-[0.08em] font-light">SUKODA</a>
                <div class="flex items-center gap-2 text-xs uppercase tracking-[0.16em] font-sans font-medium" role="group" :aria-label="t('langLabel')">
                    <button type="button" @click="lang = 'et'" :class="{ 'text-black': lang === 'et', 'text-muted hover:text-black': lang !== 'et' }" :aria-pressed="lang === 'et'" class="transition-colors py-2 px-1">ET</button>
                    <span class="text-muted-light" aria-hidden="true">·</span>
                    <button type="button" @click="lang = 'en'" :class="{ 'text-black': lang === 'en', 'text-muted hover:text-black': lang !== 'en' }" :aria-pressed="lang === 'en'" class="transition-colors py-2 px-1">EN</button>
                    <span class="text-muted-light" aria-hidden="true">·</span>
                    <button type="button" @click="lang = 'ru'" :class="{ 'text-black': lang === 'ru', 'text-muted hover:text-black': lang !== 'ru' }" :aria-pressed="lang === 'ru'" class="transition-colors py-2 px-1">RU</button>
                </div>
            </div>
        </nav>

        <!-- The card code opens a home: Arco handover card (welcome), a housekeeper's invitation (invite) or an old gift card (legacy) -->
        <main id="main-content" class="flex-1 flex items-start md:items-center justify-center px-6 py-12 md:py-24">
            <div class="w-full max-w-lg">

                <!-- 1. Code: one title, one field, one button. A wrong code stays on this screen with a sentence that says what to do. -->
                <div x-show="state === 'input' || state === 'checking'" class="text-center">
                    <div class="animate-in">
                        <h1 class="font-serif text-3xl md:text-4xl font-light mb-10 leading-tight" x-text="t('title')">Sisesta kaardil olev kood.</h1>
                    </div>
                    <div class="animate-in-delay">
                        <form @submit.prevent="check()" class="max-w-sm mx-auto" novalidate>
                            <label for="code" class="sr-only" x-text="t('codeLabel')">Kood</label>
                            <input id="code" type="text" x-model="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" enterkeyhint="go" placeholder="SK000-XXXX-XXXX" class="l-input l-code mb-3" :aria-invalid="!!error" aria-describedby="code-error" required>
                            <p id="code-error" x-show="error" x-cloak class="text-sm text-accent font-sans font-light text-center mb-6" x-text="error" role="alert"></p>
                            <button type="submit" :disabled="state === 'checking' || !code.trim()" class="p-btn w-full mt-4 disabled:opacity-50" x-text="state === 'checking' ? t('checking') : t('open')">Ava kodu</button>
                        </form>
                    </div>
                </div>

                <!-- 2a. Arco card: the home is already prepared. Nothing to type. -->
                <div x-show="state === 'welcome'" x-cloak class="text-center">
                    <p class="eyebrow text-accent mb-6" x-text="t('welcomeKicker')"></p>
                    <h1 class="font-serif text-3xl md:text-4xl font-light mb-2 leading-tight" x-text="home.address || t('welcomeTitle')"></h1>
                    <p class="text-sm text-muted font-sans font-light mb-10" x-show="home.project" x-text="home.project"></p>
                    <div class="bg-white border border-line divide-y divide-line mb-10 text-left">
                        <template x-for="(line, i) in welcomeLines()" :key="i">
                            <p class="px-5 py-4 font-sans text-sm font-light leading-relaxed" x-text="line"></p>
                        </template>
                    </div>
                    <button type="button" @click="openHome()" :disabled="codeBusy" class="p-btn w-full sm:w-auto sm:min-w-[16rem] disabled:opacity-50" x-text="codeBusy ? t('opening') : t('open')"></button>
                </div>

                <!-- 2b. Housekeeper's invitation: three required fields, the rest optional and folded away -->
                <div x-show="(state === 'invite' || state === 'sending') && !welcome" x-cloak>
                    <div class="text-center mb-10">
                        <p class="eyebrow text-accent mb-6" x-text="t('inviteKicker') + ' · ' + code"></p>
                        <h1 class="font-serif text-3xl md:text-4xl font-light mb-5 leading-tight" x-text="t('inviteTitle', { name: provider.firstName })"></h1>
                        <p class="text-sm text-muted font-sans font-light leading-relaxed max-w-md mx-auto" x-text="t('inviteLead', { name: providerFullName() })"></p>
                    </div>

                    <form @submit.prevent="redeem()" class="bg-white border border-line p-6 md:p-8 font-sans" novalidate>
                        <p class="eyebrow text-accent mb-6" x-text="t('yourHome')"></p>
                        <div class="grid sm:grid-cols-2 gap-5">
                            <div><label for="f-name" class="eyebrow mb-1" x-text="t('name')"></label><input id="f-name" type="text" x-model="form.name" required autocomplete="name" class="l-input"></div>
                            <div><label for="f-email" class="eyebrow mb-1" x-text="t('email')"></label><input id="f-email" type="email" x-model="form.email" required autocomplete="email" inputmode="email" class="l-input"></div>
                            <div class="sm:col-span-2"><label for="f-address" class="eyebrow mb-1" x-text="t('address')"></label><input id="f-address" type="text" x-model="form.address" required autocomplete="street-address" class="l-input"></div>
                            <div><label for="f-phone" class="eyebrow mb-1" x-text="t('phoneOpt')"></label><input id="f-phone" type="tel" x-model="form.phone" autocomplete="tel" inputmode="tel" class="l-input"></div>
                            <div><label for="f-size" class="eyebrow mb-1" x-text="t('size')"></label>
                                <select id="f-size" x-model="form.size" class="l-input bg-transparent">
                                    <option value="small" x-text="t('sizeSmall')"></option>
                                    <option value="medium" x-text="t('sizeMedium')"></option>
                                    <option value="large" x-text="t('sizeLarge')"></option>
                                </select>
                            </div>
                        </div>

                        <!-- Second household member: one link opens two fields -->
                        <div class="mt-8">
                            <button type="button" x-show="!showContact2" @click="showContact2 = true" class="text-sm font-sans font-light text-black border-b border-accent hover:text-accent transition-colors" x-text="t('addContact')"></button>
                            <div x-show="showContact2" x-cloak>
                                <p class="eyebrow text-accent mb-1" x-text="t('contact2Title')"></p>
                                <p class="text-sm text-muted font-light mb-5 leading-relaxed" x-text="t('contact2Hint')"></p>
                                <div class="grid sm:grid-cols-2 gap-5">
                                    <div><label for="f-c2name" class="eyebrow mb-1" x-text="t('name')"></label><input id="f-c2name" type="text" x-model="form.contact2.name" autocomplete="off" class="l-input"></div>
                                    <div><label for="f-c2email" class="eyebrow mb-1" x-text="t('email')"></label><input id="f-c2email" type="email" x-model="form.contact2.email" autocomplete="off" inputmode="email" class="l-input"></div>
                                </div>
                            </div>
                        </div>

                        <label class="flex items-start gap-3 mt-10 text-sm text-muted font-light leading-relaxed cursor-pointer">
                            <input type="checkbox" x-model="form.consent" required class="mt-1 accent-black">
                            <span>
                                <span x-show="lang === 'et'">Nõustun <a href="/tingimused" target="_blank" class="text-black border-b border-accent hover:text-accent">tingimuste</a> ja <a href="/privaatsus" target="_blank" class="text-black border-b border-accent hover:text-accent">privaatsuspoliitikaga</a>. Minu andmeid näeb ainult kaardil nimetatud koduhooldaja.</span>
                                <span x-show="lang === 'en'" x-cloak>I agree to the <a href="/tingimused" target="_blank" class="text-black border-b border-accent hover:text-accent">terms</a> and the <a href="/privaatsus" target="_blank" class="text-black border-b border-accent hover:text-accent">privacy policy</a>. Only the housekeeper named on the card sees my details.</span>
                                <span x-show="lang === 'ru'" x-cloak>Я принимаю <a href="/tingimused" target="_blank" class="text-black border-b border-accent hover:text-accent">условия</a> и <a href="/privaatsus" target="_blank" class="text-black border-b border-accent hover:text-accent">политику конфиденциальности</a>. Мои данные видит только помощница по дому, указанная на карте.</span>
                            </span>
                        </label>

                        <p x-show="error" x-cloak class="text-sm text-accent font-light mt-6" x-text="error" role="alert"></p>
                        <button type="submit" :disabled="state === 'sending'" class="p-btn w-full mt-8 disabled:opacity-50" x-text="state === 'sending' ? t('sending') : t('openMine')"></button>
                        <p class="text-center mt-6">
                            <button type="button" @click="reset()" class="text-sm font-sans font-light text-muted hover:text-black transition-colors" x-text="t('otherCode')"></button>
                        </p>
                    </form>
                </div>

                <!-- 3. Outcomes: one sentence on what happened, one sentence on what to do, one button -->
                <div x-show="['done', 'used', 'unassigned', 'legacy', 'already'].includes(state)" x-cloak class="text-center">
                    <div class="animate-in">
                        <p class="eyebrow text-accent mb-6" x-text="outcome().kicker"></p>
                        <h1 class="font-serif text-3xl md:text-4xl font-light mb-6 leading-tight" x-text="outcome().title"></h1>
                    </div>
                    <div class="animate-in-delay">
                        <p class="text-sm text-muted font-sans font-light leading-relaxed mb-10 max-w-md mx-auto" x-text="outcome().text"></p>
                        <a :href="outcome().href" class="p-btn w-full sm:w-auto sm:min-w-[16rem]" x-text="outcome().cta"></a>
                        <p class="mt-6" x-show="outcome().second">
                            <a x-show="outcome().secondHref" :href="outcome().secondHref" class="text-sm font-sans font-light text-muted hover:text-black transition-colors border-b border-line hover:border-black" x-text="outcome().second"></a>
                            <button x-show="!outcome().secondHref" type="button" @click="reset()" class="text-sm font-sans font-light text-muted hover:text-black transition-colors" x-text="outcome().second"></button>
                        </p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer: contact and the two legal pages, nothing else -->
        <footer class="border-t border-line py-6 px-6 md:px-12">
            <p class="text-xs text-muted font-sans font-light text-center leading-relaxed">
                <a href="mailto:tere@sukoda.ee" class="hover:text-black transition-colors">tere@sukoda.ee</a>
                <span class="text-muted-light mx-2" aria-hidden="true">·</span>
                <a href="/tingimused" class="hover:text-black transition-colors" x-text="t('terms')"></a>
                <span class="text-muted-light mx-2" aria-hidden="true">·</span>
                <a href="/privaatsus" class="hover:text-black transition-colors" x-text="t('privacy')"></a>
            </p>
        </footer>

    </div>

    <script>
    function lunastaApp() {
        const LANGS = ['et', 'en', 'ru'];
        const saved = localStorage.getItem('sukoda_lang');
        return {
            lang: LANGS.includes(saved) ? saved : 'et',
            state: 'input', // input | checking | invite | welcome | sending | done | used | unassigned | legacy | already
            code: '',
            error: '',
            welcome: false,
            home: { address: '', project: '', name: '', email: '', warranty: '', lines: [] },
            codeBusy: false,
            cardToken: '',
            provider: { firstName: '', name: '', businessName: '' },
            form: { name: '', email: '', phone: '', address: '', size: 'medium', weekday: 2, time: '10:00', flowerPreference: '', linens: '', contact2: { name: '', email: '' }, consent: false },
            showContact2: false,
            doneEmail: '',

            T: {
                skip: { et: 'Sisu juurde', en: 'Skip to content', ru: 'К содержимому' },
                navLabel: { et: 'Peamenüü', en: 'Main navigation', ru: 'Главное меню' },
                langLabel: { et: 'Keel', en: 'Language', ru: 'Язык' },
                title: { et: 'Sisesta kaardil olev kood.', en: 'Enter the code on your card.', ru: 'Введите код с карты.' },
                codeLabel: { et: 'Kood', en: 'Code', ru: 'Код' },
                open: { et: 'Ava kodu', en: 'Open my home', ru: 'Открыть дом' },
                opening: { et: 'Avan…', en: 'Opening…', ru: 'Открываем…' },
                checking: { et: 'Kontrollin…', en: 'Checking…', ru: 'Проверяем…' },
                sending: { et: 'Saadan…', en: 'Sending…', ru: 'Отправляем…' },
                errEmpty: { et: 'Kirjuta kood nii, nagu see on kaardil.', en: 'Type the code exactly as it is on the card.', ru: 'Введите код так, как он напечатан на карте.' },
                errNotFound: { et: 'Koodi ei leitud. Kontrolli tähti ja numbreid või kirjuta tere@sukoda.ee.', en: 'We could not find this code. Check the letters and numbers, or write to tere@sukoda.ee.', ru: 'Код не найден. Проверьте буквы и цифры или напишите на tere@sukoda.ee.' },
                errMany: { et: 'Liiga palju katseid. Proovi mõne minuti pärast uuesti.', en: 'Too many attempts. Try again in a few minutes.', ru: 'Слишком много попыток. Попробуйте через несколько минут.' },
                errNet: { et: 'Ühendus katkes. Proovi uuesti.', en: 'The connection failed. Try again.', ru: 'Нет соединения. Попробуйте ещё раз.' },
                errConsent: { et: 'Märgi nõusolek, et jätkata.', en: 'Tick the consent box to continue.', ru: 'Отметьте согласие, чтобы продолжить.' },
                errRequired: { et: 'Täida nimi, e-post ja aadress.', en: 'Fill in your name, e-mail and address.', ru: 'Заполните имя, электронную почту и адрес.' },

                welcomeKicker: { et: 'Sinu uus kodu', en: 'Your new home', ru: 'Ваш новый дом' },
                welcomeTitle: { et: 'Kodu on sinu.', en: 'The home is yours.', ru: 'Дом ваш.' },

                inviteKicker: { et: 'Kutse', en: 'Invitation', ru: 'Приглашение' },
                inviteTitle: { et: '{name} kutsub sind SUKODA-sse.', en: '{name} invites you to SUKODA.', ru: '{name} приглашает вас в SUKODA.' },
                inviteLead: { et: '{name} hoolitseb sinu kodu eest. Täida oma andmed ja sinu kodu on portaalis.', en: '{name} looks after your home. Fill in your details and your home is in the portal.', ru: '{name} ухаживает за вашим домом. Заполните данные, и ваш дом появится в портале.' },
                yourHome: { et: 'Sinu kodu', en: 'Your home', ru: 'Ваш дом' },
                name: { et: 'Nimi', en: 'Name', ru: 'Имя' },
                email: { et: 'E-post', en: 'E-mail', ru: 'Электронная почта' },
                address: { et: 'Aadress', en: 'Address', ru: 'Адрес' },
                phoneOpt: { et: 'Telefon (valikuline)', en: 'Phone (optional)', ru: 'Телефон (по желанию)' },
                size: { et: 'Kodu suurus', en: 'Home size', ru: 'Размер дома' },
                sizeSmall: { et: '1–2 tuba', en: '1–2 rooms', ru: '1–2 комнаты' },
                sizeMedium: { et: '3 tuba', en: '3 rooms', ru: '3 комнаты' },
                sizeLarge: { et: '4 või rohkem tuba või maja', en: '4 or more rooms, or a house', ru: '4 и более комнат или дом' },
                addContact: { et: 'Lisa teine pereliige', en: 'Add a second household member', ru: 'Добавить второго члена семьи' },
                contact2Title: { et: 'Teine pereliige', en: 'Second household member', ru: 'Второй член семьи' },
                contact2Hint: { et: 'Teine pereliige saab samad kalendrikutsed ja teated.', en: 'A second household member gets the same calendar invites and notices.', ru: 'Второй член семьи получает те же приглашения в календарь и уведомления.' },
                openMine: { et: 'Ava minu kodu', en: 'Open my home', ru: 'Открыть мой дом' },
                otherCode: { et: 'Sisesta teine kood', en: 'Enter another code', ru: 'Ввести другой код' },

                welcomeBack: { et: 'Tere tulemast', en: 'Welcome', ru: 'Добро пожаловать' },
                doneWelcomeTitle: { et: 'Sinu kodu on valmis.', en: 'Your home is ready.', ru: 'Ваш дом готов.' },
                doneWelcomeText: { et: 'Saatsime aadressile {email} sisenemislingi. Portaalis valid esimese koristuse aja.', en: 'We sent a login link to {email}. In the portal you pick the time for your first cleaning.', ru: 'Мы отправили ссылку для входа на {email}. В портале вы выберете время первой уборки.' },
                doneInviteTitle: { et: 'Sinu kodu on portaalis.', en: 'Your home is in the portal.', ru: 'Ваш дом в портале.' },
                doneInviteText: { et: 'Saatsime aadressile {email} sisenemislingi, parooli ei ole. {name} lisab ajad ja iga visiit tuleb sulle kalendrikutsena.', en: 'We sent a login link to {email}; there is no password. {name} adds the times and every visit arrives as a calendar invite.', ru: 'Мы отправили ссылку для входа на {email}, пароль не нужен. {name} добавит время визитов, и каждый визит придёт приглашением в календарь.' },
                login: { et: 'Sisene portaali', en: 'Log in to the portal', ru: 'Войти в портал' },
                write: { et: 'Kirjuta tere@sukoda.ee', en: 'Write to tere@sukoda.ee', ru: 'Написать на tere@sukoda.ee' },
                card: { et: 'Kaart', en: 'Card', ru: 'Карта' },
                usedTitle: { et: 'See kaart on juba kasutatud.', en: 'This card has already been used.', ru: 'Эта карта уже использована.' },
                usedText: { et: 'Kui kodu on juba portaalis, sisene oma e-postiga. Kui ei ole, kirjuta tere@sukoda.ee.', en: 'If your home is already in the portal, log in with your e-mail. If it is not, write to tere@sukoda.ee.', ru: 'Если ваш дом уже в портале, войдите по адресу электронной почты. Если нет, напишите на tere@sukoda.ee.' },
                alreadyKicker: { et: 'Juba portaalis', en: 'Already in the portal', ru: 'Уже в портале' },
                alreadyTitle: { et: 'Sinu kodu on juba portaalis.', en: 'Your home is already in the portal.', ru: 'Ваш дом уже в портале.' },
                alreadyText: { et: 'Sinu e-postiga on kodu juba portaalis ja kaart jäi kasutamata. Sisene oma e-postiga.', en: 'A home with your e-mail is already in the portal and the card stays unused. Log in with your e-mail.', ru: 'Дом с вашим адресом электронной почты уже в портале, карта осталась неиспользованной. Войдите по адресу электронной почты.' },
                unassignedTitle: { et: 'See kaart ei ole veel aktiivne.', en: 'This card is not active yet.', ru: 'Эта карта ещё не активна.' },
                unassignedText: { et: 'Kaart hakkab tööle, kui koduhooldaja on kaardi enda nimele võtnud. Küsi oma koduhooldajalt või kirjuta tere@sukoda.ee.', en: 'The card starts working once the housekeeper has taken the card under their name. Ask your housekeeper, or write to tere@sukoda.ee.', ru: 'Карта заработает, когда помощница по дому оформит карту на своё имя. Спросите у неё или напишите на tere@sukoda.ee.' },
                giftKicker: { et: 'Kinkekaart', en: 'Gift card', ru: 'Подарочная карта' },
                legacyTitle: { et: 'Sinu kinkekaart kehtib.', en: 'Your gift card is valid.', ru: 'Ваша подарочная карта действует.' },
                legacyText: { et: 'SUKODA ise koristust enam ei tee. Kirjuta meile koos koodiga ja lepime kokku, kas kingitus läheb partneri kaudu või tagastame raha.', en: 'SUKODA no longer does the cleaning itself. Write to us with the code and we agree together whether the gift goes through a partner or we refund it.', ru: 'SUKODA больше не проводит уборку сама. Напишите нам, указав код, и мы вместе решим: подарок через партнёра или возврат денег.' },

                terms: { et: 'Tingimused', en: 'Terms', ru: 'Условия' },
                privacy: { et: 'Privaatsus', en: 'Privacy', ru: 'Конфиденциальность' },
            },
            t(key, vars) {
                const row = this.T[key] || {};
                const s = row[this.lang] || row.et || key;
                return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : s;
            },

            init() {
                this.$watch('lang', (v) => { localStorage.setItem('sukoda_lang', v); document.documentElement.lang = v; });
                document.documentElement.lang = this.lang;
                // Code may arrive as ?code= / ?kood=, as a hash (#SK219-XXXX-XXXX) or appended to the path (/lunasta/SK219-...)
                const p = new URLSearchParams(location.search);
                const fromPath = location.pathname.replace(/^\/lunasta\/?/, '').split('/')[0];
                const raw = p.get('code') || p.get('kood') || (location.hash || '').replace(/^#/, '') || fromPath || '';
                if (raw) { this.code = decodeURIComponent(raw).trim().toUpperCase(); this.check(); }
            },

            providerFullName() {
                return this.provider.businessName ? `${this.provider.name} · ${this.provider.businessName}` : this.provider.name;
            },

            // Backend errors arrive as { et, en, ru } or, from older handlers, as one Estonian sentence.
            errText(err, fallbackKey) {
                if (err && typeof err === 'object') return err[this.lang] || err.et || this.t(fallbackKey);
                if (typeof err === 'string' && err.trim()) return err;
                return this.t(fallbackKey);
            },

            async post(path, body) {
                const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                const data = await res.json().catch(() => ({}));
                return { ok: res.ok, status: res.status, data };
            },

            async check() {
                const code = this.code.trim();
                if (!code) { this.error = this.t('errEmpty'); return; }
                this.error = ''; this.state = 'checking';
                try {
                    const r = await this.post('/api/lunasta/validate', { code });
                    if (r.status === 429) { this.error = this.t('errMany'); this.state = 'input'; return; }
                    if (!r.ok && !r.data.state) { this.error = this.errText(r.data.error, 'errNotFound'); this.state = 'input'; return; }
                    this.code = r.data.code || code;
                    if (r.data.state === 'welcome') {
                        this.welcome = true;
                        this.home = r.data.home || this.home;
                        this.cardToken = r.data.token || '';
                        this.state = 'welcome';
                    }
                    else if (r.data.state === 'invite') { this.provider = r.data.provider || this.provider; this.state = 'invite'; }
                    else if (r.data.state === 'notfound' || !r.data.state) { this.error = this.t('errNotFound'); this.state = 'input'; }
                    else this.state = r.data.state;
                } catch (e) {
                    this.error = this.t('errNet');
                    this.state = 'input';
                }
            },

            async redeem() {
                if (!this.form.name.trim() || !this.form.email.trim() || !this.form.address.trim()) { this.error = this.t('errRequired'); return; }
                if (!this.form.consent) { this.error = this.t('errConsent'); return; }
                this.error = ''; this.state = 'sending';
                try {
                    const r = await this.post('/api/lunasta/redeem', { code: this.code, lang: this.lang, ...this.form });
                    if (r.status === 429) { this.error = this.t('errMany'); this.state = 'invite'; return; }
                    if (r.ok) { this.doneEmail = r.data.email || this.form.email; this.welcome = !!r.data.welcome || this.welcome; this.state = 'done'; return; }
                    if (r.data.state && r.data.state !== 'invite' && r.data.state !== 'welcome' && r.data.state !== 'notfound') { this.state = r.data.state; return; }
                    this.error = this.errText(r.data.error, 'errNet');
                    this.state = this.welcome ? 'welcome' : 'invite';
                } catch (e) {
                    this.error = this.t('errNet');
                    this.state = this.welcome ? 'welcome' : 'invite';
                }
            },

            reset() {
                this.state = 'input'; this.code = ''; this.error = ''; this.welcome = false;
                this.home = { address: '', project: '', email: '', warranty: '', lines: [] };
                history.replaceState({}, '', '/lunasta');
                this.$nextTick(() => document.getElementById('code')?.focus());
            },

            // What is already inside the prepared home. Facts come from the developer's handover; the words are ours.
            welcomeLines() {
                const lines = [
                    { et: 'Kodu dokumendid ja seadmete juhendid on juba sees.', en: 'Your home documents and appliance guides are already here.', ru: 'Документы на дом и инструкции к технике уже внутри.' },
                    { et: 'ARCO Vara kinkis sulle esimese koristuse. Aja valid portaalis.', en: 'ARCO Vara has given you your first cleaning. You pick the time in the portal.', ru: 'ARCO Vara дарит вам первую уборку. Время вы выберете в портале.' },
                    { et: 'Kui midagi on katki, saada foto ja lühike kirjeldus otse portaalist.', en: 'If something is broken, send a photo and a short description from the portal.', ru: 'Если что-то сломалось, отправьте фото и короткое описание прямо из портала.' },
                ];
                return lines.map((row) => row[this.lang] || row.et);
            },

            openHome() {
                if (this.codeBusy) return;
                this.codeBusy = true;
                if (this.cardToken) localStorage.setItem('sukoda_portal_token', this.cardToken);
                window.location.href = '/minu';
            },

            outcome() {
                const mailHref = 'mailto:tere@sukoda.ee?subject=SUKODA%20kaart%20' + encodeURIComponent(this.code);
                const first = this.provider.firstName || '';
                switch (this.state) {
                    case 'done': return this.welcome
                        ? { kicker: this.t('welcomeBack'), title: this.t('doneWelcomeTitle'), text: this.t('doneWelcomeText', { email: this.doneEmail }), href: '/minu', cta: this.t('open'), second: '' }
                        : { kicker: this.t('welcomeBack'), title: this.t('doneInviteTitle'), text: this.t('doneInviteText', { email: this.doneEmail, name: first }), href: '/minu', cta: this.t('login'), second: '' };
                    case 'used': return { kicker: this.t('card'), title: this.t('usedTitle'), text: this.t('usedText'), href: '/minu', cta: this.t('login'), second: this.t('write'), secondHref: mailHref };
                    case 'already': return { kicker: this.t('alreadyKicker'), title: this.t('alreadyTitle'), text: this.t('alreadyText'), href: '/minu', cta: this.t('login'), second: this.t('otherCode'), secondHref: '' };
                    case 'unassigned': return { kicker: this.t('card'), title: this.t('unassignedTitle'), text: this.t('unassignedText'), href: mailHref, cta: this.t('write'), second: this.t('otherCode'), secondHref: '' };
                    case 'legacy': return { kicker: this.t('giftKicker'), title: this.t('legacyTitle'), text: this.t('legacyText'), href: mailHref, cta: this.t('write'), second: this.t('otherCode'), secondHref: '' };
                    default: return { kicker: '', title: '', text: '', href: '/lunasta', cta: '', second: '' };
                }
            },
        };
    }
    </script>
